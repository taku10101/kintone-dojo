<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kintone 過去問道場</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap"
    />
    <style>
      :root {
        --bg: #edf0f4;
        --surface: #fff;
        --fg: #17202d;
        --muted: #586376;
        --line: #d3dae3;
        --chip: #e2e7ee;
        --accent: #1d5fa6;
        --accent-ink: #fff;
        --ok: #1a7f4b;
        --ok-bg: #e0f3e8;
        --ng: #bf3a08;
        --ng-bg: #fbe5da;
        --warn: #9a6b00;
        --font:
          "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #10141a;
          --surface: #19202a;
          --fg: #e6eaf0;
          --muted: #9aa5b4;
          --line: #2c3442;
          --chip: #232b37;
          --accent: #72aaea;
          --accent-ink: #0e1520;
          --ok: #5fcf92;
          --ok-bg: #16301f;
          --ng: #f2934f;
          --ng-bg: #3a2416;
          --warn: #e2b54a;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #10141a;
        --surface: #19202a;
        --fg: #e6eaf0;
        --muted: #9aa5b4;
        --line: #2c3442;
        --chip: #232b37;
        --accent: #72aaea;
        --accent-ink: #0e1520;
        --ok: #5fcf92;
        --ok-bg: #16301f;
        --ng: #f2934f;
        --ng-bg: #3a2416;
        --warn: #e2b54a;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
        line-height: 1.7;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      .bar {
        max-width: 860px;
        margin: 0 auto;
        padding: 10px 16px;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .bar h1 {
        font-size: 17px;
        margin: 0 auto 0 0;
      }
      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 16px;
      }
      button,
      select {
        font: inherit;
      }
      .btn {
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--fg);
        border-radius: 8px;
        padding: 6px 14px;
        cursor: pointer;
      }
      .btn:hover {
        border-color: var(--accent);
      }
      .btn.primary {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: var(--accent);
        font-weight: 700;
      }
      .btn.primary:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .tab[aria-pressed="true"] {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: var(--accent);
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 18px;
        margin-bottom: 14px;
      }
      .card h2 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        border: 1px solid var(--line);
        background: var(--chip);
        border-radius: 999px;
        padding: 3px 12px;
        cursor: pointer;
        font-size: 14px;
        user-select: none;
      }
      .chip input {
        display: none;
      }
      .chip:has(input:checked) {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: var(--accent);
      }
      fieldset {
        border: 0;
        padding: 0;
        margin: 0 0 14px;
      }
      legend {
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 6px;
      }
      .count {
        font-size: 14px;
        margin: 6px 0 12px;
      }
      .progress {
        height: 6px;
        background: var(--chip);
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 12px;
      }
      .progress > div {
        height: 100%;
        background: var(--accent);
      }
      .qmeta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .tag {
        background: var(--chip);
        border-radius: 4px;
        padding: 0 8px;
      }
      .qtext {
        white-space: pre-wrap;
        font-size: 16px;
        margin: 0 0 6px;
      }
      .hint {
        font-size: 13px;
        font-weight: 700;
        color: var(--accent);
        margin-bottom: 12px;
      }
      .choice {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        width: 100%;
        text-align: left;
        border: 1.5px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 8px;
        background: var(--surface);
        color: var(--fg);
        cursor: pointer;
      }
      .choice .k {
        flex: none;
        width: 28px;
        height: 28px;
        border-radius: 6px;
        border: 1.5px solid var(--line);
        display: grid;
        place-items: center;
        font-weight: 700;
      }
      .choice.sel {
        border-color: var(--accent);
      }
      .choice.sel .k {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: var(--accent);
      }
      .choice .t {
        white-space: pre-wrap;
        flex: 1;
      }
      .choice.done {
        cursor: default;
      }
      .choice.right {
        border-color: var(--ok);
        background: var(--ok-bg);
      }
      .choice.wrong {
        border-color: var(--ng);
        background: var(--ng-bg);
      }
      .exp {
        font-size: 14px;
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px dashed var(--line);
      }
      .exp a {
        color: var(--accent);
      }
      .mark {
        font-weight: 700;
        margin-right: 4px;
      }
      .mark.ok {
        color: var(--ok);
      }
      .mark.ng {
        color: var(--ng);
      }
      .verdict {
        font-size: 22px;
        font-weight: 700;
        margin: 4px 0 8px;
      }
      .verdict.ok {
        color: var(--ok);
      }
      .verdict.ng {
        color: var(--ng);
      }
      .summary {
        background: var(--chip);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 14px;
        margin: 8px 0;
      }
      .note {
        color: var(--warn);
        font-size: 13px;
        margin-top: 6px;
      }
      .nav {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-top: 12px;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px;
      }
      .kpi {
        background: var(--chip);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .kpi b {
        display: block;
        font-size: 24px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      td,
      th {
        padding: 6px 4px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      th {
        color: var(--muted);
        font-weight: 400;
        font-size: 12px;
      }
      .meter {
        height: 8px;
        background: var(--chip);
        border-radius: 4px;
        overflow: hidden;
        min-width: 80px;
      }
      .meter > div {
        height: 100%;
        background: var(--ok);
      }
      .heat {
        display: grid;
        grid-template-columns: repeat(15, 1fr);
        gap: 3px;
      }
      .cell {
        aspect-ratio: 1;
        border-radius: 3px;
        background: var(--chip);
        font-size: 9px;
        display: grid;
        place-items: center;
        color: var(--muted);
        cursor: pointer;
        border: 0;
        padding: 0;
      }
      .cell.c-ok {
        background: var(--ok);
        color: var(--accent-ink);
      }
      .cell.c-ng {
        background: var(--ng);
        color: var(--accent-ink);
      }
      .cell.c-mix {
        background: var(--warn);
        color: var(--accent-ink);
      }
      .legend {
        display: flex;
        gap: 12px;
        font-size: 12px;
        color: var(--muted);
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: 4px;
        vertical-align: -1px;
      }
      .hidden {
        display: none !important;
      }
      kbd {
        font-size: 11px;
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 0 4px;
      }
      button,
      .chip {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      .tbl {
        overflow-x: auto;
      }
      @media (hover: none) {
        .kbd-hint {
          display: none;
        }
      }
      @media (max-width: 560px) {
        main {
          padding: 12px 12px calc(84px + env(safe-area-inset-bottom));
        }
        .card {
          padding: 14px;
        }
        .heat {
          grid-template-columns: repeat(9, 1fr);
        }
        .qtext {
          font-size: 15px;
        }
        .chip {
          padding: 6px 14px;
        }
        .choice {
          padding: 14px 12px;
        }
        .nav {
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          margin: 0;
          z-index: 6;
          padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
          background: var(--surface);
          border-top: 1px solid var(--line);
        }
        .nav .btn {
          padding: 12px 14px;
        }
        .nav #act {
          flex: 1;
        }
        .col-meter,
        td.col-meter {
          display: none;
        }
        .stats-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <h1>kintone 過去問道場</h1>
        <button class="btn tab" data-view="setup" aria-pressed="true">
          出題設定
        </button>
        <button class="btn tab" data-view="stats" aria-pressed="false">
          成績
        </button>
      </div>
    </header>
    <main>
      <!-- 出題設定 -->
      <section id="v-setup">
        <div class="card">
          <h2>出題条件</h2>
          <fieldset>
            <legend>練習問題セット</legend>
            <div class="chips" id="f-set"></div>
          </fieldset>
          <fieldset>
            <legend>カテゴリ</legend>
            <div class="chips" id="f-cat"></div>
          </fieldset>
          <fieldset>
            <legend>対象</legend>
            <div class="chips" id="f-target">
              <label class="chip"
                ><input
                  type="radio"
                  name="target"
                  value="all"
                  checked
                />全問</label
              >
              <label class="chip"
                ><input
                  type="radio"
                  name="target"
                  value="unanswered"
                />未回答</label
              >
              <label class="chip"
                ><input
                  type="radio"
                  name="target"
                  value="wrong"
                />前回不正解</label
              >
              <label class="chip"
                ><input
                  type="radio"
                  name="target"
                  value="weak"
                />苦手（正答率80%未満）</label
              >
            </div>
          </fieldset>
          <fieldset>
            <legend>形式</legend>
            <div class="chips">
              <label class="chip"
                ><input
                  type="radio"
                  name="kind"
                  value="any"
                  checked
                />すべて</label
              >
              <label class="chip"
                ><input type="radio" name="kind" value="single" />1つ選ぶ</label
              >
              <label class="chip"
                ><input
                  type="radio"
                  name="kind"
                  value="multi"
                />すべて選ぶ</label
              >
            </div>
          </fieldset>
          <fieldset>
            <legend>出題順</legend>
            <div class="chips">
              <label class="chip"
                ><input
                  type="radio"
                  name="order"
                  value="seq"
                  checked
                />番号順</label
              >
              <label class="chip"
                ><input type="radio" name="order" value="rand" />ランダム</label
              >
            </div>
          </fieldset>
          <fieldset>
            <legend>出題数</legend>
            <div class="chips">
              <label class="chip"
                ><input type="radio" name="limit" value="10" />10問</label
              >
              <label class="chip"
                ><input type="radio" name="limit" value="20" />20問</label
              >
              <label class="chip"
                ><input type="radio" name="limit" value="45" />45問</label
              >
              <label class="chip"
                ><input
                  type="radio"
                  name="limit"
                  value="0"
                  checked
                />全部</label
              >
            </div>
          </fieldset>
          <div class="count" id="match"></div>
          <div class="row">
            <button class="btn primary" id="start">この条件で始める</button>
            <button class="btn hidden" id="resume">続きから</button>
          </div>
        </div>
        <p class="muted kbd-hint">
          選択肢は数字キー <kbd>1</kbd>〜<kbd>4</kbd> か <kbd>A</kbd>〜<kbd
            >D</kbd
          >
          で選び、<kbd>Enter</kbd>
          で回答・次へ。
        </p>
        <p class="muted" id="sync">成績はこのブラウザーにだけ保存されます。</p>
      </section>

      <!-- 出題 -->
      <section id="v-quiz" class="hidden">
        <div
          class="row muted"
          style="justify-content: space-between; margin-bottom: 6px"
        >
          <span id="pos"></span><span id="score"></span>
        </div>
        <div class="progress"><div id="bar" style="width: 0"></div></div>
        <div class="card" id="qcard"></div>
        <div class="nav">
          <button class="btn" id="prev">← 前へ</button>
          <button class="btn" id="quit">やめる</button>
          <button class="btn primary" id="act">回答する</button>
        </div>
      </section>

      <!-- 結果 -->
      <section id="v-result" class="hidden">
        <div class="card" id="rcard"></div>
      </section>

      <!-- 成績 -->
      <section id="v-stats" class="hidden"></section>
    </main>

    <script>
      const QUESTIONS = [{"id": "1-01", "set": 1, "no": 1, "category": "アプリ", "question": "「アプリの設定」→「フォーム」タブで、「テーブル」を配置し、「数値」フィールドで設定した「単価」と「個数」を掛け算した結果を「小計」に表示している。\n「個数」が未入力のときに表示される内容として、誤っているものをすべて選びなさい。", "answer": ["A", "B", "C"], "multi": true, "choices": [{"key": "A", "text": "「小計」の欄に「#VALUE!」というエラーメッセージが表示される。", "help": "計算対象のフィールドが未入力の場合の計算結果", "url": "https://jp.kintone.help/k/ja/id/040505#autocalc_if_function_1030", "textRef": "2-4-3 計算式"}, {"key": "B", "text": "「小計」の欄に「#N/A!」というエラーメッセージが表示される。", "help": "計算対象のフィールドが未入力の場合の計算結果", "url": "https://jp.kintone.help/k/ja/id/040505#autocalc_if_function_1030", "textRef": "2-4-3 計算式"}, {"key": "C", "text": "「個数」の欄に「#VALUE!」というエラーメッセージが表示される。", "help": "計算対象のフィールドが未入力の場合の計算結果", "url": "https://jp.kintone.help/k/ja/id/040505#autocalc_if_function_1030", "textRef": "2-4-3 計算式"}, {"key": "D", "text": "「小計」の欄に「個数」が「0」として計算した結果が表示される。", "help": "計算対象のフィールドが未入力の場合の計算結果", "url": "https://jp.kintone.help/k/ja/id/040505#autocalc_if_function_1030", "textRef": "2-4-3 計算式"}], "exam": "2026年4月30日改定", "exp": {"summary": "数値型フィールドが未入力のときは「0」とみなして計算される。エラー表示にはならない。", "choices": {"A": "誤り。参照先の数値型フィールドが未入力なら「0」とみなして計算されるので、「#VALUE!」は表示されない。", "B": "誤り。未入力の数値フィールドは「0」として計算されるので、「#N/A!」のようなエラーは出ない。", "C": "誤り。エラーを表示するのは計算結果の側で、入力欄の「個数」にエラーが出ることはない。そもそも未入力は「0」扱いになるのでエラーにならない。", "D": "正しい。数値型フィールドが参照されていて未入力の場合、「0」とみなして計算される（単価×0）。"}, "note": ""}}, {"id": "1-02", "set": 1, "no": 2, "category": "アプリ", "question": "「アプリの設定」→「フォーム」タブで、「文字列（1行）」フィールドに、別々のフィールドに入力されている値を結合して表示したい。\n設定する方法として、誤っているものを1つ選びなさい。", "answer": ["C"], "multi": false, "choices": [{"key": "A", "text": "文字列を結合する計算式には、フィールドコードを利用する。", "help": "[&演算子]文字や数値の結合", "url": "https://jp.kintone.help/k/ja/id/040511", "textRef": "2-4-3 計算式"}, {"key": "B", "text": "結合するフィールドに「ラジオボタン」フィールドを指定する。", "help": "[&演算子]文字や数値の結合", "url": "https://jp.kintone.help/k/ja/id/040511", "textRef": "2-4-3 計算式"}, {"key": "C", "text": "文字列を結合する演算子には、半角の「+」を使用する。", "help": "[&演算子]文字や数値の結合", "url": "https://jp.kintone.help/k/ja/id/040511", "textRef": "2-4-3 計算式"}, {"key": "D", "text": "結合するフィールドに「ドロップダウン」フィールドを指定する。", "help": "[&演算子]文字や数値の結合", "url": "https://jp.kintone.help/k/ja/id/040511", "textRef": "2-4-3 計算式"}], "exam": "2026年4月30日改定", "exp": {"summary": "文字列の結合は半角の「&」。「+」では結合されない。", "choices": {"A": "正しい。計算式ではフィールドコードでフィールドを指定する。", "B": "正しい。「&」演算子で結合できるフィールドに［ラジオボタン］が含まれる。", "C": "誤り。文字や数値の結合には半角の「&」を使う。「+」を使っても文字列は結合されない。", "D": "正しい。「&」演算子で結合できるフィールドに［ドロップダウン］が含まれる。"}, "note": ""}}, {"id": "1-03", "set": 1, "no": 3, "category": "アプリ", "question": "「アプリの設定」→「フォーム」タブで、「関連レコード一覧」フィールドの説明として、正しいものをすべて選びなさい。", "answer": ["B", "C"], "multi": true, "choices": [{"key": "A", "text": "表示するフィールドの横幅を変更できる。", "help": "関連レコードを一覧表示する", "url": "https://jp.kintone.help/k/ja/id/040550", "textRef": "2-6-1 関連レコード一覧とは"}, {"key": "B", "text": "フィールドに表示された値は、集計、自動計算の操作の対象に含まれない。", "help": "関連レコードを一覧表示する", "url": "https://jp.kintone.help/k/ja/id/040550", "textRef": "2-6-1 関連レコード一覧とは"}, {"key": "C", "text": "フィールドに表示された値は、アプリ内検索の操作の対象に含まれない。", "help": "関連レコードを一覧表示する", "url": "https://jp.kintone.help/k/ja/id/040550", "textRef": "2-6-1 関連レコード一覧とは"}, {"key": "D", "text": "フィールドに表示された値は、ファイルの書き出し権限があれば、ファイルに書き出せる。", "help": "関連レコードを一覧表示する", "url": "https://jp.kintone.help/k/ja/id/040550", "textRef": "2-6-1 関連レコード一覧とは"}], "exam": "2026年4月30日改定", "exp": {"summary": "関連レコード一覧の値は、集計・自動計算・アプリ内検索の対象にならない。表示しているだけで、データを持っていない。", "choices": {"A": "誤り（公式の正答による）。（ヘルプで直接は確認できず）表示幅を変えられるという記載はヘルプにない。", "B": "正しい。［関連レコード一覧］フィールドの値は、集計と自動計算の対象にならない。", "C": "正しい。［関連レコード一覧］フィールドの値は、アプリ内検索の対象にならない。", "D": "誤り（公式の正答による）。（ヘルプで直接は確認できず）参照先のレコードを表示しているだけなので、書き出しの対象にはならないと考えられる。"}, "note": ""}}, {"id": "1-04", "set": 1, "no": 4, "category": "アプリ", "question": "レコードの一括削除に関する説明として、誤っているものをすべて選びなさい。", "answer": ["A", "B", "C"], "multi": true, "choices": [{"key": "A", "text": "レコードを一括で削除するには、アプリの管理権限があれば良い。", "help": "レコードを一括で削除する", "url": "https://jp.kintone.help/k/ja/id/040716", "textRef": "1-4-6 レコードの一括削除"}, {"key": "B", "text": "レコード一覧画面で絞り込んだ結果にかかわらず、すべてのレコードを一括で削除できる。", "help": "レコードを一括で削除する", "url": "https://jp.kintone.help/k/ja/id/040716", "textRef": "1-4-6 レコードの一括削除"}, {"key": "C", "text": "一括で削除できるレコードの数は、一度に1,000件までである。", "help": "レコードを一括で削除する", "url": "https://jp.kintone.help/k/ja/id/040716", "textRef": "1-4-6 レコードの一括削除"}, {"key": "D", "text": "レコードを一括で削除するためには、「アプリの設定」→「設定」タブ→「高度な設定」で、「レコード一括削除を有効にする」を選択する必要がある。", "help": "レコードを一括で削除する", "url": "https://jp.kintone.help/k/ja/id/040716", "textRef": "1-4-6 レコードの一括削除"}], "exam": "2026年4月30日改定", "exp": {"summary": "一括削除には次の3つがそろっている必要がある。［アプリ管理］と［レコード削除］の両方の権限、高度な設定での有効化、絞り込み後の表示レコードであること。上限は一度に5万件。", "choices": {"A": "誤り。［アプリ管理］だけでなく［レコード削除］にもチェックが必要。さらに、一括削除機能を有効にしておく必要がある。", "B": "誤り。［絞り込む］で条件を指定して適用したレコードが削除の対象になる。また、削除できるのは自分に削除権限のあるレコードだけ。", "C": "誤り。一度に削除できるのは1,000件ではなく、5万件まで。", "D": "正しい。［高度な設定］で［レコード一括削除を有効にする］にチェックを入れる必要がある。"}, "note": ""}}, {"id": "1-05", "set": 1, "no": 5, "category": "アプリ", "question": "アプリを作成するうえで、誤っているものをすべて選びなさい。", "answer": ["A", "B", "C"], "multi": true, "choices": [{"key": "A", "text": "「あたらしくアプリを作る」→「ほかのアプリを再利用」をクリックすると、ほかのドメインで作成したアプリを読み込むことができる。", "help": "アプリを作成する方法", "url": "https://jp.kintone.help/k/ja/id/040620", "textRef": "1-1-9 方法6：ほかのアプリを再利用して新しく作成する（アプリのコピー）"}, {"key": "B", "text": "拡張子が「.xls」のファイルを読み込んでアプリを作成できる。", "help": "アプリを作成する方法", "url": "https://jp.kintone.help/k/ja/id/040620", "textRef": "1-1-6 方法3：Excelファイルからアプリを作成する"}, {"key": "C", "text": "アプリ管理権限を持つユーザーは、JavaScriptでカスタマイズされたアプリテンプレートファイルを読み込んで、アプリを作成できる。", "help": "アプリを作成する方法", "url": "https://jp.kintone.help/k/ja/id/040620", "textRef": "1-1-8 方法5：テンプレートファイルからアプリを作成する"}, {"key": "D", "text": "アプリをテンプレート化すれば、アプリテンプレートからアプリを作成できる。", "help": "アプリを作成する方法", "url": "https://jp.kintone.help/k/ja/id/040620", "textRef": "1-1-10 方法7：登録済みのテンプレートからアプリを作成する"}], "exam": "2026年4月30日改定", "exp": {"summary": "別のドメインのアプリは「テンプレートファイルを読み込んで作成」で取り込む。「ほかのアプリを再利用」は同じ kintone 上のアプリのコピー。", "choices": {"A": "誤り。「ほかのアプリを再利用」は、すでにその kintone 上にあるアプリをコピーする方法。別の kintone のアプリは、テンプレートファイル（zip）を読み込んで作成する。", "B": "誤り（公式の正答による）。ヘルプには Excel または CSV から作成できるとあり、ファイル読み込みの対応形式は xlsx・csv・txt・tsv。「.xls」形式は含まれない。", "C": "誤り（公式の正答による）。（ヘルプで直接は確認できず）アプリの作成に必要なのはアプリ作成権限で、作成前のアプリの管理権限ではない。", "D": "正しい。kintone システム管理者が登録したテンプレートから、アプリを作成できる。"}, "note": ""}}, {"id": "1-06", "set": 1, "no": 6, "category": "アプリ", "question": "総務部に所属するAさんに、総務部では閲覧を許可していない「営業日報」アプリを閲覧させたい。\n「営業日報」アプリの「アプリの設定」→「設定」タブ→「アクセス権」で、設定する手順として、適切でないものをすべて選びなさい。", "answer": ["A", "B", "D"], "multi": true, "choices": [{"key": "A", "text": "「アクセス権」→「レコード」で、総務部にレコード閲覧権限が付与されていないことを確認し、総務部より上の行にAさんを追加しレコード閲覧権限を付与する。", "help": "アプリにアクセス権を設定する", "url": "https://jp.kintone.help/k/ja/id/040589", "textRef": "3-6-3 レコードのアクセス権"}, {"key": "B", "text": "「アクセス権」→「レコード」で、総務部にレコード閲覧権限が付与されていないことを確認し、総務部より下の行にAさんを追加しレコード閲覧権限を付与する。", "help": "アプリにアクセス権を設定する", "url": "https://jp.kintone.help/k/ja/id/040589", "textRef": "3-6-3 レコードのアクセス権"}, {"key": "C", "text": "「アクセス権」→「アプリ」で、総務部にレコード閲覧権限が付与されていないことを確認し、総務部より上の行にAさんを追加しレコード閲覧権限を付与する。", "help": "アプリにアクセス権を設定する", "url": "https://jp.kintone.help/k/ja/id/040589", "textRef": "3-6-2 アプリのアクセス権"}, {"key": "D", "text": "「アクセス権」→「アプリ」で、総務部にレコード閲覧権限が付与されていないことを確認し、総務部より下の行にAさんを追加しレコード閲覧権限を付与する。", "help": "アプリにアクセス権を設定する", "url": "https://jp.kintone.help/k/ja/id/040589", "textRef": "3-6-2 アプリのアクセス権"}], "exam": "2026年4月30日改定", "exp": {"summary": "アプリのアクセス権は［アクセス権］→［アプリ］で設定し、上の行の設定が優先される。個別に許可したいユーザーは組織より上の行に置く。", "choices": {"A": "適切でない。アプリ自体の閲覧を許可するのは［アプリのアクセス権］。（推測）レコードのアクセス権だけでは、アプリで閲覧が許可されていないユーザーには見せられない。", "B": "適切でない。設定する画面が違ううえ、総務部より下の行に置くと、上にある総務部の設定（閲覧不可）が優先される。", "C": "適切。［アプリのアクセス権］では、1人のユーザーに複数の権限があると上の行の設定が優先される。総務部より上の行にAさんを置けば、Aさんの閲覧許可が効く。", "D": "適切でない。下の行にAさんを置くと、上の行にある総務部の設定（閲覧不可）が優先され、Aさんは閲覧できない。"}, "note": ""}}, {"id": "1-07", "set": 1, "no": 7, "category": "アプリ", "question": "「アプリの設定」→「設定」タブ→「プロセス管理」の作業者について、誤っているものをすべて選びなさい。", "answer": ["B", "C"], "multi": true, "choices": [{"key": "A", "text": "作業者以外のユーザーが実行できるアクションを作成できる。", "help": "作業者以外でも実行できるアクションの設定", "url": "https://jp.kintone.help/k/ja/id/040898", "textRef": "3-3-2 プロセス管理の設定"}, {"key": "B", "text": "「ユーザー選択」フィールドがプロセス管理の作業者として設定されているとき、そのフィールドを削除した場合は誰でもアクションを実行できるようになる。", "help": "フィールドを削除する", "url": "https://jp.kintone.help/k/ja/id/040791", "textRef": "3-3-2 プロセス管理の設定"}, {"key": "C", "text": "変更履歴からステータスや作業者を過去のバージョンに戻すことができる。", "help": "レコードの変更履歴から過去のバージョンに戻す", "url": "https://jp.kintone.help/k/ja/id/040461#history_whatshistory_20", "textRef": "3-3-2 プロセス管理の設定"}, {"key": "D", "text": "プロセス管理を有効にした直後の既存のレコードのステータスには、「最初のステータス」が設定される。", "help": "基本的なプロセス管理の設定", "url": "https://jp.kintone.help/k/ja/id/040575", "textRef": "3-3-2 プロセス管理の設定"}], "exam": "2026年4月30日改定", "exp": {"summary": "作業者に指定したフィールドは削除できない。ステータスと作業者は変更履歴から戻せない。", "choices": {"A": "正しい。作業者が設定されているステータスでは、「作業者以外でも実行できるアクション」を作成できる。", "B": "誤り。プロセス管理の設定で［作業者］に指定されているフィールドは削除できない。先に設定を変更する必要がある。", "C": "誤り。プロセス管理のステータスと作業者は、過去のバージョンに戻せない。", "D": "正しい。プロセス管理を有効にする前に登録したレコードは、最初のステータスになる（作業者は設定されない）。"}, "note": ""}}, {"id": "1-08", "set": 1, "no": 8, "category": "アプリ", "question": "アプリのレコード一覧画面のショートカットキーの説明として、正しいものをすべて選びなさい。", "answer": ["A", "B", "D"], "multi": true, "choices": [{"key": "A", "text": "enter：選択したレコードの詳細を表示する。", "help": "kintoneのショートカットキー", "url": "https://jp.kintone.help/k/ja/id/040319", "textRef": "1-2-2 レコードの登録"}, {"key": "B", "text": "c：レコードを追加する。", "help": "kintoneのショートカットキー", "url": "https://jp.kintone.help/k/ja/id/040319", "textRef": "1-2-2 レコードの登録"}, {"key": "C", "text": "d：選択したレコードを削除する。", "help": "kintoneのショートカットキー", "url": "https://jp.kintone.help/k/ja/id/040319", "textRef": "1-2-2 レコードの登録"}, {"key": "D", "text": "e：選択したレコードを編集する。", "help": "kintoneのショートカットキー", "url": "https://jp.kintone.help/k/ja/id/040319", "textRef": "1-2-2 レコードの登録"}], "exam": "2026年4月30日改定", "exp": {"summary": "一覧画面のショートカットは、enter／o（詳細）、c（追加）、e（編集）、j／k（選択）、n／p（ページ）。削除の d はない。", "choices": {"A": "正しい。enter は選択したレコードの詳細を表示する。", "B": "正しい。c はレコードを追加する。", "C": "誤り。レコード一覧画面のショートカットキーに、削除の「d」はない。", "D": "正しい。e は選択したレコードを編集する。"}, "note": ""}}, {"id": "1-09", "set": 1, "no": 9, "category": "アプリ", "question": "商品の売上を管理する「売上管理アプリ」で、レコード一覧画面に「AスーパーとBコンビニの注文のうち、今月売上予定のものだけ」を表示するため、次の2つの条件を同時に満たしたい。\n\n条件：\n・顧客名が「Aスーパー」か「Bコンビニ」のいずれかと等しい\n・売上月が「今月」と等しい\n\n実現する方法として、最適なものを1つ選びなさい。", "answer": ["D"], "multi": false, "choices": [{"key": "A", "text": "絞り込み機能を拡張するため、JavaScriptを用いてカスタマイズする。", "help": "複数の条件を満たすレコードだけを表示する", "url": "https://jp.kintone.help/k/ja/id/040457", "textRef": "1-4-1 表示するレコードの絞り込み"}, {"key": "B", "text": "「Aスーパー」用の絞り込みの一覧と、「Bコンビニ」用の絞り込みの一覧をそれぞれ作成する。", "help": "複数の条件を満たすレコードだけを表示する", "url": "https://jp.kintone.help/k/ja/id/040457", "textRef": "1-4-1 表示するレコードの絞り込み"}, {"key": "C", "text": "kintone上では実現できないため、ファイルに書き出し、Excelのフィルター機能を使用する。", "help": "複数の条件を満たすレコードだけを表示する", "url": "https://jp.kintone.help/k/ja/id/040457", "textRef": "1-4-1 表示するレコードの絞り込み"}, {"key": "D", "text": "「次のいずれかと等しい」の条件を含む、絞り込みの一覧を1つ作成する。", "help": "複数の条件を満たすレコードだけを表示する", "url": "https://jp.kintone.help/k/ja/id/040457", "textRef": "1-4-1 表示するレコードの絞り込み"}], "exam": "2026年4月30日改定", "exp": {"summary": "「次のいずれかと等しい」と「すべての条件を満たす」を組み合わせれば、1つの絞り込みで実現できる。", "choices": {"A": "最適でない。標準の絞り込みで実現できるので、JavaScript カスタマイズは必要ない。", "B": "最適でない。一覧を2つに分けると、1つの一覧で両方の顧客をまとめて表示できない。", "C": "誤り。kintone の絞り込み機能で実現できる。", "D": "最適。顧客名を［次のいずれかと等しい］で「Aスーパー」「Bコンビニ」、売上月を「今月」と等しいにする。そのうえで［すべての条件を満たす］にチェックを入れる。"}, "note": ""}}, {"id": "1-10", "set": 1, "no": 10, "category": "アプリ", "question": "「アプリの設定」→「設定」タブ→「レコードのタイトル」で、レコードタイトルに指定できるフィールドタイプをすべて選びなさい。", "answer": ["B", "C", "D"], "multi": true, "choices": [{"key": "A", "text": "テーブル化したフィールド", "help": "レコードタイトルを設定する", "url": "https://jp.kintone.help/k/ja/id/040604", "textRef": "3-7-3 レコードのタイトル"}, {"key": "B", "text": "文字列（複数行）", "help": "レコードタイトルを設定する", "url": "https://jp.kintone.help/k/ja/id/040604", "textRef": "3-7-3 レコードのタイトル"}, {"key": "C", "text": "計算", "help": "レコードタイトルを設定する", "url": "https://jp.kintone.help/k/ja/id/040604", "textRef": "3-7-3 レコードのタイトル"}, {"key": "D", "text": "ルックアップ", "help": "レコードタイトルを設定する", "url": "https://jp.kintone.help/k/ja/id/040604", "textRef": "3-7-3 レコードのタイトル"}], "exam": "2026年4月30日改定", "exp": {"summary": "レコードタイトルに使えるのは、レコード番号、文字列（1行・複数行）、リッチエディター、数値、計算、ルックアップ。テーブル化したフィールドは選べない。", "choices": {"A": "指定できない。テーブル化したフィールドは選択できない。", "B": "指定できる。［文字列（複数行）］はレコードタイトルに指定できる。", "C": "指定できる。［計算］はレコードタイトルに指定できる。", "D": "指定できる。［ルックアップ］はレコードタイトルに指定できる。"}, "note": ""}}, {"id": "1-11", "set": 1, "no": 11, "category": "アプリ", "question": "アプリの集計機能の説明として、正しいものをすべて選びなさい。", "answer": ["C", "D"], "multi": true, "choices": [{"key": "A", "text": "アプリの管理者以外がレコードを集計できない。", "help": "グラフ／集計表", "url": "https://jp.kintone.help/k/ja/id/040465", "textRef": "1-5-2 一覧からのグラフの作成"}, {"key": "B", "text": "埋め込み用タグ（HTML形式）を利用して外部サイトのページに埋め込まれたアプリのグラフや表は、cybozu.comユーザーでなくても閲覧できる。", "help": "グラフ／集計表", "url": "https://jp.kintone.help/k/ja/id/040465", "textRef": "1-5-5 集計結果の埋め込み用タグの取得"}, {"key": "C", "text": "「分類する項目」に指定した項目の値が空のレコードは、集計対象にならない。", "help": "グラフ／集計表", "url": "https://jp.kintone.help/k/ja/id/040465", "textRef": "1-5-2 一覧からのグラフの作成"}, {"key": "D", "text": "集計結果の埋め込み用タグ（HTML形式）を取得できるのは、アプリに保存したグラフのみである。", "help": "グラフ／集計表", "url": "https://jp.kintone.help/k/ja/id/040465", "textRef": "1-5-5 集計結果の埋め込み用タグの取得"}], "exam": "2026年4月30日改定", "exp": {"summary": "グラフはレコード一覧画面から誰でも作れるが、保存には管理権限が要る。埋め込み用タグは保存したグラフのみで取得でき、表示するには kintone へのログインが必要。", "choices": {"A": "誤り。［レコードの一覧］画面からのグラフ作成は、アプリの管理権限がなくても利用できる。", "B": "誤り。埋め込んだグラフや表を外部サイトで表示するには、閲覧者が kintone にログインしている必要がある。", "C": "正しい（公式の正答による）。（ヘルプで直接は確認できず）", "D": "正しい。アプリに保存したグラフのみ、埋め込み用タグを取得できる。"}, "note": ""}}, {"id": "1-12", "set": 1, "no": 12, "category": "アプリ", "question": "「アプリの条件通知」の説明として、誤っているものを1つ選びなさい。", "answer": ["D"], "multi": false, "choices": [{"key": "A", "text": "「ユーザー選択」フィールドを通知先に指定し、設定した条件が満たされた場合、選択されたユーザーに自分宛の通知が届く。", "help": "アプリの条件通知：アプリへの操作を条件にした通知を設定する", "url": "https://jp.kintone.help/k/ja/id/040561", "textRef": "3-4-3 レコードの条件通知"}, {"key": "B", "text": "プロセス管理を有効にすると、「ステータスの変更」のみチェックがついた状態で、「作業者」の行が自動的に追加される。", "help": "アプリの条件通知：アプリへの操作を条件にした通知を設定する", "url": "https://jp.kintone.help/k/ja/id/040561", "textRef": "3-4-2 アプリの条件通知"}, {"key": "C", "text": "通知の条件を満たしても、アプリを操作した本人には、通知は届かない。", "help": "アプリの条件通知：アプリへの操作を条件にした通知を設定する", "url": "https://jp.kintone.help/k/ja/id/040561", "textRef": "3-4-2 アプリの条件通知"}, {"key": "D", "text": "設定画面で、「通知内容」を指定できる。", "help": "アプリの条件通知：アプリへの操作を条件にした通知を設定する", "url": "https://jp.kintone.help/k/ja/id/040561", "textRef": "3-4-2 アプリの条件通知"}], "exam": "2026年4月30日改定", "exp": {"summary": "通知先に直接指定したユーザーには「すべて」の通知、フィールドで指定したユーザーには「自分宛」の通知が届く。操作した本人には届かない。", "choices": {"A": "正しい。通知先にフィールドを指定した場合は「自分宛」の通知として届く。", "B": "正しい（公式の正答による）。ヘルプでは、プロセス管理が有効なときに［作業者］を通知先に選べ、条件は［ステータスの更新］などとある。（自動で行が追加される点はヘルプで直接は確認できず）", "C": "正しい。アプリを操作した本人には通知が送信されない。", "D": "誤り。アプリの条件通知で指定するのは、通知先と、通知する操作（レコード追加・編集など）。通知内容を指定する項目はない。"}, "note": ""}}, {"id": "1-13", "set": 1, "no": 13, "category": "アプリ", "question": "すでに運用されているアプリの説明として、正しいものをすべて選びなさい。", "answer": ["A", "B"], "multi": true, "choices": [{"key": "A", "text": "「アプリのアクセス権」画面で、そのアプリの管理権限を付与できる。", "help": "アプリにアクセス権を設定する", "url": "https://jp.kintone.help/k/ja/id/040589", "textRef": "3-6-2 アプリのアクセス権"}, {"key": "B", "text": "レコード一覧画面でのレコードの直接編集と削除を無効にするかどうか設定できる。", "help": "［レコードの一覧］でのレコードの直接編集と削除を無効にする", "url": "https://jp.kintone.help/k/ja/id/040833", "textRef": "3-7-4 高度な設定"}, {"key": "C", "text": "「アプリの設定」→「設定」タブ→「高度な設定」で、「レコードのコメント機能を有効にする」の選択を外した場合、過去に書き込んだコメントも削除される。", "help": "レコードのコメント機能を無効にする", "url": "https://jp.kintone.help/k/ja/id/040480", "textRef": "3-7-4 高度な設定"}, {"key": "D", "text": "kintoneシステム管理者は、「アプリ管理」の「アプリの一覧」にて、自分に管理権限のあるアプリの一覧をCSV形式でダウンロードできる。", "help": "アプリの一覧をCSV形式でダウンロードする", "url": "https://jp.kintone.help/k/ja/id/04014", "textRef": "5-3-2 アプリの管理"}], "exam": "2026年4月30日改定", "exp": {"summary": "アプリ一覧の CSV をダウンロードできるのは cybozu.com 共通管理者。kintone システム管理者ではない。", "choices": {"A": "正しい。［アプリのアクセス権］で設定できる権限に［アプリ管理］が含まれる。", "B": "正しい。アプリごとに、［レコードの一覧］でのレコードの直接編集と削除を無効にするか設定できる。", "C": "誤り。チェックを外すとコメントは非表示になるが、過去に書き込んだコメントは削除されない。", "D": "誤り。［アプリ管理］画面からアプリの一覧を CSV 形式でダウンロードできるのは、cybozu.com 共通管理者。"}, "note": ""}}, {"id": "1-14", "set": 1, "no": 14, "category": "アプリ", "question": "フォームの説明として、正しいものを1つ選びなさい。", "answer": ["C"], "multi": false, "choices": [{"key": "A", "text": "一度設定して公開したフォームは、あとから変更できない。", "help": "フォームの設定", "url": "https://jp.kintone.help/k/ja/id/040494", "textRef": "2-1-1 フォームとは"}, {"key": "B", "text": "フィールドは1つのアプリに1,000個まで配置できる。", "help": "フォームの設定", "url": "https://jp.kintone.help/k/ja/id/040494", "textRef": "2-1-2 フォームの設定"}, {"key": "C", "text": "フォームを設定できるのはアプリの管理者のみである。", "help": "フォームの設定", "url": "https://jp.kintone.help/k/ja/id/040494", "textRef": "2-1-1 フォームとは"}, {"key": "D", "text": "フォームはアプリごとに複数設定できる。", "help": "フォームの設定", "url": "https://jp.kintone.help/k/ja/id/040494", "textRef": "2-1-1 フォームとは"}], "exam": "2026年4月30日改定", "exp": {"summary": "フォームはアプリに1つだけで、設定できるのはアプリの管理者だけ。フィールドは500個まで。", "choices": {"A": "誤り。どの方法で作成したアプリも、あとから自由に設定を変更できる。", "B": "誤り。kintone で作成できるのは、フィールドが500個までのアプリ。", "C": "正しい。フォームを設定できるのはアプリの管理者だけ。", "D": "誤り。フォームはアプリごとに1つだけ設定できる。"}, "note": ""}}, {"id": "1-15", "set": 1, "no": 15, "category": "アプリ", "question": "「組織選択」フィールドの説明として、誤っているものを1つ選びなさい。", "answer": ["A"], "multi": false, "choices": [{"key": "A", "text": "ゲストスペース内のアプリでも、「組織選択」フィールドを使用できる。", "help": "組織選択", "url": "https://jp.kintone.help/k/ja/id/040523", "textRef": "2-2-9 ユーザーや組織の選択"}, {"key": "B", "text": "組織名や組織コードを入力して、表示される組織を選択できる。", "help": "組織選択", "url": "https://jp.kintone.help/k/ja/id/040523", "textRef": "2-2-9 ユーザーや組織の選択"}, {"key": "C", "text": "あらかじめ組織の選択肢を指定できる。", "help": "組織選択", "url": "https://jp.kintone.help/k/ja/id/040523", "textRef": "2-2-9 ユーザーや組織の選択"}, {"key": "D", "text": "複数の組織を選択できる。", "help": "組織選択", "url": "https://jp.kintone.help/k/ja/id/040523", "textRef": "2-2-9 ユーザーや組織の選択"}], "exam": "2026年4月30日改定", "exp": {"summary": "［組織選択］フィールドはゲストスペース内のアプリでは使えない。", "choices": {"A": "誤り。ゲストスペース内のアプリでは［組織選択］フィールドを使用できない。", "B": "正しい。選択肢を指定しない場合、組織名や組織コードを検索して選択できる。", "C": "正しい。［選択肢を指定する］で、選択肢として表示する組織を指定できる。", "D": "正しい。複数の組織を選択できる。"}, "note": ""}}, {"id": "1-16", "set": 1, "no": 16, "category": "アプリ", "question": "「グループ選択」フィールドの説明として、適切でないものをすべて選びなさい。", "answer": ["A", "B"], "multi": true, "choices": [{"key": "A", "text": "グループは、アプリの管理画面で追加できる。", "help": "グループ（ロール）を設定する", "url": "https://jp.kintone.help/k/ja/id/04061", "textRef": "5-1-5 グループ（ロール）と所属ユーザーの設定"}, {"key": "B", "text": "グループを追加する際は、組織と関連付ける必要がある。", "help": "グループ（ロール）を設定する", "url": "https://jp.kintone.help/k/ja/id/04061", "textRef": "5-1-5 グループ（ロール）と所属ユーザーの設定"}, {"key": "C", "text": "「グループ選択」フィールドを利用して、アクセス権や通知を組み合わせて設定できる。", "help": "グループ選択", "url": "https://jp.kintone.help/k/ja/id/040530", "textRef": "3-6-4 フィールドのアクセス権"}, {"key": "D", "text": "グループの選択肢を指定しない場合、すべてのグループが選択対象になる。", "help": "グループ選択", "url": "https://jp.kintone.help/k/ja/id/040530", "textRef": "2-2-9 ユーザーや組織の選択"}], "exam": "2026年4月30日改定", "exp": {"summary": "グループ（ロール）は cybozu.com 共通管理で作る、組織とは別の分類。アプリの画面では作れない。", "choices": {"A": "適切でない。グループ（ロール）の作成と管理は、cybozu.com 共通管理の［グループ（ロール）の設定］画面で行う。", "B": "適切でない。グループ（ロール）は組織とは別に役職や役割で分けるもので、組織と関連付ける必要はない。", "C": "適切。［グループ選択］フィールドは、通知先、アクセス権、プロセス管理の作業者などに指定して組み合わせられる。", "D": "適切。選択肢を指定しない場合は、グループ名やグループコードで検索するか、一覧のダイアログからグループを選ぶ。"}, "note": ""}}, {"id": "1-17", "set": 1, "no": 17, "category": "アプリ", "question": "アプリの高度な設定の説明として、誤っているものを1つ選びなさい。", "answer": ["D"], "multi": false, "choices": [{"key": "A", "text": "数値の有効桁数と丸めかたを設定変更すると、次にレコードを更新したときに、数値フィールドと計算フィールドの値が、設定に合わせて変更される。", "help": "高度な設定", "url": "https://jp.kintone.help/k/ja/id/040477", "textRef": "3-7-4 高度な設定"}, {"key": "B", "text": "「レコードのコメント機能を有効にする」のチェックを外しても、過去に書き込んだコメントはデータとして保持される。", "help": "高度な設定", "url": "https://jp.kintone.help/k/ja/id/040477", "textRef": "3-7-4 高度な設定"}, {"key": "C", "text": "四半期の開始月は、指定できる。", "help": "高度な設定", "url": "https://jp.kintone.help/k/ja/id/040477", "textRef": "3-7-4 高度な設定"}, {"key": "D", "text": "レコード一括削除機能は、初期設定で有効である。", "help": "高度な設定", "url": "https://jp.kintone.help/k/ja/id/040477", "textRef": "3-7-4 高度な設定"}], "exam": "2026年4月30日改定", "exp": {"summary": "レコード一括削除は初期設定では無効。高度な設定で有効にしてから使う。", "choices": {"A": "正しい（公式の正答による）。（ヘルプで直接は確認できず）数値の有効桁数と丸めかたが高度な設定にあることは確認できるが、反映のタイミングまでは確認できない。", "B": "正しい。コメント機能を無効にしても、過去に書き込んだコメントは削除されない。", "C": "正しい。高度な設定に「四半期の開始月を変更する」がある。", "D": "誤り。一括削除する前に、高度な設定で［レコード一括削除を有効にする］にチェックを入れる必要がある。つまり初期設定では無効。"}, "note": ""}}, {"id": "1-18", "set": 1, "no": 18, "category": "アプリ", "question": "フィールドコードの説明として、正しいものを1つ選びなさい。", "answer": ["C"], "multi": false, "choices": [{"key": "A", "text": "全角記号のうち、フィールドコードとして使用できるのは「＿（アンダースコア）」のみである。", "help": "フィールドコードとは", "url": "https://jp.kintone.help/k/ja/id/040504", "textRef": "2-4-3 計算式"}, {"key": "B", "text": "フィールドコードにはすべての英単語を使用することができる。", "help": "フィールドコードとは", "url": "https://jp.kintone.help/k/ja/id/040504", "textRef": "2-4-3 計算式"}, {"key": "C", "text": "数字で始まるフィールドコードは指定できない。", "help": "フィールドコードとは", "url": "https://jp.kintone.help/k/ja/id/040504", "textRef": "2-4-3 計算式"}, {"key": "D", "text": "空の状態でも保存できる。", "help": "フィールドコードとは", "url": "https://jp.kintone.help/k/ja/id/040504", "textRef": "2-4-3 計算式"}], "exam": "2026年4月30日改定", "exp": {"summary": "フィールドコードは1〜128文字で、空にはできない。記号は「_」「・」と全角の通貨記号などに限られる。", "choices": {"A": "誤り。全角では「＿」のほかに、「・」（中黒）や通貨記号（＄、￥など）も使える。", "B": "誤り（公式の正答による）。（ヘルプで直接は確認できず）", "C": "正しい（公式の正答による）。（ヘルプで直接は確認できず）使用できる文字の一覧に、先頭の文字についての記載は見当たらない。", "D": "誤り。フィールドコードは1文字以上128文字以下で入力する必要がある。"}, "note": ""}}, {"id": "1-19", "set": 1, "no": 19, "category": "アプリ", "question": "CSVファイルからアプリを作成する際の説明として、正しいものをすべて選びなさい。", "answer": ["A", "D"], "multi": true, "choices": [{"key": "A", "text": "数値を読み込む場合、「,（桁区切り記号）」、「\\（円記号）などの通貨記号」は使用できない。", "help": "CSVファイルからアプリを作成する", "url": "https://jp.kintone.help/k/ja/id/040624", "textRef": "1-1-7 方法4：CSVファイルからアプリを作成する"}, {"key": "B", "text": "最大100MB、500列、1万行までのCSVファイルを読み込むことができる。", "help": "CSVファイルからアプリを作成する", "url": "https://jp.kintone.help/k/ja/id/040624", "textRef": "1-1-7 方法4：CSVファイルからアプリを作成する"}, {"key": "C", "text": "日本語と英数字以外の文字が含まれている場合、文字コードに「JIS（ジス）コード」を指定してファイルを保存する必要がある。", "help": "CSVファイルからアプリを作成する", "url": "https://jp.kintone.help/k/ja/id/040624", "textRef": "1-1-7 方法4：CSVファイルからアプリを作成する"}, {"key": "D", "text": "「ユーザー選択」フィールドとして読み込む場合、ログイン名を入力する。", "help": "CSVファイルからアプリを作成する", "url": "https://jp.kintone.help/k/ja/id/040624", "textRef": "1-1-7 方法4：CSVファイルからアプリを作成する"}], "exam": "2026年4月30日改定", "exp": {"summary": "CSV からアプリを作れるのは、100MB・500列・10万行まで。文字コードは UTF-8。数値に桁区切りや通貨記号は使えない。ユーザー選択はログイン名で読み込む。", "choices": {"A": "正しい。数値を読み込む場合、桁区切り記号と円記号などの通貨記号は使用できない。", "B": "誤り。上限は1万行ではなく10万行（最大100MB、500列）。", "C": "誤り。日本語と英数字以外の文字が含まれる場合は、JIS コードではなく UTF-8（Unicode）で保存する。", "D": "正しい。［ユーザー選択］フィールドとして読み込む場合は、ログイン名を入力する。"}, "note": ""}}, {"id": "1-20", "set": 1, "no": 20, "category": "アプリ", "question": "アプリのレコード一覧画面から作成できるグラフの種類として誤っているものを1つ選びなさい。", "answer": ["C"], "multi": false, "choices": [{"key": "A", "text": "曲線面グラフ", "help": "グラフの種類と使い分け", "url": "https://jp.kintone.help/k/ja/id/040581", "textRef": "1-5-2 一覧からのグラフの作成"}, {"key": "B", "text": "折れ線グラフ", "help": "グラフの種類と使い分け", "url": "https://jp.kintone.help/k/ja/id/040581", "textRef": "1-5-2 一覧からのグラフの作成"}, {"key": "C", "text": "レーダーチャート", "help": "グラフの種類と使い分け", "url": "https://jp.kintone.help/k/ja/id/040581", "textRef": "1-5-2 一覧からのグラフの作成"}, {"key": "D", "text": "曲線グラフ", "help": "グラフの種類と使い分け", "url": "https://jp.kintone.help/k/ja/id/040581", "textRef": "1-5-2 一覧からのグラフの作成"}], "exam": "2026年4月30日改定", "exp": {"summary": "グラフの種類は、横棒、縦棒、折れ線、曲線、面、曲線面、円、表、クロス集計表。レーダーチャートはない。", "choices": {"A": "作成できる。「曲線面グラフ」はグラフの種類にある。", "B": "作成できる。「折れ線グラフ」はグラフの種類にある。", "C": "作成できない。グラフの種類にレーダーチャートはない。", "D": "作成できる。「曲線グラフ」はグラフの種類にある。"}, "note": ""}}, {"id": "1-21", "set": 1, "no": 21, "category": "アプリ", "question": "ファイルを読み込みレコードを一括更新する際の注意点として、誤っているものを1つ選びなさい。", "answer": ["A"], "multi": false, "choices": [{"key": "A", "text": "「文字列（1行)」フィールドは、フィールドの設定に関わらず「更新キー」と「対応するファイルの列」に指定できる。", "help": "ファイルからレコードのデータをアプリに読み込む", "url": "https://jp.kintone.help/k/ja/id/040724", "textRef": "1-6-2 ファイルからのレコード読み込み"}, {"key": "B", "text": "「更新キー」は、複数のレコードで値が重複しないフィールドを指定する。", "help": "ファイルからレコードのデータをアプリに読み込む", "url": "https://jp.kintone.help/k/ja/id/040724", "textRef": "1-6-2 ファイルからのレコード読み込み"}, {"key": "C", "text": "「更新キー」と「対応するファイルの列」の値が一致しない場合、ファイルのその行のデータは新しいレコードとして登録される。", "help": "ファイルからレコードのデータをアプリに読み込む", "url": "https://jp.kintone.help/k/ja/id/040724", "textRef": "1-6-2 ファイルからのレコード読み込み"}, {"key": "D", "text": "「ルックアップ」フィールドは「更新キー」に指定できない。", "help": "ファイルからレコードのデータをアプリに読み込む", "url": "https://jp.kintone.help/k/ja/id/040724", "textRef": "1-6-2 ファイルからのレコード読み込み"}], "exam": "2026年4月30日改定", "exp": {"summary": "更新キーにできるのは、レコード番号、文字列（1行）、数値、日付、日時、リンク。レコード番号以外は「値の重複を禁止する」の設定が必要。", "choices": {"A": "誤り。レコード番号以外のフィールドを更新キーにするには、フィールドの設定で値の重複を禁止しておく必要がある。設定に関わらず指定できるわけではない。", "B": "正しい。更新キーには、ほかのレコードと値が重複しないフィールドを指定する。", "C": "正しい。更新キーの値と対応するファイルの列の値に一致するものがない場合、その行の値で新規レコードが登録される。", "D": "正しい。更新キーに指定できるフィールドに［ルックアップ］は含まれない。"}, "note": ""}}, {"id": "1-22", "set": 1, "no": 22, "category": "アプリ", "question": "「添付ファイル」フィールドの説明として、適切でないものを1つ選びなさい。", "answer": ["B"], "multi": false, "choices": [{"key": "A", "text": "Excel、Word、PDFファイルなど、ファイルの種類を問わず添付できる。", "help": "添付ファイル", "url": "https://jp.kintone.help/k/ja/id/040514", "textRef": "2-2-7 添付ファイル"}, {"key": "B", "text": "1つのフィールドに複数のファイルを添付することはできない。", "help": "添付ファイル", "url": "https://jp.kintone.help/k/ja/id/040514", "textRef": "2-2-7 添付ファイル"}, {"key": "C", "text": "画像ファイルを添付するとサムネイル（縮小画像）が表示される。", "help": "添付ファイル", "url": "https://jp.kintone.help/k/ja/id/040514", "textRef": "2-2-7 添付ファイル"}, {"key": "D", "text": "レコードの絞り込み条件で、「ファイルあり」「ファイルなし」を選択できる。", "help": "添付ファイルの有無でレコードを絞り込む", "url": "https://jp.kintone.help/k/ja/id/040458#app_collectdata_filter_records_60", "textRef": "1-4-1 表示するレコードの絞り込み"}], "exam": "2026年4月30日改定", "exp": {"summary": "［添付ファイル］フィールドには、種類を問わず複数のファイルを添付できる。", "choices": {"A": "適切。Excel、Word、PDF など、ファイルの種類を問わず添付できる。", "B": "適切でない。1つのフィールドに複数のファイルを添付でき、並べ替えもできる。", "C": "適切。画像ファイル（10MB 以内、BMP・GIF・JPG・PNG など）を添付すると、サムネイルが表示される。", "D": "適切。［添付ファイル］フィールドでは、［ファイルあり］［ファイルなし］の条件で絞り込める。"}, "note": ""}}, {"id": "1-23", "set": 1, "no": 23, "category": "アプリ", "question": "テーブルに設定できるフィールドの種類として、適切でないものをすべて選びなさい。", "answer": ["A", "C"], "multi": true, "choices": [{"key": "A", "text": "レコード番号", "help": "テーブル", "url": "https://jp.kintone.help/k/ja/id/040529", "textRef": "2-3-2 テーブルを設定する"}, {"key": "B", "text": "リンク", "help": "テーブル", "url": "https://jp.kintone.help/k/ja/id/040529", "textRef": "2-3-2 テーブルを設定する"}, {"key": "C", "text": "関連レコード一覧", "help": "テーブル", "url": "https://jp.kintone.help/k/ja/id/040529", "textRef": "2-3-2 テーブルを設定する"}, {"key": "D", "text": "添付ファイル", "help": "テーブル", "url": "https://jp.kintone.help/k/ja/id/040529", "textRef": "2-3-2 テーブルを設定する"}], "exam": "2026年4月30日改定", "exp": {"summary": "テーブルに入れられないのは、ラベル、関連レコード一覧、スペース、罫線、グループ、テーブル、レコード番号、作成者・更新者・作成日時・更新日時など。", "choices": {"A": "適切でない。［レコード番号］は［テーブル］内に配置できない。", "B": "適切。［リンク］はテーブル内に配置できないフィールドに含まれていない。", "C": "適切でない。［関連レコード一覧］は［テーブル］内に配置できない。", "D": "適切。［添付ファイル］はテーブル内に配置できないフィールドに含まれていない。"}, "note": ""}}, {"id": "1-24", "set": 1, "no": 24, "category": "アプリ", "question": "「申込日」という日付フィールドの値の30日後を表示したい。\n計算フィールドに入力する日付の計算式として、正しいものを1つ選びなさい。", "answer": ["D"], "multi": false, "choices": [{"key": "A", "text": "申込日+30", "help": "日付、時刻、日時の計算", "url": "https://jp.kintone.help/k/ja/id/040502", "textRef": "2-4-3 計算式"}, {"key": "B", "text": "申込日+(24*30)", "help": "日付、時刻、日時の計算", "url": "https://jp.kintone.help/k/ja/id/040502", "textRef": "2-4-3 計算式"}, {"key": "C", "text": "申込日+(60*24*30)", "help": "日付、時刻、日時の計算", "url": "https://jp.kintone.help/k/ja/id/040502", "textRef": "2-4-3 計算式"}, {"key": "D", "text": "申込日+(60*60*24*30)", "help": "日付、時刻、日時の計算", "url": "https://jp.kintone.help/k/ja/id/040502", "textRef": "2-4-3 計算式"}], "exam": "2026年4月30日改定", "exp": {"summary": "日付は秒単位の UNIX 時刻で扱う。1日は 60*60*24。", "choices": {"A": "誤り。日付は秒単位で扱うので、+30 は30秒後になる。", "B": "誤り。24*30 は720秒で、30日にならない。", "C": "誤り。60*24*30 は43,200秒（12時間）で、30日にならない。", "D": "正しい。1日は「60*60*24」秒なので、30日後は「申込日 + (60*60*24*30)」と書く。"}, "note": ""}}, {"id": "1-25", "set": 1, "no": 25, "category": "アプリ", "question": "「アプリの設定」→「フォーム」タブで、「ルックアップ」フィールドの説明として、誤っているものをすべて選びなさい。", "answer": ["A", "C", "D"], "multi": true, "choices": [{"key": "A", "text": "「コピー元のフィールド」に、「関連レコード一覧」を指定できる。", "help": "ルックアップを設定する", "url": "https://jp.kintone.help/k/ja/id/040547", "textRef": "2-5-2 ルックアップを設定する"}, {"key": "B", "text": "「ソートの初期設定」で、「取得」クリック時の選択画面のレコードの並び順を指定できる。", "help": "ルックアップを設定する", "url": "https://jp.kintone.help/k/ja/id/040547", "textRef": "2-5-2 ルックアップを設定する"}, {"key": "C", "text": "参照先のレコードの値が変更されると、「ルックアップ」で取得済みの値は、最新の値に上書きされる。", "help": "ルックアップを設定する", "url": "https://jp.kintone.help/k/ja/id/040547", "textRef": "2-5-1 ルックアップとは"}, {"key": "D", "text": "参照先となるアプリは、一度フォームを保存した後も変更できる。", "help": "［ルックアップ］", "url": "https://jp.kintone.help/k/ja/id/040526", "textRef": "2-5-2 ルックアップを設定する"}], "exam": "2026年4月30日改定", "exp": {"summary": "ルックアップの値はコピーなので、参照先が変わっても自動では更新されない。関連付けるアプリとコピー元のフィールドは、保存後に変更できない。", "choices": {"A": "誤り。コピー元のフィールドに指定できるのは、文字列（1行）、数値、計算、リンク、ルックアップ、レコード番号。関連レコード一覧は指定できない。", "B": "正しい。［ソートの初期設定］で、取得時に表示されるレコードの並び順を指定できる。", "C": "誤り。参照先のレコードが変更されても、取得済みの値はそのまま。再度［取得］をクリックしたときに最新の値で上書きされる。", "D": "誤り。［関連付けるアプリ］は、一度選択してフォームを保存すると変更できない。"}, "note": ""}}, {"id": "1-26", "set": 1, "no": 26, "category": "スペース", "question": "スペース内アプリの説明として、正しいものをすべて選びなさい。", "answer": ["B", "D"], "multi": true, "choices": [{"key": "A", "text": "ゲストスペースに作成したアプリの、所属するスペースをあとから変更できる。", "help": "ゲストスペース", "url": "https://jp.kintone.help/k/ja/id/040639", "textRef": "4-3-1 ゲストスペースとは"}, {"key": "B", "text": "スペース内にアプリを作成できるユーザーを、スペース管理者のみに限定できる。", "help": "スペース内アプリとは", "url": "https://jp.kintone.help/k/ja/id/040709", "textRef": "4-1-3 スペースの設定の変更"}, {"key": "C", "text": "スペース内アプリは、「Public」アプリグループに所属し、所属するアプリグループは変更できる。", "help": "スペース内アプリとは", "url": "https://jp.kintone.help/k/ja/id/040709", "textRef": "4-2-3 スペース内アプリ"}, {"key": "D", "text": "非公開のスペースに所属するアプリには、スペースのメンバーだけがアクセスできる。", "help": "スペース内アプリとは", "url": "https://jp.kintone.help/k/ja/id/040709", "textRef": "4-2-3 スペース内アプリ"}], "exam": "2026年4月30日改定", "exp": {"summary": "スペース内アプリは「Public」アプリグループに固定される。ゲストスペースのアプリは、あとから所属スペースを変えられない。", "choices": {"A": "誤り。ゲストスペースに作成したアプリは、所属するスペースをあとから変更できない。", "B": "正しい。［アプリ作成できるユーザーをスペースの管理者に限定する］を設定できる。", "C": "誤り。スペース内アプリは「Public」アプリグループに所属し、ほかのアプリグループには変更できない。", "D": "正しい。非公開のスペースに所属するアプリには、スペースのメンバーだけがアクセスできる。"}, "note": ""}}, {"id": "1-27", "set": 1, "no": 27, "category": "スペース", "question": "「スレッドアクション」で、コピー元のデータ【ア】と、コピー先に指定できるフィールド【イ】の組み合わせとして、正しいものをすべて選びなさい。", "answer": ["A", "C", "D"], "multi": true, "choices": [{"key": "A", "text": "【ア】：コメントの投稿日時\n【イ】：「日時」フィールド、「日付」フィールド", "help": "スレッドアクションでできること", "url": "https://jp.kintone.help/k/ja/id/040710", "textRef": "4-2-2 スレッド"}, {"key": "B", "text": "【ア】：コメントの内容\n【イ】：「文字列（1行）」フィールド、「文字列（複数行）」フィールド", "help": "スレッドアクションでできること", "url": "https://jp.kintone.help/k/ja/id/040710", "textRef": "4-2-2 スレッド"}, {"key": "C", "text": "【ア】：コメントのURL\n【イ】：「リンク」フィールド（入力値の種類を「Webサイトのアドレス」にしている場合のみ）", "help": "スレッドアクションでできること", "url": "https://jp.kintone.help/k/ja/id/040710", "textRef": "4-2-2 スレッド"}, {"key": "D", "text": "【ア】：コメントの投稿者\n【イ】：「ユーザー選択」フィールド", "help": "スレッドアクションでできること", "url": "https://jp.kintone.help/k/ja/id/040710", "textRef": "4-2-2 スレッド"}], "exam": "2026年4月30日改定", "exp": {"summary": "コピー先は次のとおり。内容→文字列（複数行）・リッチエディター、日時→日時・日付、投稿者→ユーザー選択、URL→リンク（Web サイトのアドレス）。", "choices": {"A": "正しい。［コメントの投稿日時］のコピー先には、［日時］と［日付］を指定できる。", "B": "誤り。［コメントの内容］のコピー先は、［文字列（複数行）］と［リッチエディター］。［文字列（1行）］は指定できない。", "C": "正しい。［コメントの URL］は、入力値の種類が「Web サイトのアドレス」の［リンク］フィールドにコピーできる。", "D": "正しい。［コメントの投稿者］のコピー先には、［ユーザー選択］フィールドを指定できる。"}, "note": ""}}, {"id": "1-28", "set": 1, "no": 28, "category": "スペース", "question": "「スレッドアクション」の説明として、正しいものをすべて選びなさい。", "answer": ["A", "C"], "multi": true, "choices": [{"key": "A", "text": "スレッドのコメントやURLを、指定したアプリのレコードにコピーできる機能である。", "help": "スレッドアクションでできること", "url": "https://jp.kintone.help/k/ja/id/040710", "textRef": "4-2-2 スレッド"}, {"key": "B", "text": "スレッドのコメントの内容をコピー先に指定できるフィールドは、文字列（1行）と文字列（複数行）である。", "help": "スレッドアクションでできること", "url": "https://jp.kintone.help/k/ja/id/040710", "textRef": "4-2-2 スレッド"}, {"key": "C", "text": "kintoneシステム管理者は、スレッドアクションの管理画面から、作成済みのすべてのアクションを確認、設定変更、削除できる。", "help": "スペースに参加／退会する", "url": "https://jp.kintone.help/k/ja/id/040701", "textRef": "5-3-3 スペースの管理"}, {"key": "D", "text": "ゲストスペースでも、スレッドアクションを使用できる。", "help": "スレッドアクションでできること", "url": "https://jp.kintone.help/k/ja/id/040710", "textRef": "4-2-2 スレッド"}], "exam": "2026年4月30日改定", "exp": {"summary": "スレッドアクションは、コメントや URL をアプリのレコードに転記する機能。ゲストスペースでは使えない。", "choices": {"A": "正しい。スレッドに書き込まれたコメントや URL を、指定したアプリのレコードに転記できる。", "B": "誤り。コメントの内容のコピー先は、［文字列（複数行）］と［リッチエディター］。［文字列（1行）］は含まれない。", "C": "正しい。kintone システム管理には「スレッドアクションの管理画面を開く」がある。（確認・変更・削除の詳細はヘルプで直接は確認できず）", "D": "誤り。ゲストスペースではスレッドアクションを使用できない。"}, "note": ""}}, {"id": "1-29", "set": 1, "no": 29, "category": "スペース", "question": "ゲストスペースの追加に関する説明として、誤っているものを1つ選びなさい。", "answer": ["A"], "multi": false, "choices": [{"key": "A", "text": "cybozu.com共通管理で、ゲストスペース機能を有効にする必要がある。", "help": "ゲストスペースを追加する", "url": "https://jp.kintone.help/k/ja/id/040648", "textRef": "5-3-7 その他の管理"}, {"key": "B", "text": "kintoneのシステム管理で、スペース機能とゲストスペース機能を有効にする必要がある。", "help": "ゲストスペースを追加する", "url": "https://jp.kintone.help/k/ja/id/040648", "textRef": "5-3-7 その他の管理"}, {"key": "C", "text": "kintoneのポータルで、「スペース」の「＋」から、「ゲストスペースを作成」をクリックし、ゲストスペースを追加できる。", "help": "ゲストスペースを追加する", "url": "https://jp.kintone.help/k/ja/id/040648", "textRef": "4-3-2 ゲストスペースの追加"}, {"key": "D", "text": "kintoneのポータルで、右上の「…」から、「ゲストスペースを作成」をクリックし、ゲストスペースを追加できる。", "help": "ゲストスペースを追加する", "url": "https://jp.kintone.help/k/ja/id/040648", "textRef": "4-3-2 ゲストスペースの追加"}], "exam": "2026年4月30日改定", "exp": {"summary": "ゲストスペース機能を有効にするのは kintone システム管理の［利用する機能の選択］。cybozu.com 共通管理ではない。", "choices": {"A": "誤り。有効にする設定は cybozu.com 共通管理ではなく、kintone システム管理の［利用する機能の選択］にある。", "B": "正しい。kintone システム管理の［利用する機能の選択］で、スペース機能とゲストスペース機能を有効にする必要がある。", "C": "正しい。ポータルの［スペース］エリアの＋（［スペースを作成する］アイコン）から［ゲストスペースを作成］をクリックする。", "D": "正しい（公式の正答による）。（ヘルプで直接は確認できず）ヘルプに載っている手順は［スペース］エリアの＋からだけ。"}, "note": "D: ヘルプのゲストスペース追加手順（040648）にあるのは、ポータルの［スペース］エリアにある＋の手順だけ。右上の「…」から作成する方法は見つからなかった。公式の正答では D は正しい扱い。"}}, {"id": "1-30", "set": 1, "no": 30, "category": "スペース", "question": "スペースの参加／退会に関する説明として、誤っているものをすべて選びなさい。", "answer": ["C", "D"], "multi": true, "choices": [{"key": "A", "text": "「スペースのポータルと複数のスレッドを使用する」にチェックをしたスペースでは、スペースのポータル画面でスペースに参加しているメンバーを確認できる。", "help": "スペースに参加／退会する", "url": "https://jp.kintone.help/k/ja/id/040701", "textRef": "4-1-3 スペースの設定の変更"}, {"key": "B", "text": "スペースに参加する前にユーザー自身でフォローを解除したことがあるスレッドは、スペースに参加後、ユーザーが手動でフォローする必要がある。", "help": "スペースに参加／退会する", "url": "https://jp.kintone.help/k/ja/id/040701", "textRef": "4-1-4 スペースへの参加と退会"}, {"key": "C", "text": "スペースが公開スペースの場合、スペースを退会すると、ユーザー自身が手動でフォローしたことのあるスレッドは自動でフォローが解除される。", "help": "スペースに参加／退会する", "url": "https://jp.kintone.help/k/ja/id/040701", "textRef": "4-1-4 スペースへの参加と退会"}, {"key": "D", "text": "ユーザーが所属する組織／グループがメンバーとしてスペースに参加している場合でも、ユーザーごとの退会ができる。", "help": "スペースに参加／退会する", "url": "https://jp.kintone.help/k/ja/id/040701", "textRef": "4-1-4 スペースへの参加と退会"}], "exam": "2026年4月30日改定", "exp": {"summary": "組織やグループの単位で参加しているユーザーは、自分だけ退会することができない。公開スペースを退会しても、自分でフォローしたスレッドのフォローは残る。", "choices": {"A": "正しい。スペースに参加したユーザーは、スペースのポータル画面の［ピープル］に表示される。", "B": "正しい。過去に自分でフォローを解除したスレッドは、参加しても自動ではフォローされない。", "C": "誤り。退会したのが公開スペースで、自分でフォローしたスレッドがある場合、そのフォローは自動では解除されない。", "D": "誤り。ユーザーが所属する組織やグループが参加メンバーになっている場合は［スペースを退会］が表示されず、ユーザーごとに退会できない。"}, "note": ""}}, {"id": "1-31", "set": 1, "no": 31, "category": "管理者設定", "question": "cybozu.com共通管理で「組織の事前設定」を行う際の注意点として、誤っているものをすべて選びなさい。", "answer": ["B", "C", "D"], "multi": true, "choices": [{"key": "A", "text": "事前設定の対象となるデータは、組織、役職、ユーザーの3種類である。", "help": "組織の事前設定とは", "url": "https://jp.kintone.help/general/ja/id/020185", "textRef": "5-1-8 組織の事前設定"}, {"key": "B", "text": "変更予定のデータをCSVファイルで読み込んで、一括更新できる。", "help": "組織の事前設定とは", "url": "https://jp.kintone.help/general/ja/id/020185", "textRef": "5-1-8 組織の事前設定"}, {"key": "C", "text": "事前設定で追加する組織に、新規ユーザーを追加できる。", "help": "組織の事前設定とは", "url": "https://jp.kintone.help/general/ja/id/020185", "textRef": "5-1-8 組織の事前設定"}, {"key": "D", "text": "事前設定では、ユーザーを削除できる。", "help": "組織の事前設定とは", "url": "https://jp.kintone.help/general/ja/id/020185", "textRef": "5-1-8 組織の事前設定"}], "exam": "2026年4月30日改定", "exp": {"summary": "組織の事前設定は画面で予約データを作る機能。ファイル読み込みや API は使えない。ユーザーについては組織・役職・使用状態などの変更だけができる。", "choices": {"A": "正しい。予約データにできるのは、組織、役職、ユーザー情報（組織・役職・優先する組織・使用状態・表示優先度）の変更。", "B": "誤り。組織の事前設定では、ファイル読み込みや API を使った予約データの作成はできない。", "C": "誤り。ユーザーについて予約できるのは既存ユーザーの項目の変更だけで、新規ユーザーの追加は含まれない。", "D": "誤り。ユーザーについて予約できるのは項目の変更（使用状態など）だけで、ユーザーの削除はできない。"}, "note": ""}}, {"id": "1-32", "set": 1, "no": 32, "category": "管理者設定", "question": "kintoneシステム管理の説明として、誤っているものを1つ選びなさい。", "answer": ["D"], "multi": false, "choices": [{"key": "A", "text": "ゲストスペースを作成できるユーザーを追加できる。", "help": "kintoneシステム管理画面を開く", "url": "https://jp.kintone.help/k/ja/id/04046", "textRef": "5-3-5 権限の管理"}, {"key": "B", "text": "アプリテンプレートを作成できる。", "help": "kintoneシステム管理画面を開く", "url": "https://jp.kintone.help/k/ja/id/04046", "textRef": "5-3-2 アプリの管理"}, {"key": "C", "text": "アップデートオプションの設定で、開発中の新機能の利用設定ができる。", "help": "kintoneシステム管理画面を開く", "url": "https://jp.kintone.help/k/ja/id/04046", "textRef": "5-3-7 その他の管理"}, {"key": "D", "text": "2要素認証を使わないログインを禁止できる。", "help": "2要素認証の利用を必須にする", "url": "https://jp.kintone.help/general/ja/id/020470", "textRef": "5-2-1 セキュリティの設定"}], "exam": "2026年4月30日改定", "exp": {"summary": "2要素認証の必須化などのログインのセキュリティは、cybozu.com 共通管理で設定する。", "choices": {"A": "正しい。kintone システム管理で、ゲストスペースの作成権限を設定できる。", "B": "正しい。kintone システム管理で、アプリのテンプレートを作成・管理できる。", "C": "正しい。kintone システム管理の［アップデートオプション］で、新機能の利用を設定できる。", "D": "誤り。2要素認証の利用を必須にするのは、kintone システム管理ではなく cybozu.com 共通管理の［ログイン］で行う。"}, "note": ""}}, {"id": "1-33", "set": 1, "no": 33, "category": "管理者設定", "question": "cybozu.com共通管理で、無料で設定できないセキュリティ機能を1つ選びなさい。", "answer": ["C"], "multi": false, "choices": [{"key": "A", "text": "Basic認証", "help": "セキュリティ設定", "url": "https://jp.kintone.help/general/ja/id/02038", "textRef": "5-2-1 セキュリティの設定"}, {"key": "B", "text": "2要素認証", "help": "セキュリティ設定", "url": "https://jp.kintone.help/general/ja/id/02038", "textRef": "5-2-1 セキュリティの設定"}, {"key": "C", "text": "セキュアアクセス", "help": "セキュリティ設定", "url": "https://jp.kintone.help/general/ja/id/02038", "textRef": "5-2-1 セキュリティの設定"}, {"key": "D", "text": "IPアドレス制限", "help": "セキュリティ設定", "url": "https://jp.kintone.help/general/ja/id/02038", "textRef": "5-2-1 セキュリティの設定"}], "exam": "2026年4月30日改定", "exp": {"summary": "セキュアアクセスは有料オプション。IP アドレス制限、Basic 認証、2要素認証は標準機能。", "choices": {"A": "無料で設定できる（公式の正答による）。Basic 認証は、IP アドレス制限の例外として使うアクセス制限の機能。（料金についてはヘルプで直接は確認できず）", "B": "無料で設定できる（公式の正答による）。2要素認証は cybozu.com 共通管理の［ログイン］で許可・必須化できる。（料金についてはヘルプで直接は確認できず）", "C": "無料では設定できない。セキュアアクセスは、許可した IP アドレス以外から利用するための有料オプションサービス。", "D": "無料で設定できる（公式の正答による）。（料金についてはヘルプで直接は確認できず）"}, "note": ""}}, {"id": "1-34", "set": 1, "no": 34, "category": "管理者設定", "question": "監査ログについて、誤っているものを1つ選びなさい。", "answer": ["B"], "multi": false, "choices": [{"key": "A", "text": "監査ログの保存期間を設定することができる。", "help": "監査ログの保存期間を設定する", "url": "https://jp.kintone.help/general/ja/id/020104", "textRef": "5-2-2 監査ログ"}, {"key": "B", "text": "ファイル読み込みに対し、「読み込み完了時」のログのみが記録される。", "help": "ファイル読み込みの監査ログを確認する", "url": "https://jp.kintone.help/k/ja/id/04055", "textRef": "5-2-2 監査ログ"}, {"key": "C", "text": "「cybozu.com共通管理」から閲覧とダウンロードができる。", "help": "kintoneの監査ログの確認方法", "url": "https://jp.kintone.help/k/ja/id/04054", "textRef": "5-2-2 監査ログ"}, {"key": "D", "text": "監査ログの保存期間は、6週間から10年間の間で指定できる。", "help": "監査ログの保存期間を設定する", "url": "https://jp.kintone.help/general/ja/id/020104", "textRef": "5-2-2 監査ログ"}], "exam": "2026年4月30日改定", "exp": {"summary": "ファイル読み込みの監査ログは、登録時・開始時・完了時の3回記録される。保存期間は6週間〜10年間で、初期値は3年間。", "choices": {"A": "正しい。cybozu.com 共通管理の［設定］で、保存期間を選択できる。", "B": "誤り。ファイルの登録時（Record import registered）、開始時（started）、完了時（finished）の3回記録される。", "C": "正しい。監査ログは、cybozu.com 共通管理の［監査ログの閲覧とダウンロード］画面で確認できる。", "D": "正しい。保存期間は6週間から10年間の間で指定できる。"}, "note": ""}}, {"id": "1-35", "set": 1, "no": 35, "category": "管理者設定", "question": "cybozu.com共通管理者ができないことを1つ選びなさい。", "answer": ["B"], "multi": false, "choices": [{"key": "A", "text": "監査ログの閲覧やダウンロード", "help": "管理者の種類と権限", "url": "https://jp.kintone.help/k/ja/id/04058", "textRef": "5-2-2 監査ログ"}, {"key": "B", "text": "削除したユーザーの復旧", "help": "管理者の種類と権限", "url": "https://jp.kintone.help/k/ja/id/04058", "textRef": "5-1-2 ユーザーの設定"}, {"key": "C", "text": "Webhookの送信を禁止", "help": "Webhookの利用を禁止する（cybozu.com共通管理者の操作）", "url": "https://jp.kintone.help/k/ja/id/040793#set_webhook_disabled_webhook_20", "textRef": "5-2-3 外部連携"}, {"key": "D", "text": "アップデートオプションの有効／無効の切り替え", "help": "アップデートオプションの設定", "url": "https://jp.kintone.help/general/ja/id/020476", "textRef": "5-2-7 アップデートオプション"}], "exam": "2026年4月30日改定", "exp": {"summary": "cybozu.com 共通管理者は最上位の管理者。ただし、削除したユーザーは復旧できない。", "choices": {"A": "できる。cybozu.com 共通管理者は、監査ログの閲覧やダウンロードができる。", "B": "できない（公式の正答による）。（ヘルプで直接は確認できず）ヘルプに記載があるのはユーザーの追加と削除だけで、復旧についての記載はない。", "C": "できる。cybozu.com 共通管理者は、すべてのユーザーに対して Webhook の利用を禁止できる。", "D": "できる。cybozu.com 共通管理の［アップデートオプション］で、新機能の有効と無効を切り替えられる。"}, "note": ""}}, {"id": "1-36", "set": 1, "no": 36, "category": "管理者設定", "question": "「cybozu.com共通管理」→「グループ（ロール）」の説明として誤っているものをすべて選びなさい。", "answer": ["B", "C"], "multi": true, "choices": [{"key": "A", "text": "動的グループでは、誕生日などの条件を指定してグループを構成することができる。", "help": "動的グループ", "url": "https://jp.kintone.help/general/ja/id/020179#list_group_feature_2020", "textRef": "5-1-5 グループ（ロール）と所属ユーザーの設定"}, {"key": "B", "text": "動的グループの所属ユーザーは、ユーザーごとに追加や削除ができる。", "help": "動的グループ", "url": "https://jp.kintone.help/general/ja/id/020179#list_group_feature_2020", "textRef": "5-1-5 グループ（ロール）と所属ユーザーの設定"}, {"key": "C", "text": "静的グループの所属ユーザーは、ユーザーに設定する役職や所属する組織に応じて変わる。", "help": "静的グループ", "url": "https://jp.kintone.help/general/ja/id/020179#list_group_feature_2010", "textRef": "5-1-5 グループ（ロール）と所属ユーザーの設定"}, {"key": "D", "text": "静的グループに所属するユーザーは、CSVファイルを使用して一括登録できる。", "help": "ユーザーが所属するグループ（ロール）のファイルフォーマット", "url": "https://jp.kintone.help/general/ja/id/020148", "textRef": "5-1-5 グループ（ロール）と所属ユーザーの設定"}], "exam": "2026年4月30日改定", "exp": {"summary": "静的グループはメンバーを指定し、管理者が変えない限り変わらない。動的グループは条件で抽出し、組織や役職が変わると自動で変わる。", "choices": {"A": "正しい。動的グループの抽出条件には［誕生日］や［入社日］などがある。", "B": "誤り。動的グループは条件に合うユーザーがメンバーになる仕組みなので、ユーザーごとには追加・削除しない。メンバーは組織や役職の変更に応じて変わる。", "C": "誤り。それは動的グループの説明。静的グループのメンバーは、cybozu.com 共通管理者が追加・削除しない限り変わらない。", "D": "正しい。「ユーザーが所属する静的グループ（ロール）」のファイルフォーマット（ログイン名、グループコード）で一括登録できる。"}, "note": ""}}, {"id": "1-37", "set": 1, "no": 37, "category": "管理者設定", "question": "組織の設定に関する説明として、正しいものをすべて選びなさい。", "answer": ["A", "B"], "multi": true, "choices": [{"key": "A", "text": "ユーザーが複数の組織に所属する場合、プロフィールなどで優先的に表示する組織を指定することができる。", "help": "プロフィールを変更する", "url": "https://jp.kintone.help/general/ja/id/020412", "textRef": "5-1-2 ユーザーの設定"}, {"key": "B", "text": "組織を登録すると、アクセス権や通知先の設定を、組織単位でできるようになる。", "help": "組織の設定", "url": "https://jp.kintone.help/general/ja/id/020161", "textRef": "3-6-2 アプリのアクセス権"}, {"key": "C", "text": "組織の管理者は、すべての組織とその子組織に対して、組織の管理者を追加できる。", "help": "組織の管理者が操作できること", "url": "https://jp.kintone.help/general/ja/id/02010#list_administrator_uma_20", "textRef": "5-1-3 組織の設定"}, {"key": "D", "text": "組織の管理者は、組織の事前設定ができる。", "help": "組織の管理者", "url": "https://jp.kintone.help/general/ja/id/02010", "textRef": "5-1-3 組織の設定"}], "exam": "2026年4月30日改定", "exp": {"summary": "組織の管理者が操作できるのは、割り当てられた組織とそのメンバーだけ。ファイルを使った一括更新もできない。", "choices": {"A": "正しい。［優先する組織］を設定すると、複数の組織に所属していても、画面に優先的に表示する組織を指定できる。", "B": "正しい。組織を登録すると、アクセス権や通知先を組織の単位で設定できるようになる。", "C": "誤り。組織の管理者が操作できるのは、管理権限を割り当てられた組織だけ。すべての組織ではない。", "D": "誤り。組織の管理者ができる操作に、組織の事前設定は含まれない。（ヘルプにある操作は、組織情報の変更、子組織の追加、メンバーの追加・削除など）"}, "note": ""}}, {"id": "1-38", "set": 1, "no": 38, "category": "管理者設定", "question": "「kintoneシステム管理」→「アプリ管理」で確認できる内容として、誤っているものを1つ選びなさい。", "answer": ["B"], "multi": false, "choices": [{"key": "A", "text": "作成できるアプリ数の上限", "help": "アプリ管理画面でアプリの一覧を確認する", "url": "https://jp.kintone.help/k/ja/id/04012", "textRef": "5-3-2 アプリの管理"}, {"key": "B", "text": "アプリの監査ログ", "help": "アプリ管理画面でアプリの一覧を確認する", "url": "https://jp.kintone.help/k/ja/id/04012", "textRef": "5-3-2 アプリの管理"}, {"key": "C", "text": "1日のAPIを利用したリクエスト数", "help": "アプリ管理画面でアプリの一覧を確認する", "url": "https://jp.kintone.help/k/ja/id/04012", "textRef": "5-3-2 アプリの管理"}, {"key": "D", "text": "各アプリのアプリ管理者数", "help": "アプリ管理画面でアプリの一覧を確認する", "url": "https://jp.kintone.help/k/ja/id/04012", "textRef": "5-3-2 アプリの管理"}], "exam": "2026年4月30日改定", "exp": {"summary": "監査ログは cybozu.com 共通管理で見る。アプリ管理画面では見られない。", "choices": {"A": "確認できる（公式の正答による）。（ヘルプで直接は確認できず）", "B": "確認できない。監査ログは、cybozu.com 共通管理の［監査ログの閲覧とダウンロード］画面で確認する。", "C": "確認できる。［アプリの一覧］に［1日の API リクエスト数］の項目がある。", "D": "確認できる。［アプリ管理者数］の項目がある（cybozu.com 共通管理者が［手動更新データを取得］で確認する）。"}, "note": ""}}, {"id": "1-39", "set": 1, "no": 39, "category": "その他", "question": "kintoneの各コースの説明として、誤っているものをすべて選びなさい。", "answer": ["A", "D"], "multi": true, "choices": [{"key": "A", "text": "アプリ数は、ライトコースでは上限があるが、スタンダードコースは無制限で作成できる。", "help": "料金", "url": "https://kintone.cybozu.co.jp/price/", "textRef": "6-7 kintoneの契約内容"}, {"key": "B", "text": "スタンダードコースでは、JavaScriptやCSSファイルを利用したカスタマイズを行うことができる。", "help": "料金", "url": "https://kintone.cybozu.co.jp/price/", "textRef": "6-7 kintoneの契約内容"}, {"key": "C", "text": "ライトコース、スタンダードコースともに、メール・電話によるサポートを受けることができる。", "help": "料金", "url": "https://kintone.cybozu.co.jp/price/", "textRef": "6-7 kintoneの契約内容"}, {"key": "D", "text": "1つの環境で、ユーザーごとに契約コースを分けることができる。", "help": "契約コースをユーザーごとに分けられますか？", "url": "https://kintone-faq.cybozu.co.jp/hc/ja/articles/40851239475737", "textRef": "6-7 kintoneの契約内容"}], "exam": "2026年4月30日改定", "exp": {"summary": "アプリ数の上限は、ライト200個、スタンダード1,000個（ワイド3,000個）。コースはドメイン単位で、ユーザーごとには分けられない。", "choices": {"A": "誤り。スタンダードコースにもアプリ数の上限（1,000個）があり、無制限ではない。", "B": "正しい。スタンダードコースでは、プラグインなどの拡張機能や外部サービス連携を使える。（JavaScript・CSS の記載は料金ページで直接は確認できず）", "C": "正しい（公式の正答による）。料金ページでは、ライトコースのサポートは「チャット・メール」、スタンダードコースは「チャット・メール・電話」となっている。", "D": "誤り（公式の正答による）。（FAQ ページは取得できず、直接は確認できず）"}, "note": "C: 現在の料金ページ（kintone.cybozu.co.jp/price/）では、ライトコースのサポートは「チャット・メール」で、電話は含まれていない。この記載どおりなら C は誤りになり、公式の正答（C は正しい）と食い違う。"}}, {"id": "1-40", "set": 1, "no": 40, "category": "その他", "question": "APIを使ったシステム連携の説明として、適切なものをすべて選びなさい。", "answer": ["A", "B", "D"], "multi": true, "choices": [{"key": "A", "text": "kintoneで蓄積したデータをほかのシステムでも利用できる。", "help": "APIトークンを生成する", "url": "https://jp.kintone.help/k/ja/id/040471", "textRef": "3-5-3 APIトークン"}, {"key": "B", "text": "生成されたAPIトークンに対して、許可する操作を選択できる。", "help": "APIトークンを生成する", "url": "https://jp.kintone.help/k/ja/id/040471", "textRef": "3-5-3 APIトークン"}, {"key": "C", "text": "契約コースにかかわらずAPIを利用できる。", "help": "APIトークンを生成する", "url": "https://jp.kintone.help/k/ja/id/040471", "textRef": "6-7 kintoneの契約内容"}, {"key": "D", "text": "ほかのシステムのデータをkintoneでも利用できる。", "help": "APIトークンを生成する", "url": "https://jp.kintone.help/k/ja/id/040471", "textRef": "3-5-3 APIトークン"}], "exam": "2026年4月30日改定", "exp": {"summary": "API トークンは外部のプログラムとの連携用で、許可する操作を選べる。ライトコースでは使えない。", "choices": {"A": "適切。外部のプログラムが REST API を実行することで、kintone のデータをほかのシステムで使える。", "B": "適切。生成した API トークンに対して、［アクセス権］で許可する操作にチェックを入れる。", "C": "適切でない。ライトコースでは API トークンを利用できない。", "D": "適切。外部のプログラムから API でレコードを登録すれば、ほかのシステムのデータを kintone で使える。"}, "note": ""}}, {"id": "1-41", "set": 1, "no": 41, "category": "その他", "question": "ピープルの説明として、正しいものを1つ選びなさい。", "answer": ["D"], "multi": false, "choices": [{"key": "A", "text": "ピープルに投稿後、自分以外のすべてのユーザーが通知を受け取る。", "help": "ピープル", "url": "https://jp.kintone.help/k/ja/id/040679", "textRef": "6-5-2 ピープル"}, {"key": "B", "text": "ほかのユーザーのピープルにはコメントを投稿できない。", "help": "ピープル", "url": "https://jp.kintone.help/k/ja/id/040679", "textRef": "6-5-2 ピープル"}, {"key": "C", "text": "ピープル機能の利用を中止したい場合は、cybozu.com共通管理で機能を無効にできる。", "help": "ピープル", "url": "https://jp.kintone.help/k/ja/id/040679", "textRef": "5-3-7 その他の管理"}, {"key": "D", "text": "個人メッセージは、送信者と受信者以外には非公開である。", "help": "メッセージ", "url": "https://jp.kintone.help/k/ja/id/040651", "textRef": "6-5-2 ピープル"}], "exam": "2026年4月30日改定", "exp": {"summary": "個人メッセージは1対1の非公開のやり取り。ピープルの利用中止は kintone システム管理の［利用する機能の選択］で設定する。", "choices": {"A": "誤り。ピープルの投稿は、自分のピープルをフォローしているユーザーに向けたもの。すべてのユーザーではない。", "B": "誤り。ピープルでは、コメントでほかのユーザーとやり取りできる。", "C": "誤り。ピープルを使わない設定は、kintone システム管理の［利用する機能の選択］で行う。", "D": "正しい。メッセージは1対1のやり取りで、ほかのユーザーには見えない。"}, "note": ""}}, {"id": "1-42", "set": 1, "no": 42, "category": "その他", "question": "「お気に入り」に登録できないものをすべて選びなさい。", "answer": ["B", "D"], "multi": true, "choices": [{"key": "A", "text": "アプリ", "help": "アプリをお気に入りに登録する／解除する", "url": "https://jp.kintone.help/k/ja/id/040635", "textRef": "6-2-1 お気に入り"}, {"key": "B", "text": "ピープル", "help": "（該当機能なし）", "url": "", "textRef": "6-2-1 お気に入り"}, {"key": "C", "text": "スペース", "help": "スペースをお気に入りに登録する／解除する", "url": "https://jp.kintone.help/k/ja/id/040706", "textRef": "6-2-1 お気に入り"}, {"key": "D", "text": "外部WebページのURL", "help": "（該当機能なし）", "url": "", "textRef": "6-2-1 お気に入り"}], "exam": "2026年4月30日改定", "exp": {"summary": "お気に入りに登録できるのは、アプリとスペース。", "choices": {"A": "登録できる。アプリ画面右上の［お気に入り］アイコンで登録する。", "B": "登録できない。（ヘルプで直接は確認できず）ピープルをお気に入りに登録する機能はない。", "C": "登録できる。スペース画面右上の［お気に入りに追加］で登録する。", "D": "登録できない。（ヘルプで直接は確認できず）外部 Web ページの URL をお気に入りに登録する機能はない。"}, "note": ""}}, {"id": "1-43", "set": 1, "no": 43, "category": "その他", "question": "kintoneのディスク容量に関する説明として、誤っているものをすべて選びなさい。", "answer": ["C", "D"], "multi": true, "choices": [{"key": "A", "text": "ディスク容量は全ユーザーで利用できる総容量である。", "help": "ディスク容量", "url": "https://jp.kintone.help/k/ja/id/040276#disk_data_confirm_storage_capacity_10", "textRef": "6-7 kintoneの契約内容"}, {"key": "B", "text": "cybozu.com共通管理者は、ディスク使用量を確認できる。", "help": "ディスク容量", "url": "https://jp.kintone.help/k/ja/id/040276#disk_data_confirm_storage_capacity_10", "textRef": "6-7 kintoneの契約内容"}, {"key": "C", "text": "有料のゲストユーザーを契約すると、ディスク容量が増える。", "help": "ディスク容量", "url": "https://jp.kintone.help/k/ja/id/040276#disk_data_confirm_storage_capacity_10", "textRef": "6-7 kintoneの契約内容"}, {"key": "D", "text": "ディスク増設オプションを購入すると、ドメイン全体で利用できるディスク容量を5GB単位で追加できる。", "help": "ディスク容量や契約ユーザー数を追加する", "url": "https://jp.kintone.help/k/ja/id/040278#disk_data_exceed_storage_user_10", "textRef": "6-7 kintoneの契約内容"}], "exam": "2026年4月30日改定", "exp": {"summary": "ディスク容量はドメイン全体で「契約ユーザー数×5GB」。ゲストは数えない。増設は10GB単位。", "choices": {"A": "正しい。ディスク容量は、契約中のドメイン全体で利用できる容量。", "B": "正しい。cybozu.com 共通管理の［契約状況］で、ディスク使用量を確認できる。", "C": "誤り。ディスク容量は「契約ユーザー数×5GB」で、ゲストユーザーは契約ユーザーに含まれない（ゲストを契約しても増えない）。", "D": "誤り。ディスク増設は5GB単位ではなく、10GB単位。"}, "note": ""}}, {"id": "1-44", "set": 1, "no": 44, "category": "その他", "question": "ユーザーを検索する際、候補として表示される検索方法として、正しいものを1つ選びなさい。", "answer": ["B"], "multi": false, "choices": [{"key": "A", "text": "「cybozu.com共通管理」の「ユーザー」で設定したメールアドレスで検索", "help": "ユーザーやグループの検索", "url": "https://jp.kintone.help/general/ja/id/020258", "textRef": "5-1-2 ユーザーの設定"}, {"key": "B", "text": "「cybozu.com共通管理」の「ユーザー」で設定したログイン名の一部分で検索", "help": "ユーザーやグループの検索", "url": "https://jp.kintone.help/general/ja/id/020258", "textRef": "5-1-2 ユーザーの設定"}, {"key": "C", "text": "「cybozu.com共通管理」の「グループ」で設定したグループ名の一部分で検索", "help": "ユーザーやグループの検索", "url": "https://jp.kintone.help/general/ja/id/020258", "textRef": "5-1-2 ユーザーの設定"}, {"key": "D", "text": "「cybozu.com共通管理」の「グループ」で設定したグループコードの一部分で検索", "help": "ユーザーやグループの検索", "url": "https://jp.kintone.help/general/ja/id/020258", "textRef": "5-1-2 ユーザーの設定"}], "exam": "2026年4月30日改定", "exp": {"summary": "ユーザー検索の対象は、表示名、姓名、よみがな、ログイン名、別言語での表示名。メールアドレスは対象外。", "choices": {"A": "誤り。ユーザーの検索対象にメールアドレスは含まれない。", "B": "正しい。ユーザーの検索対象に［ログイン名］が含まれる。", "C": "誤り。グループ名で検索できるのは［グループ（ロール）の設定］画面のグループ検索で、ユーザーの検索候補ではない。", "D": "誤り。グループコードはグループ検索の対象で、ユーザーの検索候補ではない。"}, "note": ""}}, {"id": "1-45", "set": 1, "no": 45, "category": "その他", "question": "kintoneのモバイル版でできる操作として、誤っているものをすべて選びなさい。", "answer": ["B", "C", "D"], "multi": true, "choices": [{"key": "A", "text": "レコード詳細画面で「現在の作業者」を確認する。", "help": "モバイル版でできないこと", "url": "https://jp.kintone.help/k/ja/id/040668#mobile_access_smartphone_30", "textRef": "6-8-4 モバイル版でできないこと"}, {"key": "B", "text": "「変更履歴」で、レコードを過去のバージョンに戻す。", "help": "モバイル版でできないこと", "url": "https://jp.kintone.help/k/ja/id/040668#mobile_access_smartphone_30", "textRef": "6-8-4 モバイル版でできないこと"}, {"key": "C", "text": "絞り込み条件を保存して新しく一覧を作成する。", "help": "モバイル版でできないこと", "url": "https://jp.kintone.help/k/ja/id/040668#mobile_access_smartphone_30", "textRef": "6-8-4 モバイル版でできないこと"}, {"key": "D", "text": "レコードの集計条件を指定する。", "help": "モバイル版でできないこと", "url": "https://jp.kintone.help/k/ja/id/040668#mobile_access_smartphone_30", "textRef": "6-8-4 モバイル版でできないこと"}], "exam": "2026年4月30日改定", "exp": {"summary": "モバイル版でできないのは、過去のバージョンに戻す、絞り込みを保存して一覧を作る、集計条件の指定など。閲覧はおおむねできる。", "choices": {"A": "できる。「モバイル版でできないこと」の一覧に、現在の作業者の確認は含まれない。", "B": "できない。［変更履歴］でレコードを過去のバージョンに戻す操作は、モバイル版ではできない。", "C": "できない。絞り込み条件を保存して新しく一覧を作成する操作は、モバイル版ではできない。", "D": "できない。レコードの集計条件の指定は、モバイル版ではできない。"}, "note": ""}}, {"id": "2-01", "set": 2, "no": 1, "category": "アプリ", "question": "「アプリの設定」→「フォーム」タブで、「計算」フィールドの計算式で参照できないフィールドの種類をすべて選びなさい。", "answer": ["B", "D"], "multi": true, "choices": [{"key": "A", "text": "ドロップダウン", "help": "計算式で参照できるフィールド", "url": "https://jp.kintone.help/k/ja/id/040498", "textRef": "2-4-3 計算式"}, {"key": "B", "text": "関連レコード一覧", "help": "計算式で参照できるフィールド", "url": "https://jp.kintone.help/k/ja/id/040498", "textRef": "2-4-3 計算式"}, {"key": "C", "text": "チェックボックス", "help": "計算式で参照できるフィールド", "url": "https://jp.kintone.help/k/ja/id/040498", "textRef": "2-4-3 計算式"}, {"key": "D", "text": "ラベル", "help": "計算式で参照できるフィールド", "url": "https://jp.kintone.help/k/ja/id/040498", "textRef": "2-4-3 計算式"}], "exam": "2026年4月30日改定", "exp": {"summary": "計算式で参照できないのは、ラベル・文字列（複数行）・リッチエディター・添付ファイル・リンク・ユーザー/組織/グループ選択・関連レコード一覧・スペース・罫線・グループ・レコード番号。選択肢系（ドロップダウン・ラジオ・チェックボックス・複数選択）は参照できる。", "choices": {"A": "参照できる（不正解）。［ドロップダウン］は計算式で参照できるフィールドに含まれる。", "B": "参照できない（正解）。［関連レコード一覧］は計算式で参照できないフィールドに含まれる。", "C": "参照できる（不正解）。［チェックボックス］は計算式で参照できるフィールドに含まれる（CONTAINS関数などで使う）。", "D": "参照できない（正解）。［ラベル］は値を持たないため、計算式で参照できないフィールドに含まれる。"}, "note": ""}}, {"id": "2-02", "set": 2, "no": 2, "category": "アプリ", "question": "アプリのコメント機能の説明として、正しいものを1つ選びなさい。", "answer": ["B"], "multi": false, "choices": [{"key": "A", "text": "アプリのコメント機能は無効に設定することができない。", "help": "レコードにコメントを書き込む", "url": "https://jp.kintone.help/k/ja/id/040463", "textRef": "3-7-4 高度な設定"}, {"key": "B", "text": "コメントの宛先を指定した場合は、アプリの通知の設定にかかわらず、宛先のユーザーに「自分宛」として通知される。", "help": "レコードにコメントを書き込む", "url": "https://jp.kintone.help/k/ja/id/040463", "textRef": "1-3-2 コメントの宛先指定"}, {"key": "C", "text": "返信機能（全員に返信機能を含む）で宛先に指定できる対象は「ユーザー」のみである。", "help": "レコードにコメントを書き込む", "url": "https://jp.kintone.help/k/ja/id/040463", "textRef": "1-3-2 コメントの宛先指定"}, {"key": "D", "text": "一度書き込んだコメントであっても、あとから編集することができる。", "help": "レコードにコメントを書き込む", "url": "https://jp.kintone.help/k/ja/id/040463", "textRef": "1-3-1 レコードのコメントの表示"}], "exam": "2026年4月30日改定", "exp": {"summary": "宛先指定のコメントは、アプリの通知設定にかかわらず宛先に「自分宛」で届く。コメントは編集できず、削除して書き直す。", "choices": {"A": "誤り。アプリの設定でレコードのコメント機能を無効にでき、無効の場合はコメントを書き込めない。", "B": "正しい。宛先を指定した場合は、アプリの通知の設定にかかわらず、宛先のユーザーに「自分宛」として通知される（ただしレコードの閲覧権限がないユーザーには通知されない）。", "C": "誤り。［全員に返信］では、コメントの宛先のユーザー・組織・グループが宛先に指定されるため、ユーザーのみではない。", "D": "誤り。一度書き込んだコメントはあとから編集できない。書き直すには削除して再度書き込む。"}, "note": ""}}, {"id": "2-03", "set": 2, "no": 3, "category": "アプリ", "question": "「アプリの設定」→「フォーム」タブで、「時刻」フィールドの説明として、正しいものを1つ選びなさい。", "answer": ["C"], "multi": false, "choices": [{"key": "A", "text": "アプリごとに、時刻の表記を12時間表記、または24時間表記に切り替えられる。\n初期設定では、12時間表記が設定されている。", "help": "時刻", "url": "https://jp.kintone.help/k/ja/id/040540", "textRef": "2-2-6 日付と時刻"}, {"key": "B", "text": "時刻のドロップダウンに、特定の範囲の時刻のみを指定して表示することができる。\n（例：会社の始業時刻から終業時刻のみを表示する等）", "help": "時刻", "url": "https://jp.kintone.help/k/ja/id/040540", "textRef": "2-2-6 日付と時刻"}, {"key": "C", "text": "入力した時刻は、ユーザーのタイムゾーンにかかわらず、すべてのユーザーで同じ時刻が表示される。", "help": "時刻", "url": "https://jp.kintone.help/k/ja/id/040540", "textRef": "2-2-6 日付と時刻"}, {"key": "D", "text": "「時刻」フィールドをクリックしたときに表示されるドロップダウンリストの時刻表記は、15分単位で選択できる。", "help": "時刻", "url": "https://jp.kintone.help/k/ja/id/040540", "textRef": "2-2-6 日付と時刻"}], "exam": "2026年4月30日改定", "exp": {"summary": "時刻フィールドはタイムゾーンに関係なく全員に同じ時刻が表示される（日時フィールドはタイムゾーンに沿って表示）。ドロップダウンは30分単位で、表示範囲は指定できない。", "choices": {"A": "誤り。［時刻］フィールドの設定項目は、フィールド名・必須・初期値・フィールドコードなどで、アプリごとに12時間/24時間表記を切り替える項目はない（ヘルプで直接は確認できず。なお時刻表記はモバイル版でも［個人設定］にある）。", "B": "誤り。時刻のドロップダウンリストに表示する時刻の範囲は指定できない。始業から終業のみ表示するような指定はできない。", "C": "正しい。［時刻］フィールドは、ユーザーのタイムゾーンにかかわらず、すべてのユーザーで同じ時刻が表示される。", "D": "誤り。ドロップダウンリストは15分単位ではなく30分単位で表示される（モバイル版は1分単位で選択）。"}, "note": ""}}, {"id": "2-04", "set": 2, "no": 4, "category": "アプリ", "question": "「アプリの設定」→「フォーム」タブで、「数値」フィールドの説明として、正しいものを1つ選びなさい。", "answer": ["A"], "multi": false, "choices": [{"key": "A", "text": "数値フィールドに入力した値は、kintone全体の検索や、アプリ内検索、スペース内検索の対象にはならない。", "help": "数値", "url": "https://jp.kintone.help/k/ja/id/040534", "textRef": "6-3-1 kintone全体を検索する"}, {"key": "B", "text": "小数点以下の表示桁数を指定して、指定した桁数を超えた小数部を四捨五入して表示できる。", "help": "数値", "url": "https://jp.kintone.help/k/ja/id/040534", "textRef": "2-2-4 数値と計算"}, {"key": "C", "text": "「数値」フィールドで指定した単位記号は、変更履歴には表示されない。", "help": "数値", "url": "https://jp.kintone.help/k/ja/id/040534", "textRef": "2-2-4 数値と計算"}, {"key": "D", "text": "入力可能な値の範囲について、最小値と最大値のどちらか一方しか指定できない。", "help": "数値", "url": "https://jp.kintone.help/k/ja/id/040534", "textRef": "2-2-4 数値と計算"}], "exam": "2026年4月30日改定", "exp": {"summary": "数値フィールドの値は検索対象外。小数点以下の表示桁数は「切り捨て」表示で、データ自体は変わらない。", "choices": {"A": "正しい。［数値］フィールドに入力した値は、kintone全体の検索、アプリ内検索、スペース内検索の対象にはならない。", "B": "誤り。指定した桁数を超えた小数部は、四捨五入ではなく切り捨てて表示される。", "C": "誤り（公式の正答）。単位記号が変更履歴に表示されるかどうかは（ヘルプで直接は確認できず）。", "D": "誤り。値の制限は、最小値と最大値のどちらか一方、または両方とも指定できる。"}, "note": ""}}, {"id": "2-05", "set": 2, "no": 5, "category": "アプリ", "question": "「アプリの削除」の説明として、正しいものをすべて選びなさい。", "answer": ["A", "B", "C"], "multi": true, "choices": [{"key": "A", "text": "「アプリの設定」→「設定」タブで、アプリを削除できる。", "help": "アプリを削除する", "url": "https://jp.kintone.help/k/ja/id/040633", "textRef": "3-8-6 アプリの削除"}, {"key": "B", "text": "「手動で参照を解除」で、ほかのアプリからの参照を解除し、対象のアプリのみを削除できる。", "help": "アプリを削除する", "url": "https://jp.kintone.help/k/ja/id/040633", "textRef": "3-8-6 アプリの削除"}, {"key": "C", "text": "「まとめて削除機能」で参照関係のあるアプリも含めて一括で削除できる。", "help": "アプリを削除する", "url": "https://jp.kintone.help/k/ja/id/040633", "textRef": "3-8-6 アプリの削除"}, {"key": "D", "text": "削除したアプリは復旧できない。", "help": "アプリを削除する", "url": "https://jp.kintone.help/k/ja/id/040633", "textRef": "3-8-6 アプリの削除"}], "exam": "2026年4月30日改定", "exp": {"summary": "アプリは「アプリの設定」→「設定」タブで削除。参照関係があれば「まとめて削除」か「手動で参照を解除」。削除後14日未満ならcybozu.com共通管理者が復旧できる可能性がある。", "choices": {"A": "正しい。［アプリの設定］画面の［設定］タブで、［アプリの削除］にある［アプリを削除する］から削除できる。", "B": "正しい。［手動で参照を解除］で、ほかのアプリの［ルックアップ］や［関連レコード一覧］からの参照を解除すれば、アプリを単独で削除できる。", "C": "正しい。参照関係のあるアプリが見つかった場合、「まとめて削除機能」で直接・間接に参照しているアプリもまとめて削除できる。", "D": "誤り。誤って削除した場合、削除から14日以上経過していなければ、cybozu.com共通管理者がアプリを復旧できる可能性がある（一部設定は復旧できない）。"}, "note": ""}}, {"id": "2-06", "set": 2, "no": 6, "category": "アプリ", "question": "CONTAINS関数を使って、宿泊食事フィールドの夕食または朝食のいずれかにチェックがあれば「食事あり」、そうでなければ「食事なし」と表示するための計算式として、適切なものを1つ選びなさい。", "answer": ["C"], "multi": false, "choices": [{"key": "A", "text": "IF(CONTAINS(宿泊食事,\"夕食\"OR\"朝食\"), \"食事あり\", \"食事なし\")", "help": "CONTAINS関数：フィールドの中に、指定した文字列と完全一致するものがあるか判定する", "url": "https://jp.kintone.help/k/ja/id/040506", "textRef": "2-4-3 計算式"}, {"key": "B", "text": "IF(CONTAINS(宿泊食事,OR(\"夕食\",\"朝食\")), \"食事あり\", \"食事なし\")", "help": "CONTAINS関数：フィールドの中に、指定した文字列と完全一致するものがあるか判定する", "url": "https://jp.kintone.help/k/ja/id/040506", "textRef": "2-4-3 計算式"}, {"key": "C", "text": "IF(OR(CONTAINS(宿泊食事, \"夕食\"),CONTAINS(宿泊食事, \"朝食\")), \"食事あり\", \"食事なし\")", "help": "CONTAINS関数：フィールドの中に、指定した文字列と完全一致するものがあるか判定する", "url": "https://jp.kintone.help/k/ja/id/040506", "textRef": "2-4-3 計算式"}, {"key": "D", "text": "IF(AND(CONTAINS(宿泊食事, \"夕食\"),CONTAINS(宿泊食事, \"朝食\")), \"食事あり\", \"食事なし\")", "help": "CONTAINS関数：フィールドの中に、指定した文字列と完全一致するものがあるか判定する", "url": "https://jp.kintone.help/k/ja/id/040506", "textRef": "2-4-3 計算式"}], "exam": "2026年4月30日改定", "exp": {"summary": "「AまたはB」は、CONTAINSを2つ書いてOR関数で囲む。CONTAINSの引数は「フィールドコード」と「検索文字列」1つずつ。", "choices": {"A": "誤り。CONTAINS関数の第2引数には、ダブルクォーテーションで囲んだ検索文字列を1つ指定する。文字列同士をORでつなぐ書き方はできない。", "B": "誤り。CONTAINS関数の第2引数は検索文字列であり、OR関数を入れることはできない。ORは複数のCONTAINSの判定結果を組み合わせるときに使う。", "C": "正しい。ヘルプの「土曜日または日曜日のいずれか」の例と同じく、OR関数の中にCONTAINS関数を2つ書き、IF関数で表示を分ける。", "D": "誤り。AND関数だと夕食と朝食の両方にチェックがある場合だけ「食事あり」になり、「いずれか」の条件にならない。"}, "note": ""}}, {"id": "2-07", "set": 2, "no": 7, "category": "アプリ", "question": "「通知」の説明として、正しいものをすべて選びなさい。", "answer": ["A", "D"], "multi": true, "choices": [{"key": "A", "text": "「日付」や「日時」のフィールドの値を基準にして、指定した通知先にリマインド通知できる。", "help": "リマインダーの条件通知：日時を条件にしたリマインド通知を設定する", "url": "https://jp.kintone.help/k/ja/id/040564", "textRef": "3-4-4 リマインダーの条件通知"}, {"key": "B", "text": "「関連レコード一覧」フィールドの値を使用した\n通知条件を指定できる。", "help": "レコードの条件通知：レコードが特定の条件を満たしたときの通知を設定する", "url": "https://jp.kintone.help/k/ja/id/040563", "textRef": "3-4-4 リマインダーの条件通知"}, {"key": "C", "text": "定期レポートが出力されたとき、アプリの管理権限を持つユーザーに通知が送信される。", "help": "定期レポートとは", "url": "https://jp.kintone.help/k/ja/id/040582", "textRef": "3-4-1 アプリの通知とは"}, {"key": "D", "text": "フィールドの値が特定の条件を満たしたときに、指定した通知先に通知するよう設定できる。", "help": "レコードの条件通知：レコードが特定の条件を満たしたときの通知を設定する", "url": "https://jp.kintone.help/k/ja/id/040563", "textRef": "3-4-3 レコードの条件通知"}], "exam": "2026年4月30日改定", "exp": {"summary": "日付/日時を基準にするのがリマインダーの条件通知、フィールド値の条件で通知するのがレコードの条件通知。関連レコード一覧は条件に使えない。定期レポートの通知は設定したユーザーへ。", "choices": {"A": "正しい。リマインダーの条件通知は、［日付］や［日時］フィールドの値を基準に「～日前」「～日後」といった条件で通知できる。", "B": "誤り。レコードの条件通知では、［関連レコード一覧］フィールドの値を使用した条件は指定できない。", "C": "誤り。定期レポートが出力されたときは、定期レポートを設定したユーザーに通知される。アプリの管理権限を持つユーザー全員に通知されるのは、出力に失敗したとき。", "D": "正しい。レコードの条件通知を設定すると、フィールドの値が特定の条件を満たしたときに、指定した通知先に通知できる。"}, "note": ""}}, {"id": "2-08", "set": 2, "no": 8, "category": "アプリ", "question": "フォームに設定されている「ユーザー選択」フィールドを指定して設定できるアクセス権の種類として、誤っているものをすべて選びなさい。", "answer": ["A", "B"], "multi": true, "choices": [{"key": "A", "text": "アプリの作成権限", "help": "レコードにアクセス権を設定する", "url": "https://jp.kintone.help/k/ja/id/040595", "textRef": "3-6-2 アプリのアクセス権"}, {"key": "B", "text": "アプリのアクセス権", "help": "レコードにアクセス権を設定する", "url": "https://jp.kintone.help/k/ja/id/040595", "textRef": "3-6-2 アプリのアクセス権"}, {"key": "C", "text": "レコードのアクセス権", "help": "レコードにアクセス権を設定する", "url": "https://jp.kintone.help/k/ja/id/040595", "textRef": "3-6-3 レコードのアクセス権"}, {"key": "D", "text": "フィールドのアクセス権", "help": "フィールドにアクセス権を設定する", "url": "https://jp.kintone.help/k/ja/id/040593", "textRef": "3-6-4 フィールドのアクセス権"}], "exam": "2026年4月30日改定", "exp": {"summary": "フォームの［ユーザー選択］フィールドを対象にできるのは、レコードのアクセス権とフィールドのアクセス権。", "choices": {"A": "誤り（正解）。アプリの作成権限はkintone全体のアクセス権であり、フォームのフィールドを指定して設定するものではない。", "B": "誤り（正解）。アプリのアクセス権は、フォームの［ユーザー選択］フィールドを指定して設定する対象ではない（このページで対象として挙がるのはレコードとフィールドのアクセス権。アプリのアクセス権のページはヘルプで直接は確認できず）。", "C": "正しい。レコードのアクセス権では［フォームのフィールドを追加］から［ユーザー］（ユーザー選択）フィールドを指定でき、レコードごとに選ばれたユーザーを対象にできる。", "D": "正しい。フィールドのアクセス権でも［フォームのフィールドを追加］から［ユーザー］（ユーザー選択）フィールドを選択できる。"}, "note": ""}}, {"id": "2-09", "set": 2, "no": 9, "category": "アプリ", "question": "レコードの変更履歴の説明として、正しいものを1つ選びなさい。", "answer": ["A"], "multi": false, "choices": [{"key": "A", "text": "レコード編集時に何も変更せずに保存した場合、変更履歴のバージョン番号が連番にならず、欠番が発生することがある。", "help": "レコードの変更履歴を確認する／過去のバージョンに戻す", "url": "https://jp.kintone.help/k/ja/id/040461", "textRef": "1-3-3 変更履歴の表示"}, {"key": "B", "text": "レコードの変更履歴の記録機能は、無効に設定できない。", "help": "レコードの変更履歴を確認する／過去のバージョンに戻す", "url": "https://jp.kintone.help/k/ja/id/040461", "textRef": "1-3-4 変更履歴の無効"}, {"key": "C", "text": "表示されるのはあくまで変更履歴のみであり、レコードの作成者・作成日時を確認できない。", "help": "レコードの変更履歴を確認する／過去のバージョンに戻す", "url": "https://jp.kintone.help/k/ja/id/040
