複数のスレッドを使えるスペースへの変更はできるが、1つのスレッドだけを使うスペースには戻せない。", "D": "正しい。kintoneに登録されたスペーステンプレートを元に、新しいスペースを作成できる。"}, "note": ""}}, {"id": "3-29", "set": 3, "no": 29, "category": "スペース", "question": "スペースの設定変更に関する説明として、正しいものをすべて選びなさい。", "answer": ["A", "C", "D"], "multi": true, "choices": [{"key": "A", "text": "「参加メンバーだけにこのスペースを公開する」機能を有効にすると、スペースの参加者以外のユーザーには、スペースが表示されない。", "help": "スペースの設定を変更する", "url": "https://jp.kintone.help/k/ja/id/040696", "textRef": "4-1-3 スペースの設定の変更"}, {"key": "B", "text": "「スペースのポータルと複数のスレッドを使用する」機能は、有効から無効に設定できる。", "help": "スペースの設定を変更する", "url": "https://jp.kintone.help/k/ja/id/040696", "textRef": "4-1-3 スペースの設定の変更"}, {"key": "C", "text": "「スペースの参加/退会、スレッドのフォロー/フォロー解除を禁止する」機能を有効にすると、スペースに未参加のユーザーに対して、スペースへの参加と、スレッドのフォローが禁止される。", "help": "スペースの設定を変更する", "url": "https://jp.kintone.help/k/ja/id/040696", "textRef": "4-1-3 スペースの設定の変更"}, {"key": "D", "text": "「スペースの参加/退会、スレッドのフォロー/フォロー解除を禁止する」機能を有効にすると、スペースの参加メンバーに対して、スペースからの退会と、スレッドのフォローの解除が禁止される。", "help": "スペースの設定を変更する", "url": "https://jp.kintone.help/k/ja/id/040696", "textRef": "4-1-3 スペースの設定の変更"}], "exam": "2026年4月30日改定", "exp": {"summary": "参加／退会・フォローの禁止は、参加メンバー（退会とフォロー解除の禁止）と未参加者（参加とフォローの禁止）の両方に効く。", "choices": {"A": "正しい。［参加メンバーだけにこのスペースを公開する］にチェックを入れると、参加者以外のユーザーにはスペースが公開されない。", "B": "誤り。複数のスレッドを使えるスペースへの変更はできるが、有効から無効（1つのスレッドだけ）には変更できない。", "C": "正しい。チェックを入れると、スペースに未参加のユーザーは、スペースへの参加とスレッドのフォローができなくなる。", "D": "正しい。チェックを入れると、スペースの参加メンバーは、スペースからの退会とスレッドのフォロー解除ができなくなる。"}, "note": ""}}, {"id": "3-30", "set": 3, "no": 30, "category": "スペース", "question": "スペース内アプリの説明として、正しいものをすべて選びなさい。", "answer": ["B", "C", "D"], "multi": true, "choices": [{"key": "A", "text": "スペース内アプリは、「Private」アプリグループに所属する。", "help": "スペース内アプリとは", "url": "https://jp.kintone.help/k/ja/id/040709", "textRef": "4-2-3 スペース内アプリ"}, {"key": "B", "text": "非公開のスペースに所属するアプリには、スペースのメンバーだけがアクセスできる。", "help": "スペース内アプリとは", "url": "https://jp.kintone.help/k/ja/id/040709", "textRef": "4-2-3 スペース内アプリ"}, {"key": "C", "text": "参加していないスペースのアプリは、kintoneのポータルの「すべてのアプリ」には表示されない。", "help": "スペース内アプリとは", "url": "https://jp.kintone.help/k/ja/id/040709", "textRef": "4-2-3 スペース内アプリ"}, {"key": "D", "text": "初期設定では、そのスペースを閲覧可能でアプリの作成権限を持つユーザーであれば、スペース内アプリを作成できる。", "help": "スペースごとに、アプリを作成できるユーザーを限定する", "url": "https://jp.kintone.help/k/ja/id/040695", "textRef": "4-2-3 スペース内アプリ"}], "exam": "2026年4月30日改定", "exp": {"summary": "スペース内アプリはPublicアプリグループに固定される。非公開スペースのアプリにアクセスできるのはメンバーだけ。", "choices": {"A": "誤り。スペース内アプリは「Public」アプリグループに所属し、ほかのアプリグループには変更できない。", "B": "正しい。非公開のスペースに所属するアプリには、スペースのメンバーだけがアクセスできる。", "C": "正しい。参加していないスペースのアプリは、ポータルの［すべてのアプリ］と［最近公開されたアプリ］に表示されない。", "D": "正しい。初期設定では、そのスペースを閲覧できるユーザーであればスペース内アプリを作成できる。ただし、kintoneシステム管理でアプリの作成が許可されている必要がある。"}, "note": ""}}, {"id": "3-31", "set": 3, "no": 31, "category": "管理者設定", "question": "「cybozu.com共通管理」→「グループ（ロール）」で設定できるグループの説明として、誤っているものをすべて選びなさい。", "answer": ["A", "B"], "multi": true, "choices": [{"key": "A", "text": "「静的グループ」と「動的グループ」の2つのタイプがあり、一度設定したタイプは途中で変更できる。", "help": "グループ（ロール）の設定", "url": "https://jp.kintone.help/general/ja/id/020170", "textRef": "5-1-5 グループ（ロール）と所属ユーザーの設定"}, {"key": "B", "text": "グループを削除すると、グループの所属ユーザーを一括で削除できる。", "help": "グループ（ロール）の設定", "url": "https://jp.kintone.help/general/ja/id/020170", "textRef": "5-1-5 グループ（ロール）と所属ユーザーの設定"}, {"key": "C", "text": "アクセス権の設定や、コメント、通知の宛先などに利用できる。", "help": "グループ（ロール）の設定", "url": "https://jp.kintone.help/general/ja/id/020170", "textRef": "5-1-5 グループ（ロール）と所属ユーザーの設定"}, {"key": "D", "text": "kintoneでグループを選択する際の表示順を変更できる。", "help": "グループ（ロール）の設定", "url": "https://jp.kintone.help/general/ja/id/020170", "textRef": "5-1-5 グループ（ロール）と所属ユーザーの設定"}], "exam": "2026年4月30日改定", "exp": {"summary": "グループタイプ（静的／動的）は作成後に変更できない。グループを削除しても、メンバーのアカウントは削除されない。", "choices": {"A": "誤り。静的グループと動的グループのタイプはグループの作成時に設定し、後から変更できない。", "B": "誤り。グループを削除しても、所属しているメンバーのアカウントは削除されない（そのグループを使ったアクセス権が無効になる）。", "C": "正しい。グループは、アクセス権の設定や、コメント・通知の宛先などに利用できる。", "D": "正しい。グループの表示順は変更でき、変更後の順番は管理画面の一覧やドロップダウンリストに反映される。"}, "note": ""}}, {"id": "3-32", "set": 3, "no": 32, "category": "管理者設定", "question": "組織間のアクセス権を禁止した場合の説明として、誤っているものを1つ選びなさい。", "answer": ["C"], "multi": false, "choices": [{"key": "A", "text": "所属する最上位組織が異なるユーザー間では、互いのプロフィールと組織情報を検索できない。", "help": "組織間のアクセスを禁止する", "url": "https://jp.kintone.help/general/ja/id/020164", "textRef": "5-1-9 組織間のアクセス権"}, {"key": "B", "text": "cybozu.com共通管理者は、全ユーザーのプロフィールと組織情報を閲覧できる。", "help": "組織間のアクセスを禁止する", "url": "https://jp.kintone.help/general/ja/id/020164", "textRef": "5-1-9 組織間のアクセス権"}, {"key": "C", "text": "所属する最上位織が異なるユーザー間でも、コメントの宛先が指定できる。", "help": "組織間のアクセスを禁止する", "url": "https://jp.kintone.help/general/ja/id/020164", "textRef": "5-1-9 組織間のアクセス権"}, {"key": "D", "text": "所属する最上位組織が異なるユーザー間では、レコードの一覧画面でのユーザー名が表示されない。", "help": "組織間のアクセスを禁止する", "url": "https://jp.kintone.help/general/ja/id/020164", "textRef": "5-1-9 組織間のアクセス権"}], "exam": "2026年4月30日改定", "exp": {"summary": "組織間のアクセスを禁止すると、最上位組織が異なるユーザーは［表示できないユーザー］になる。［ユーザー選択］フィールドやコメントの宛先も制限される。", "choices": {"A": "正しい。最上位組織が異なるユーザー間では、プロフィールと組織情報の閲覧・検索が制限される。", "B": "正しい。組織間のアクセスを禁止しても、cybozu.com共通管理者は、共通管理で全ユーザーのプロフィールと組織情報を閲覧できる。", "C": "誤り。［ユーザー選択］フィールドやコメントの宛先も制限の対象になる。", "D": "正しい。閲覧制限がかかったユーザーの表示名は［表示できないユーザー］という代替表記に置き換えられる。"}, "note": ""}}, {"id": "3-33", "set": 3, "no": 33, "category": "管理者設定", "question": "kintoneのアプリ管理権限を持つシステム管理者ができる操作として、正しいものをすべて選びなさい。", "answer": ["A", "B", "D"], "multi": true, "choices": [{"key": "A", "text": "kintoneシステム管理やアプリにプラグインを追加できる。", "help": "kintoneシステム管理者", "url": "https://jp.kintone.help/k/ja/id/04058#permission_admin_permissions_concept_20", "textRef": "5-3-7 その他の管理"}, {"key": "B", "text": "アプリ管理の「アプリの一覧」で、自分が管理権限をもつアプリの添付ファイルサイズの合計を確認できる。", "help": "アプリ管理画面でアプリの一覧を確認する", "url": "https://jp.kintone.help/k/ja/id/04012", "textRef": "5-3-2 アプリの管理"}, {"key": "C", "text": "プラグインの一覧をCSV形式でダウンロードできる。", "help": "プラグインの一覧をCSV形式でダウンロードする", "url": "https://jp.kintone.help/k/ja/id/0409", "textRef": "5-3-7 その他の管理"}, {"key": "D", "text": "新機能の先行利用や、現在開発中の新機能の一部を有効化できる。", "help": "kintoneシステム管理者", "url": "https://jp.kintone.help/k/ja/id/04058#permission_admin_permissions_concept_20", "textRef": "5-3-7 その他の管理"}], "exam": "2026年4月30日改定", "exp": {"summary": "プラグインの一覧をCSVでダウンロードできるのはcybozu.com共通管理者だけ。kintoneシステム管理者は、プラグインの登録やアップデートオプションの設定ができる。", "choices": {"A": "正しい。kintoneシステム管理者ができることの例に「プラグインの登録」がある。", "B": "正しい。［アプリ管理］の［アプリの一覧］では自分が管理権限を持つアプリを確認でき、［添付ファイルの合計サイズ］の項目がある（表示される項目は環境や契約のコースで異なる）。", "C": "誤り。プラグインの一覧をCSV形式でダウンロードできるのは、cybozu.com共通管理者。", "D": "正しい。kintoneシステム管理者ができることの例に「アップデートオプションの設定」があり、新機能を先行して有効化できる。"}, "note": ""}}, {"id": "3-34", "set": 3, "no": 34, "category": "管理者設定", "question": "kintoneのヘッダーとログインページのカスタマイズに関する説明として、正しいものをすべて選びなさい。", "answer": ["A", "C"], "multi": true, "choices": [{"key": "A", "text": "kintone画面左上に表示するロゴを、自社のロゴに変更できる。", "help": "ヘッダーのロゴを変更する", "url": "https://jp.kintone.help/k/ja/id/04038", "textRef": "5-2-6 ロゴとログインページのカスタマイズ"}, {"key": "B", "text": "ヘッダーの設定で、ロゴのリンク先URLを空欄にすると、リンクが無効になる。", "help": "ヘッダーのロゴを変更する", "url": "https://jp.kintone.help/k/ja/id/04038", "textRef": "5-2-6 ロゴとログインページのカスタマイズ"}, {"key": "C", "text": "「cybozu.com共通管理」→「カスタマイズ」で、ヘッダーとログインページのカスタマイズができる。", "help": "ヘッダーのロゴを変更する", "url": "https://jp.kintone.help/k/ja/id/04038", "textRef": "5-2-6 ロゴとログインページのカスタマイズ"}, {"key": "D", "text": "ログインページの設定で、タイトルを変更すると、サイボウズドットコム ストアに登録された会社名も同時に変更できる。", "help": "ヘッダーのロゴを変更する", "url": "https://jp.kintone.help/k/ja/id/04038", "textRef": "5-2-6 ロゴとログインページのカスタマイズ"}], "exam": "2026年4月30日改定", "exp": {"summary": "ロゴやログインページの変更は「cybozu.com共通管理 → カスタマイズ」で、共通管理者だけができる。URLを空欄にするとトップページへのリンクになる。", "choices": {"A": "正しい。ヘッダーに表示するロゴを変更でき、自社のロゴを設定する方法も紹介されている。", "B": "誤り。［URL］を空欄にした場合、ロゴをクリックするとkintoneのトップページが表示される。リンクが無効になるわけではない。", "C": "正しい。cybozu.com共通管理の［カスタマイズ］で、［ロゴ］や［ログインページ］を設定できる。", "D": "誤り。［ログインページの設定］で［タイトル］を変更しても、サイボウズドットコム ストアに登録された会社名は変更されない。"}, "note": ""}}, {"id": "3-35", "set": 3, "no": 35, "category": "管理者設定", "question": "kintoneのアクセス権の説明として、誤っているものを1つ選びなさい。", "answer": ["B"], "multi": false, "choices": [{"key": "A", "text": "kintoneシステム管理者は、アクセス権の管理画面で、システムの管理／アプリの管理／スペースの作成等、ユーザーに許可する権限を設定できる。", "help": "kintoneシステム管理で設定できるアクセス権", "url": "https://jp.kintone.help/k/ja/id/04062", "textRef": "5-3-5 権限の管理"}, {"key": "B", "text": "kintoneの初期設定では、cybozu.com共通管理者だけに「アプリの作成」が許可されている。", "help": "kintoneシステム管理で設定できるアクセス権", "url": "https://jp.kintone.help/k/ja/id/04062", "textRef": "5-3-5 権限の管理"}, {"key": "C", "text": "アプリ管理者が設定できるアクセス権として、アプリの管理権限、レコードの閲覧／追加／編集／削除の権限、およびファイルの書き出し／読み込みの権限がある。", "help": "アプリにアクセス権を設定する", "url": "https://jp.kintone.help/k/ja/id/040589", "textRef": "3-6-2 アプリのアクセス権"}, {"key": "D", "text": "アプリグループのアクセス権の設定が、各アプリの設定よりも優先される。", "help": "アプリグループにアクセス権を設定する", "url": "https://jp.kintone.help/k/ja/id/04025", "textRef": "3-6-2 アプリのアクセス権"}], "exam": "2026年4月30日改定", "exp": {"summary": "初期設定でcybozu.com共通管理者だけに許可されているのは「ゲストスペースの作成」。アプリの作成とスペースの作成は、全ユーザーに許可されている。", "choices": {"A": "正しい。kintoneシステム管理の［アクセス権］では、システムの管理、アプリの作成、アプリの管理、スペースの作成などの権限を設定できる。", "B": "誤り。初期設定では、すべてのユーザーにアプリの作成が許可されている（共通管理者だけに許可されているのはゲストスペースの作成）。", "C": "正しい。アプリ管理者は、アプリの管理権限、レコードの閲覧・追加・編集・削除、ファイルの書き出し・読み込みの権限を設定できる。", "D": "正しい。アプリグループで禁止されている操作は、アプリのアクセス権の設定にかかわらず実行できない。"}, "note": ""}}, {"id": "3-36", "set": 3, "no": 36, "category": "管理者設定", "question": "ゲストに設定できないセキュリティ対策をすべて選びなさい。", "answer": ["A", "C"], "multi": true, "choices": [{"key": "A", "text": "SAML認証を有効にする", "help": "ゲストユーザーには利用できないkintoneの機能や操作を知りたい", "url": "https://jp.kintone.help/k/ja/id/040340", "textRef": "5-3-4 ゲストユーザーの管理"}, {"key": "B", "text": "パスワードの有効期間", "help": "ゲストユーザーには利用できないkintoneの機能や操作を知りたい", "url": "https://jp.kintone.help/k/ja/id/040340", "textRef": "5-3-4 ゲストユーザーの管理"}, {"key": "C", "text": "IPアドレス制限", "help": "ゲストユーザーには利用できないkintoneの機能や操作を知りたい", "url": "https://jp.kintone.help/k/ja/id/040340", "textRef": "5-3-4 ゲストユーザーの管理"}, {"key": "D", "text": "二段階認証", "help": "ゲストユーザーには利用できないkintoneの機能や操作を知りたい", "url": "https://jp.kintone.help/k/ja/id/040340", "textRef": "5-3-4 ゲストユーザーの管理"}], "exam": "2026年4月30日改定", "exp": {"summary": "ゲストに適用できないのは、IPアドレス制限、Basic認証、セキュアアクセス、SAML認証、2要素認証。二段階認証とパスワードの有効期間はゲストにも適用される。", "choices": {"A": "設定できない。SAML認証によるシングルサインオンを使えるのはユーザーアカウントだけで、ゲストアカウントには適用されない。", "B": "設定できる。パスワードポリシーの［有効期間］は、ゲストアカウントにも同じ設定が適用される。", "C": "設定できない。IPアドレス制限、Basic認証、セキュアアクセスは、ゲストユーザーに設定できない。", "D": "設定できる。ゲストユーザーには二段階認証を設定できる（2要素認証は利用できない）。"}, "note": ""}}, {"id": "3-37", "set": 3, "no": 37, "category": "管理者設定", "question": "kintoneの「アクセス状況の一覧」をCSV形式でダウンロードしたとき、ファイルに含まれる内容をすべて選びなさい。", "answer": ["A", "D"], "multi": true, "choices": [{"key": "A", "text": "ユーザーの最終アクセス日", "help": "「アクセス状況の一覧」をCSV形式でダウンロードする", "url": "https://jp.kintone.help/k/ja/id/040782#admin_user_monitoring_40", "textRef": "5-3-7 その他の管理"}, {"key": "B", "text": "ゲストユーザーのアクセス状況", "help": "「アクセス状況の一覧」をCSV形式でダウンロードする", "url": "https://jp.kintone.help/k/ja/id/040782#admin_user_monitoring_40", "textRef": "5-3-7 その他の管理"}, {"key": "C", "text": "ユーザーの過去30日間のアクセス回数", "help": "「アクセス状況の一覧」をCSV形式でダウンロードする", "url": "https://jp.kintone.help/k/ja/id/040782#admin_user_monitoring_40", "textRef": "5-3-7 その他の管理"}, {"key": "D", "text": "ユーザーの過去30日間のアクセス日数", "help": "「アクセス状況の一覧」をCSV形式でダウンロードする", "url": "https://jp.kintone.help/k/ja/id/040782#admin_user_monitoring_40", "textRef": "5-3-7 その他の管理"}], "exam": "2026年4月30日改定", "exp": {"summary": "アクセス状況のCSVに含まれるのは、ユーザー、ログイン名、組織、組織コード、最終アクセス日、過去30日間のアクセス日数。回数ではなく日数で、ゲストは対象外。", "choices": {"A": "含まれる。［最終アクセス日］が「yyyy-MM-dd」の形式で出力される。", "B": "含まれない。ゲストユーザーのアクセス状況は表示されず、CSVにも含まれない。", "C": "含まれない。出力されるのは［過去30日間のアクセス日数］で、アクセス回数という項目はない。", "D": "含まれる。［過去30日間のアクセス日数］が出力される。"}, "note": ""}}, {"id": "3-38", "set": 3, "no": 38, "category": "管理者設定", "question": "「cybozu.com共通管理」→「組織とユーザーの設定」で、設定できることを1つ選びなさい。", "answer": ["C"], "multi": false, "choices": [{"key": "A", "text": "「cybozu.com共通管理」の一時的な管理者の追加", "help": "一時的な管理者を作成する", "url": "https://jp.kintone.help/general/ja/id/020265", "textRef": "5-4-3 ドメイン管理"}, {"key": "B", "text": "クライアント証明書の発行", "help": "セキュアアクセスを設定する", "url": "https://jp.kintone.help/general/ja/id/02062#list_secureaccess_secureaccess_30", "textRef": "5-1-3 組織の設定"}, {"key": "C", "text": "ユーザーの使用停止、再開", "help": "ユーザーを使用停止にする", "url": "https://jp.kintone.help/general/ja/id/020252", "textRef": "5-1-2 ユーザーの設定"}, {"key": "D", "text": "削除したユーザーの復旧", "help": "ユーザーを削除する", "url": "https://jp.kintone.help/general/ja/id/020227", "textRef": "5-1-2 ユーザーの設定"}], "exam": "2026年4月30日改定", "exp": {"summary": "［組織/ユーザー］で使用状態を［停止中］にすれば、ユーザーの停止と再開ができる。一時的な管理者の作成はストア、証明書の発行は［発行とダウンロード］で行い、削除したユーザーは復旧できない。", "choices": {"A": "設定できない。一時的な管理者は、cybozu.com共通管理ではなくサイボウズドットコム ストアで作成する。", "B": "設定できない。クライアント証明書は、cybozu.com共通管理の［発行とダウンロード］で発行する。", "C": "設定できる。［組織/ユーザー］でユーザーを選び、［アカウントの使用状態］の［使用状態］を［停止中］にして使用を停止する（再開も同じ画面で行う）。", "D": "設定できない。ユーザーアカウントの削除は取り消せず、復旧できない。"}, "note": ""}}, {"id": "3-39", "set": 3, "no": 39, "category": "その他", "question": "kintoneのモバイル版でできる操作として、誤っているものをすべて選びなさい。", "answer": ["A", "B", "C"], "multi": true, "choices": [{"key": "A", "text": "アプリの作成および設定", "help": "モバイルでkintoneを使う", "url": "https://jp.kintone.help/k/ja/id/040668", "textRef": "6-8-4 モバイル版でできないこと"}, {"key": "B", "text": "レコードの集計条件の指定", "help": "モバイルでkintoneを使う", "url": "https://jp.kintone.help/k/ja/id/040668", "textRef": "6-8-4 モバイル版でできないこと"}, {"key": "C", "text": "スペースとスレッドの作成", "help": "モバイルでkintoneを使う", "url": "https://jp.kintone.help/k/ja/id/040668", "textRef": "6-8-4 モバイル版でできないこと"}, {"key": "D", "text": "お気に入りの追加や削除", "help": "モバイルでkintoneを使う", "url": "https://jp.kintone.help/k/ja/id/040668", "textRef": "6-8-3 モバイル版の画面"}], "exam": "2026年4月30日改定", "exp": {"summary": "モバイル版では、アプリの作成・設定、集計条件の指定、スペースとスレッドの作成ができない。お気に入りでできないのは並べ替えだけ。", "choices": {"A": "できない。アプリの作成および設定画面の操作は、モバイル版でできない操作に含まれる。", "B": "できない。レコードの集計条件の指定は、モバイル版でできない操作に含まれる。", "C": "できない。スペースとスレッドの作成は、モバイル版でできない操作に含まれる。", "D": "できる。モバイル版でできないのはお気に入りの「並べ替え」で、追加や削除はできない操作に挙げられていない。"}, "note": ""}}, {"id": "3-40", "set": 3, "no": 40, "category": "その他", "question": "ブックマークの説明として、適切なものをすべて : "ヒットしない。英数字は単語単位で検索され、単語の途中から始まる「01.docx」のような部分一致では検索されない。", "C": "ヒットする。「report_0401」は、アンダースコアを含めたひとまとまりの単語なので検索できる。", "D": "ヒットしない。「401」は単語「report_0401」の一部にすぎず、部分一致では検索されない。"}, "note": ""}}, {"id": "3-42", "set": 3, "no": 42, "category": "その他", "question": "通知の説明について、誤っているものを1つ選びなさい。", "answer": ["B"], "multi": false, "choices": [{"key": "A", "text": "アプリ、スペース、ピープル、メッセージの通知をメールでも受信できる。", "help": "通知を確認する", "url": "https://jp.kintone.help/k/ja/id/040672", "textRef": "6-4-3 メールで通知を確認する"}, {"key": "B", "text": "フォローしているスレッドに書き込みがあった場合や、コメントに「いいね！」が押された場合などに、「自分宛」の通知が届く。", "help": "通知を確認する", "url": "https://jp.kintone.help/k/ja/id/040672", "textRef": "6-4-2 「自分宛」の通知と通常の通知の違い"}, {"key": "C", "text": "デスクトップ通知を有効にすると、「自分宛」の通知を受信したときに、パソコンのデスクトップに通知タイトル、通知メッセージの表示ができる。", "help": "通知を確認する", "url": "https://jp.kintone.help/k/ja/id/040672", "textRef": "6-4-4 デスクトップ通知を設定する"}, {"key": "D", "text": "ユーザーを指定して、特定のユーザーの操作の通知だけに絞り込むことができる。", "help": "通知を確認する", "url": "https://jp.kintone.help/k/ja/id/040672", "textRef": "6-4-1 通知の確認"}], "exam": "2026年4月30日改定", "exp": {"summary": "「自分宛」は、宛先に指定されたコメント、作業者になったとき、メッセージなど。フォローしているスレッドへの書き込みや「いいね！」は「すべて」の通知。", "choices": {"A": "正しい。アプリ、スペース、メッセージ、ピープルの通知をメールで受信できる。", "B": "誤り。フォローしているスレッドへの書き込みや、コメントへの「いいね！」は「すべて」の通知として届く。「自分宛」ではない。", "C": "正しい。「自分宛」の通知が届いたときに、デスクトップ通知を表示できる。", "D": "正しい。通知の絞り込みの［送信者で絞り込む］で、特定のユーザーの操作の通知だけに絞り込める。"}, "note": ""}}, {"id": "3-43", "set": 3, "no": 43, "category": "その他", "question": "ピープル機能の説明として、誤っているものを1つ選びなさい。", "answer": ["B"], "multi": false, "choices": [{"key": "A", "text": "自分のピープルのカバー画像を変更できる。", "help": "ピープル", "url": "https://jp.kintone.help/k/ja/id/040679", "textRef": "6-5-1 ピープル機能"}, {"key": "B", "text": "自分のピープルに投稿した内容は、自分をフォローしているユーザーだけが閲覧できる。", "help": "ピープル", "url": "https://jp.kintone.help/k/ja/id/040679", "textRef": "6-5-1 ピープル機能"}, {"key": "C", "text": "ほかのユーザーと1対1でやり取りができるメッセージは、送信者と受信者以外には非公開である。", "help": "メッセージ", "url": "https://jp.kintone.help/k/ja/id/040651", "textRef": "6-5-1 ピープル機能"}, {"key": "D", "text": "ほかのユーザーのプロフィールと連絡先を確認できる。", "help": "ピープル", "url": "https://jp.kintone.help/k/ja/id/040679", "textRef": "6-5-1 ピープル機能"}], "exam": "2026年4月30日改定", "exp": {"summary": "ピープルへの投稿は、そのピープルにアクセスしたユーザーなら誰でも見られる。メッセージは1対1の非公開のやり取り。", "choices": {"A": "正しい。自分のピープルのカバー画像を変更できる。", "B": "誤り。自分のピープルにアクセスしたユーザーは、フォローしていなくても誰でも投稿を見られる。フォローは、投稿の通知を受け取るための機能。", "C": "正しい。メッセージは1対1の個人メッセージで、ほかのユーザーには見えないクローズドな連絡ができる。", "D": "正しい。ピープルでは、ユーザーのプロフィールと連絡先を確認できる。"}, "note": ""}}, {"id": "3-44", "set": 3, "no": 44, "category": "その他", "question": "Webhookを使ったシステム連携の説明として、不適切なものをすべて選びなさい。", "answer": ["A", "D"], "multi": true, "choices": [{"key": "A", "text": "アプリの「プロセス管理」が完了したときに、アプリの利用者に通知できる。", "help": "Webhookを設定する", "url": "https://jp.kintone.help/k/ja/id/040600", "textRef": "3-5-4 Webhook"}, {"key": "B", "text": "アプリのレコード編集が行われたときに、外部のWebサービスに通知できる。", "help": "Webhookを設定する", "url": "https://jp.kintone.help/k/ja/id/040600", "textRef": "3-5-4 Webhook"}, {"key": "C", "text": "Webhookの利用は、cybozu.com共通管理で禁止することができる。", "help": "Webhookの送信を制御する", "url": "https://jp.kintone.help/general/ja/id/020424", "textRef": "3-5-4 Webhook"}, {"key": "D", "text": "外部のWebサービスの情報を、アプリに登録できる。", "help": "Webhookを設定する", "url": "https://jp.kintone.help/k/ja/id/040600", "textRef": "3-5-4 Webhook"}], "exam": "2026年4月30日改定", "exp": {"summary": "Webhookは、アプリの操作（追加・編集・削除・コメント・ステータス更新）を外部サービスに送る一方向の機能。cybozu.com共通管理で送信を禁止できる。", "choices": {"A": "不適切。Webhookは指定した外部サービスに操作の内容を送信する機能で、アプリの利用者に通知する機能ではない。", "B": "適切。レコードの編集が行われた際に、外部サービスに通知が送信される。", "C": "適切。cybozu.com共通管理の［その他の設定］で［Webhookの送信を許可する］の選択を外すと、Webhookの送信を禁止できる。", "D": "不適切。Webhookはkintoneから外部サービスへ送信する仕組みで、外部の情報をアプリに登録するものではない。"}, "note": ""}}, {"id": "3-45", "set": 3, "no": 45, "category": "その他", "question": "ライトコースで、有料オプション申込無しで設定できるセキュリティ対策として、適切なものをすべて選びなさい。", "answer": ["A", "B", "D"], "multi": true, "choices": [{"key": "A", "text": "ログインパスワードの有効期間", "help": "料金", "url": "https://kintone.cybozu.co.jp/price/", "textRef": "5-2-1 セキ       const KEY = "kintone-dojo:v1";
      const CATS = ["アプリ", "スペース", "管理者設定", "その他"];
      const SETS = [...new Set(QUESTIONS.map((q) => q.set))].sort(
        (a, b) => a - b,
      );
      const clip = (s, n) => (s.length > n ? s.slice(0, n) + "…" : s);
      const byId = Object.fromEntries(QUESTIONS.map((q) => [q.id, q]));
      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      // ---- 保存（このブラウザーだけ） ----
      function load() {
        try {
          return JSON.parse(localStorage.getItem(KEY)) || {};
        } catch {
          return {};
        }
      }
      let store = load();
      store.hist ??= {}; // id -> [{t, ok, sel}]
      function save() {
        try {
          localStorage.setItem(KEY, JSON.stringify(store));
        } catch {}
        schedule();
      }

      // ---- アカウントへの保存（claude.ai で開いたとき） ----
      // 1人ずつ data/users/<id>/ に保存する。本人以外（公開した人も含む）は読めない。
      // 文書: hist-<セット>（{hist: {問題id: [...]}}）と session（{session}）
      const HIST_MAX = 50; // 1問あたり残す回答数（文書の上限 256 KiB に収める）
      let remote = null; // 自分の記録のコレクション
      let timer = null,
        flushing = false;
      const lastSent = {}; // 文書ごとに最後に書いた JSON。変わった文書だけ書く
      const setSync = (t) => ($("#sync").textContent = t);
      function bodies() {
        const b = { session: { session: store.session ?? null } };
        for (const s of SETS) b["hist-" + s] = { hist: {} };
        for (const [id, h] of Object.entries(store.hist)) {
          const k = "hist-" + id.split("-")[0];
          (b[k] ??= { hist: {} }).hist[id] = h;
        }
        return b;
      }
      function schedule(ms = 800) {
        if (!remote) return;
        clearTimeout(timer);
        timer = setTimeout(flush, ms);
      }
      async function flush() {
        if (!remote) return;
        if (flushing) return schedule();
        flushing = true;
        try {
          for (const [k, b] of Object.entries(bodies())) {
            const j = JSON.stringify(b);
            if (lastSent[k] === j) continue;
            await remote.doc(k).set(b);
            lastSent[k] = j;
          }
          setSync(
            "成績はあなたの claude.ai アカウントに保存されます（PC・スマホで共通、ほかの人には見えません）。",
          );
        } catch (e) {
          const code = e?.code;
          if (code === "unavailable") schedule(3000 + Math.random() * 2000);
          else {
            remote = null;
            setSync(
              code === "invalid_argument"
                ? "閲覧のみの権限で開いているため、成績はこのブラウザーにだけ保存されます。"
                : code === "quota_exceeded"
                  ? "保存先の容量がいっぱいのため、成績はこのブラウザーにだけ保存されます。"
                  : "アカウントに保存できないため、成績はこのブラウザーにだけ保存されます。",
            );
          }
        } finally {
          flushing = false;
        }
      }
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden" && remote) {
          clearTimeout(timer);
          flush();
        }
      });
      function mergeHist(a, b) {
        const out = {};
        for (const id of new Set([...Object.keys(a), ...Object.keys(b)])) {
          const seen = new Map();
          for (const x of [...(a[id] || []), ...(b[id] || [])])
            seen.set(x.t, x);
          out[id] = [...seen.values()]
            .sort((x, y) => x.t - y.t)
            .slice(-HIST_MAX);
        }
        return out;
      }
      async function connect() {
        if (!window.claude?.use) return; // ローカルのファイルとして開いたとき
        const [db, user] = await Promise.all([
          claude.use("db"),
          claude.use("user"),
        ]);
        const id = user && (await user.id());
        if (!db || !id) {
          setSync(
            "サインインしていないため、成績はこのブラウザーにだけ保存されます。",
          );
          return;
        }
        const col = db.collection("data/users/" + id);
        setSync("成績を読み込んでいます…");
        let to;
        try {
          const snap = await Promise.race([
            col.get(),
            new Promise((_, rej) => {
              to = setTimeout(() => rej({ code: "timeout" }), 10000);
            }),
          ]);
          clearTimeout(to);
          let rHist = {},
            rSession;
          snap.docs.forEach((d) => {
            const x = d.data() || {};
            lastSent[d.id] = JSON.stringify(x);
            if (d.id === "session") rSession = x.session;
            else Object.assign(rHist, x.hist || {});
          });
          // このブラウザーの記録とアカウントの記録を合わせる（初回はこのブラウザーの分を移す）
          store.hist = mergeHist(rHist, store.hist);
          if (S && !S.temp) store.session = S;
          else if (!snap.empty) store.session = rSession ?? undefined;
          if (!store.session) delete store.session;
          remote = col;
          save();
          await flush();
          // 出題中でなければ今の画面を描き直す
          if ($("#v-quiz").classList.contains("hidden")) {
            const v = ["setup", "result", "stats"].find(
              (x) => !$("#v-" + x).classList.contains("hidden"),
            );
            if (v !== "result") show(v);
          }
        } catch (e) {
          clearTimeout(to);
          setSync(
            "成績を読み込めなかったため、このブラウザーにだけ保存されます。",
          );
        }
      }
      const hist = (id) => store.hist[id] || [];
      const last = (id) => hist(id).at(-1);
      const rate = (id) => {
        const h = hist(id);
        return h.length ? h.filter((x) => x.ok).length / h.length : null;
      };

      // ---- 出題設定 ----
      $("#f-set").innerHTML = SETS.map(
        (s) =>
          `<label class="chip"><input type="checkbox" name="set" value="${s}" checked />セット${s}</label>`,
      ).join("");
      $("#f-cat").innerHTML = CATS.map(
        (c) =>
          `<label class="chip"><input type="checkbox" name="cat" value="${c}" checked />${c}（${QUESTIONS.filter((q) => q.category === c).length}）</label>`,
      ).join("");
      const val = (n) =>
        document.querySelector(`input[name=${n}]:checked`)?.value;
      const vals = (n) =>
        [...document.querySelectorAll(`input[name=${n}]:checked`)].map(
          (i) => i.value,
        );

      function filtered() {
        const sets = vals("set").map(Number),
          cats = vals("cat"),
          target = val("target"),
          kind = val("kind");
        return QUESTIONS.filter((q) => {
          if (!sets.includes(q.set) || !cats.includes(q.category)) return false;
          if (kind === "single" && q.multi) return false;
          if (kind === "multi" && !q.multi) return false;
          if (target === "unanswered") return !hist(q.id).length;
          if (target === "wrong") return last(q.id) && !last(q.id).ok;
          if (target === "weak") {
            const r = rate(q.id);
            return r !== null && r < 0.8;
          }
          return true;
        });
      }
      function updateMatch() {
        const n = filtered().length;
        $("#match").textContent = `該当 ${n} 問`;
        $("#start").disabled = n === 0;
      }
      document
        .querySelector("#v-setup")
        .addEventListener("change", updateMatch);

      // ---- セッション ----
      let S = null; // {ids, i, answers: {id: {sel, ok}}, cur: Set, temp?: true}
      // temp のセッション（成績画面からの1問練習）は保存中の「続きから」に触れない
      function persist() {
        if (S.temp) return save();
        store.session = S;
        save();
      }
      function shuffle(a) {
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }
      function start() {
        let ids = filtered().map((q) => q.id);
        if (val("order") === "rand") shuffle(ids);
        const lim = Number(val("limit"));
        if (lim) ids = ids.slice(0, lim);
        S = { ids, i: 0, answers: {}, cur: new Set() };
        store.session = S;
        save();
        show("quiz");
        renderQ();
      }
      function resumeSession() {
        S = store.session;
        // 問題データを作り直して消えた問題は飛ばす
        const kept = S.ids.filter((id) => byId[id]);
        if (!kept.length) {
          delete store.session;
          save();
          return show("setup");
        }
        S.i = Math.max(0, kept.indexOf(S.ids[S.i]));
        S.ids = kept;
        for (const id of Object.keys(S.answers || {}))
          if (!byId[id]) delete S.answers[id];
        S.answers ??= {};
        S.cur = new Set();
        show("quiz");
        renderQ();
      }
      $("#start").onclick = start;
      $("#resume").onclick = resumeSession;

      function judge(q, sel) {
        return [...sel].sort().join("") === q.answer.join("");
      }

      function renderQ() {
        const id = S.ids[S.i],
          q = byId[id],
          done = S.answers[id];
        const sel = done ? new Set(done.sel) : S.cur;
        const answered = Object.keys(S.answers).length;
        const correct = Object.values(S.answers).filter((a) => a.ok).length;
        $("#pos").textContent = `${S.i + 1} / ${S.ids.length} 問目`;
        $("#score").textContent = `正解 ${correct} / ${answered}`;
        $("#bar").style.width = `${(answered / S.ids.length) * 100}%`;
        const h = hist(id),
          r = rate(id);
        const past = h.length
          ? `過去 ${h.length} 回・正答率 ${Math.round(r * 100)}%`
          : "初めての問題";
        const ex = q.exp || {};
        let html = `<div class="qmeta"><span class="tag">セット${q.set} 問${q.no}</span><span class="tag">${esc(q.category)}</span><span>${past}</span></div>
    <p class="qtext">${esc(q.question)}</p>
    <div class="hint">${q.multi ? "当てはまるものをすべて選ぶ" : "1つ選ぶ"}</div>`;
        if (done)
          html += `<div class="verdict ${done.ok ? "ok" : "ng"}">${done.ok ? "○ 正解" : "× 不正解"}　<span class="muted">正答 ${q.answer.join("")}／あなた ${done.sel.join("") || "（なし）"}</span></div>`;
        html += q.choices
          .map((c, idx) => {
            const isAns = q.answer.includes(c.key),
              picked = sel.has(c.key);
            let cls = "choice";
            if (done)
              cls += " done" + (isAns ? " right" : picked ? " wrong" : "");
            else if (picked) cls += " sel";
            let body = `<span class="t">${esc(c.text)}`;
            if (done) {
              const e = ex.choices?.[c.key];
              body += `<div class="exp"><span class="mark ${isAns ? "ok" : "ng"}">${isAns ? "正答に含む" : "正答に含まない"}</span>${picked ? "（選んだ）" : isAns ? '<b class="mark ng">（選び漏れ）</b>' : ""}<br>${e ? esc(e) : '<span class="muted">解説はヘルプを参照</span>'}
        <div class="muted">${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">ヘルプ: ${esc(c.help)}</a>` : esc(c.help)}${c.textRef ? `　テキスト ${esc(c.textRef)}` : ""}</div></div>`;
            }
            body += `</span>`;
            return `<button class="${cls}" data-k="${c.key}" ${done ? "tabindex=-1" : ""}><span class="k">${c.key}</span>${body}</button>`;
          })
          .join("");
        if (done && ex.summary)
          html += `<div class="summary"><b>ポイント</b>　${esc(ex.summary)}</div>`;
        if (done && ex.note)
          html += `<div class="note">※ ${esc(ex.note)}</div>`;
        $("#qcard").innerHTML = html;
        $("#qcard")
          .querySelectorAll(".choice")
          .forEach((b) => (b.onclick = () => toggle(b.dataset.k)));
        $("#prev").disabled = S.i === 0;
        $("#act").textContent = done
          ? S.i === S.ids.length - 1
            ? "結果を見る"
            : "次へ →"
          : "回答する";
        $("#act").disabled = !done && sel.size === 0;
      }
      function toggle(k) {
        const id = S.ids[S.i],
          q = byId[id];
        if (S.answers[id]) return;
        if (q.multi) S.cur.has(k) ? S.cur.delete(k) : S.cur.add(k);
        else {
          S.cur.clear();
          S.cur.add(k);
        }
        renderQ();
      }
      function act() {
        const id = S.ids[S.i],
          q = byId[id];
        if (!S.answers[id]) {
          if (!S.cur.size) return;
          const sel = [...S.cur].sort(),
            ok = judge(q, sel);
          S.answers[id] = { sel, ok };
          const h = (store.hist[id] ??= []);
          h.push({
            t: Date.now(),
            ok,
            sel: sel.join(""),
          });
          if (h.length > HIST_MAX) h.splice(0, h.length - HIST_MAX);
          S.cur = new Set();
          persist();
          renderQ();
          window.scrollTo({ top: 0, behavior: "smooth" });
          return;
        }
        if (S.i < S.ids.length - 1) {
          S.i++;
          persist();
          renderQ();
          window.scrollTo({ top: 0 });
        } else finish();
      }
      $("#act").onclick = act;
      $("#prev").onclick = () => {
        if (S.i > 0) {
          S.i--;
          S.cur = new Set();
          renderQ();
        }
      };
      $("#quit").onclick = () => {
        persist();
        show(S.temp ? "stats" : "setup");
      };

      function finish() {
        const a = Object.entries(S.answers),
          ok = a.filter(([, x]) => x.ok).length;
        const wrongIds = a.filter(([, x]) => !x.ok).map(([id]) => id);
        if (S.temp) return show("stats");
        delete store.session;
        save();
        const byCat = {};
        a.forEach(([id, x]) => {
          const c = byId[id].category;
          byCat[c] ??= [0, 0];
          byCat[c][1]++;
          if (x.ok) byCat[c][0]++;
        });
        $("#rcard").innerHTML = `<h2>結果</h2>
    <div class="verdict ${ok / a.length >= 0.8 ? "ok" : "ng"}">${ok} / ${a.length} 問正解（${Math.round((ok / a.length) * 100)}%）</div>
    <table>${Object.entries(byCat)
      .map(
        ([c, [o, n]]) =>
          `<tr><td>${esc(c)}</td><td>${o}/${n}</td><td style="width:50%"><div class="meter"><div style="width:${(o / n) * 100}%"></div></div></td></tr>`,
      )
      .join("")}</table>
    ${wrongIds.length ? `<h2 style="margin-top:14px">間違えた問題</h2><ul>${wrongIds.map((id) => `<li>セット${byId[id].set} 問${byId[id].no}：${esc(clip(byId[id].question, 60))}</li>`).join("")}</ul>` : ""}
    <div class="row" style="margin-top:12px">
      ${wrongIds.length ? `<button class="btn primary" id="retry">間違えた ${wrongIds.length} 問を解き直す</button>` : ""}
      <button class="btn" id="back">出題設定へ</button>
    </div>`;
        show("result");
        $("#back").onclick = () => show("setup");
        if (wrongIds.length)
          $("#retry").onclick = () => {
            S = { ids: wrongIds, i: 0, answers: {}, cur: new Set() };
            store.session = S;
            save();
            show("quiz");
            renderQ();
          };
      }

      // ---- 成績 ----
      function agg(qs) {
        let n = 0,
          tried = 0,
          att = 0,
          okAtt = 0,
          lastOk = 0;
        qs.forEach((q) => {
          n++;
          const h = hist(q.id);
          if (h.length) {
            tried++;
            att += h.length;
            okAtt += h.filter((x) => x.ok).length;
            if (h.at(-1).ok) lastOk++;
          }
        });
        return { n, tried, att, okAtt, lastOk };
      }
      function pct(a, b) {
        return b ? Math.round((a / b) * 100) + "%" : "—";
      }
      function renderStats() {
        const all = agg(QUESTIONS);
        const days = {};
        Object.values(store.hist)
          .flat()
          .forEach((x) => {
            const d = new Date(x.t).toLocaleDateString("ja-JP");
            days[d] = (days[d] || 0) + 1;
          });
        const groupRows = (keyFn, label) => {
          const g = {};
          QUESTIONS.forEach((q) => (g[keyFn(q)] ??= []).push(q));
          return (
            `<div class="tbl"><table><tr><th>${label}</th><th>問題数</th><th>回答済</th><th>直近正解</th><th>延べ正答率</th><th class="col-meter"></th></tr>` +
            Object.entries(g)
              .sort((a, b) =>
                label === "カテゴリ"
                  ? 0
                  : a[0].localeCompare(b[0], "ja", { numeric: true }),
              )
              .map(([k, qs]) => {
                const a = agg(qs);
                return `<tr><td>${esc(k)}</td><td>${a.n}</td><td>${a.tried}</td><td>${a.lastOk}</td><td>${pct(a.okAtt, a.att)}</td><td class="col-meter" style="width:28%"><div class="meter"><div style="width:${a.n ? (a.lastOk / a.n) * 100 : 0}%"></div></div></td></tr>`;
              })
              .join("") +
            `</table></div>`
          );
        };
        const chapter = (q) => {
          const refs = q.choices.map((c) => c.textRef).filter(Boolean);
          const m = (refs[0] || "").match(/^(\d+-\d+)/);
          return m ? `第${m[1]}節` : "不明";
        };
        const weak = QUESTIONS.filter((q) => hist(q.id).length)
          .map((q) => ({ q, r: rate(q.id), n: hist(q.id).length }))
          .filter((x) => x.r < 1)
          .sort((a, b) => a.r - b.r || b.n - a.n)
          .slice(0, 10);
        const cell = (q) => {
          const h = hist(q.id);
          let c = "";
          if (h.length) {
            const r = rate(q.id);
            c = h.at(-1).ok ? (r === 1 ? "c-ok" : "c-mix") : "c-ng";
          }
          return `<button class="cell ${c}" data-id="${q.id}" title="セット${q.set} 問${q.no} ${q.category}${h.length ? ` 正答率${Math.round(rate(q.id) * 100)}%（${h.length}回）` : " 未回答"}">${q.no}</button>`;
        };
        $("#v-stats").innerHTML = `
    <div class="card"><h2>全体</h2><div class="stats-grid">
      <div class="kpi"><span class="muted">回答済み</span><b>${all.tried}<small class="muted"> / ${all.n}</small></b></div>
      <div class="kpi"><span class="muted">直近で正解</span><b>${all.lastOk}</b><span class="muted">${pct(all.lastOk, all.n)}（全問比）</span></div>
      <div class="kpi"><span class="muted">延べ正答率</span><b>${pct(all.okAtt, all.att)}</b><span class="muted">${all.att} 回答</span></div>
      <div class="kpi"><span class="muted">学習日数</span><b>${Object.keys(days).length}</b><span class="muted">今日 ${days[new Date().toLocaleDateString("ja-JP")] || 0} 問</span></div>
    </div></div>
    <div class="card"><h2>カテゴリ別</h2>${groupRows((q) => q.category, "カテゴリ")}</div>
    <div class="card"><h2>セット別</h2>${groupRows((q) => "セット" + q.set, "セット")}</div>
    <div class="card"><h2>テキストの節別</h2><p class="muted">選択肢の中で最初にあるテキスト参照先の節でまとめています。</p>${groupRows(chapter, "節")}</div>
    <div class="card"><h2>問題ごとの状況</h2>
      ${SETS.map(
        (s) =>
          `<div class="muted" style="margin:6px 0 4px">セット${s}</div><div class="heat">${QUESTIONS.filter(
            (q) => q.set === s,
          )
            .map(cell)
            .join("")}</div>`,
      ).join("")}
      <div class="legend"><span><i style="background:var(--ok)"></i>毎回正解</span><span><i style="background:var(--warn)"></i>直近正解・過去にミス</span><span><i style="background:var(--ng)"></i>直近不正解</span><span><i style="background:var(--chip)"></i>未回答</span></div>
      <p class="muted">マスを押すとその1問だけ解けます。</p>
    </div>
    <div class="card"><h2>苦手な問題（正答率が低い順）</h2>${weak.length ? `<table>${weak.map(({ q, r, n }) => `<tr><td><button class="btn" data-id="${q.id}">解く</button></td><td>セット${q.set} 問${q.no}<div class="muted">${esc(clip(q.question, 40))}</div></td><td>${Math.round(r * 100)}%<div class="muted">${n}回</div></td></tr>`).join("")}</table>` : '<p class="muted">まだありません。</p>'}</div>
    <div class="card"><h2>データ</h2><div class="row">
      <button class="btn" id="exp">成績を書き出す（JSON）</button>
      <label class="btn">成績を読み込む<input type="file" id="imp" accept="application/json" hidden /></label>
      <button class="btn" id="reset">成績をすべて消す</button>
    </div></div>`;
        $("#v-stats")
          .querySelectorAll("[data-id]")
          .forEach(
            (b) =>
              (b.onclick = () => {
                S = {
                  ids: [b.dataset.id],
                  i: 0,
                  answers: {},
                  cur: new Set(),
                  temp: true,
                };
                show("quiz");
                renderQ();
              }),
          );
        $("#exp").onclick = async () => {
          const filename = `kintone-dojo-${new Date().toISOString().slice(0, 10)}.json`;
          const data = JSON.stringify(store.hist);
          if (window.claude?.use) {
            // claude.ai では、ページから直接ダウンロードできないので downloads を通す
            const dl = await claude.use("downloads");
            if (!dl) return alert("この画面では書き出せません。");
            try {
              await dl.save({ filename, data });
            } catch (e) {
              if (e?.code === "rate_limited")
                alert("少し待ってからもう一度押してください。");
              else if (e?.code !== "declined")
                alert("この画面では書き出せません。");
            }
            return;
          }
          const a = document.createElement("a");
          a.href = URL.createObjectURL(
            new Blob([data], { type: "application/json" }),
          );
          a.download = filename;
          a.click();
        };
        $("#imp").onchange = async (e) => {
          const f = e.target.files[0];
          if (!f) return;
          try {
            const h = JSON.parse(await f.text());
            const okShape =
              h &&
              typeof h === "object" &&
              !Array.isArray(h) &&
              Object.values(h).every(
                (v) =>
                  Array.isArray(v) &&
                  v.every((x) => x && typeof x.t === "number" && "ok" in x),
              );
            if (!okShape) throw new Error("shape");
            store.hist = mergeHist({}, h);
            save();
            renderStats();
          } catch {
            alert(
              "読み込めませんでした（この道場で書き出した JSON を選んでください）",
            );
          }
          e.target.value = "";
        };
        $("#reset").onclick = () => {
          if (confirm("成績をすべて消します。元に戻せません。")) {
            store = { hist: {} };
            save();
            renderStats();
          }
        };
      }

      // ---- 画面切り替え ----
      function show(v) {
        ["setup", "quiz", "result", "stats"].forEach((x) =>
          $("#v-" + x).classList.toggle("hidden", x !== v),
        );
        document
          .querySelectorAll(".tab")
          .forEach((t) => t.setAttribute("aria-pressed", t.dataset.view === v));
        if (v === "setup") {
          updateMatch();
          $("#resume").classList.toggle("hidden", !store.session);
        }
        if (v === "stats") renderStats();
        window.scrollTo({ top: 0 });
      }
      document
        .querySelectorAll(".tab")
        .forEach((t) => (t.onclick = () => show(t.dataset.view)));
      document.addEventListener("keydown", (e) => {
        if ($("#v-quiz").classList.contains("hidden") || e.metaKey || e.ctrlKey)
          return;
        const m = {
          1: "A",
          2: "B",
          3: "C",
          4: "D",
          a: "A",
          b: "B",
          c: "C",
          d: "D",
        }[e.key.toLowerCase()];
        if (m) toggle(m);
        else if (e.key === "Enter") {
          // 「前へ」「やめる」にフォーカスがあるときはそのボタンを優先する
          const f = document.activeElement;
          if (f && f.matches("#prev, #quit")) return;
          e.preventDefault();
          act();
        } else if (e.key === "ArrowLeft") $("#prev").click();
      });
      show("setup");
      connect();
    </script>
  </body>
</html>
