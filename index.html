461", "textRef": "1-3-3 変更履歴の表示"}, {"key": "D", "text": "プロセス管理のステータスについて、変更履歴から前のバージョンに戻すことができる。", "help": "レコードの変更履歴を確認する／過去のバージョンに戻す", "url": "https://jp.kintone.help/k/ja/id/040461", "textRef": "3-3-2 プロセス管理の設定"}], "exam": "2026年4月30日改定", "exp": {"summary": "何も変更せず保存すると、変更履歴のバージョン番号に欠番が出ることがある。プロセス管理のステータスや作業者は過去のバージョンに戻せない。", "choices": {"A": "正しい。レコード編集時に何も変更せずに保存した場合、変更履歴のバージョン番号が連番にならず、欠番が発生することがある。", "B": "誤り。レコードの変更履歴の記録機能は無効にできる（無効化すると過去の履歴が削除される）。", "C": "誤り。［変更履歴］欄では、レコードがいつ誰によって作成されたかも確認できる。", "D": "誤り。プロセス管理のステータスや作業者は、過去のバージョンに戻せない。"}, "note": ""}}, {"id": "2-10", "set": 2, "no": 10, "category": "アプリ", "question": "「アプリの設定」→「フォーム」タブで、選択肢の中から2つ以上選ばせたいときに使用するフィールドとして、誤っているものをすべて選びなさい。", "answer": ["A", "D"], "multi": true, "choices": [{"key": "A", "text": "ラジオボタン", "help": "フォームを設定する", "url": "https://jp.kintone.help/k/ja/id/040554", "textRef": "2-2-5 選択肢"}, {"key": "B", "text": "ユーザー選択", "help": "フォームを設定する", "url": "https://jp.kintone.help/k/ja/id/040554", "textRef": "2-2-9 ユーザーや組織の選択"}, {"key": "C", "text": "チェックボックス", "help": "フォームを設定する", "url": "https://jp.kintone.help/k/ja/id/040554", "textRef": "2-2-5 選択肢"}, {"key": "D", "text": "ドロップダウン", "help": "フォームを設定する", "url": "https://jp.kintone.help/k/ja/id/040554", "textRef": "2-2-5 選択肢"}], "exam": "2026年4月30日改定", "exp": {"summary": "複数選択できるのはチェックボックス・複数選択・ユーザー選択など。ラジオボタンとドロップダウンは1つだけ選ぶフィールド。", "choices": {"A": "誤り（正解）。［ラジオボタン］は、1つだけ選択可能な選択肢項目を追加するフィールド。", "B": "正しい（不正解）。［ユーザー選択］フィールドでは複数のユーザーを選択できる。", "C": "正しい（不正解）。［チェックボックス］は、複数選択が可能な選択肢項目を追加するフィールド。", "D": "誤り（正解）。［ドロップダウン］は、1つだけ選択可能な選択肢項目を追加するフィールド。"}, "note": ""}}, {"id": "2-11", "set": 2, "no": 11, "category": "アプリ", "question": "アプリテンプレートを使って、別ドメインのkintoneにアプリを移行する際の説明として、誤っているものを1つ選びなさい。", "answer": ["B"], "multi": false, "choices": [{"key": "A", "text": "アプリの作成権限があれば、アプリ作成時に「テンプレートファイルを読み込んで作成」ボタンが表示される。", "help": "アプリをテンプレートとしてダウンロードする", "url": "https://jp.kintone.help/k/ja/id/040493", "textRef": "1-1-8 方法5：テンプレートファイルからアプリを作成する"}, {"key": "B", "text": "アプリ、レコード、およびフィールドのアクセス権は移行できる。", "help": "アプリをテンプレートとしてダウンロードする", "url": "https://jp.kintone.help/k/ja/id/040493", "textRef": "5-3-2 アプリの管理"}, {"key": "C", "text": "Administratorユーザーを宛先にした通知の設定は移行できる。", "help": "アプリをテンプレートとしてダウンロードする", "url": "https://jp.kintone.help/k/ja/id/040493", "textRef": "5-3-2 アプリの管理"}, {"key": "D", "text": "kintoneシステム管理者がアプリの管理権限を持つ場合、アプリをテンプレート化できる。", "help": "アプリをテンプレートとしてダウンロードする", "url": "https://jp.kintone.help/k/ja/id/040493", "textRef": "5-3-2 アプリの管理"}], "exam": "2026年4月30日改定", "exp": {"summary": "アプリテンプレートにはアクセス権の設定は含まれない。ログインユーザー・Administrator・Everyoneなどを使った設定は含まれる。", "choices": {"A": "正しい（公式の正答）。アプリの作成権限があればテンプレートファイルからアプリを作成できる（ボタン名の表示条件はヘルプで直接は確認できず）。", "B": "誤り（正解）。アクセス権の設定はアプリテンプレートに含まれないため、アプリ・レコード・フィールドのアクセス権は移行できない。", "C": "正しい。ユーザー情報を使った通知先などはテンプレートに含まれないが、Administratorユーザーはテンプレートに含まれる値として明記されている。", "D": "正しい。テンプレートとしてダウンロードするには、アプリの管理権限とkintoneのシステム管理権限の両方が必要。システム管理者がアプリ管理権限を持てば可能。"}, "note": ""}}, {"id": "2-12", "set": 2, "no": 12, "category": "アプリ", "question": "「アプリの設定」→「フォーム」タブで、「ユーザー選択」フィールドの説明として、誤っているものを1つ選びなさい。", "answer": ["C"], "multi": false, "choices": [{"key": "A", "text": "初期値に「ログインユーザー」を指定すると、新規でレコードを追加するときに、ログインしているユーザー（レコード作成者）が入力される。", "help": "ユーザー選択", "url": "https://jp.kintone.help/k/ja/id/040543", "textRef": "2-2-9 ユーザーや組織の選択"}, {"key": "B", "text": "「選択肢を指定する」を設定しない場合、「ユーザー選択」フィールドにユーザー名を入力して、一致するユーザーを選択できる。", "help": "ユーザー選択", "url": "https://jp.kintone.help/k/ja/id/040543", "textRef": "2-2-9 ユーザーや組織の選択"}, {"key": "C", "text": "選択できる最大人数を指定できる。", "help": "ユーザー選択", "url": "https://jp.kintone.help/k/ja/id/040543", "textRef": "2-2-9 ユーザーや組織の選択"}, {"key": "D", "text": "「選択肢を指定する」を有効にして、選択肢にユーザーを指定すると、レコードの追加や編集をする際に、指定したユーザーのみが選択肢に表示される。", "help": "ユーザー選択", "url": "https://jp.kintone.help/k/ja/id/040543", "textRef": "2-2-9 ユーザーや組織の選択"}], "exam": "2026年4月30日改定", "exp": {"summary": "ユーザー選択には初期値［ログインユーザー］と［選択肢を指定する］があるが、選択できる最大人数を指定する設定はない。", "choices": {"A": "正しい。初期値に［ログインユーザー］を指定すると、レコードの追加画面で、レコードを追加しているユーザーが自動で入力される。", "B": "正しい。［選択肢を指定する］を設定しない場合、ログイン名や表示名を検索してユーザーを選択できる。", "C": "誤り（正解）。設定項目はフィールド名・必須・選択肢の指定・初期値・フィールドコードで、選択できる最大人数を指定する項目はない。", "D": "正しい。［選択肢を指定する］で指定したユーザー（組織やグループを指定した場合はそこに含まれるユーザー）が選択肢として表示される。"}, "note": ""}}, {"id": "2-13", "set": 2, "no": 13, "category": "アプリ", "question": "石川さんと田中さんが同じレコードの編集画面を同時に表示し、レコードの編集をしている。\nkintoneの仕様として、誤っているものをすべて選びなさい。", "answer": ["B", "C", "D"], "multi": true, "choices": [{"key": "A", "text": "石川さんがレコードの「保存」をクリックしたあとに、田中さんがレコードの「保存」をクリックすると、田中さんの画面に再読み込みを促すエラーメッセージが表示される。", "help": "レコードを編集する", "url": "https://jp.kintone.help/k/ja/id/040719", "textRef": "1-2-3 レコードの編集"}, {"key": "B", "text": "石川さんがレコードの「保存」をクリックすると、田中さんの画面に再読み込みを促すエラーメッセージが表示される。", "help": "レコードを編集する", "url": "https://jp.kintone.help/k/ja/id/040719", "textRef": "1-2-3 レコードの編集"}, {"key": "C", "text": "石川さんがレコードの「保存」をクリックすると、石川さんの画面に再読み込みを促すエラーメッセージが表示される。", "help": "レコードを編集する", "url": "https://jp.kintone.help/k/ja/id/040719", "textRef": "1-2-3 レコードの編集"}, {"key": "D", "text": "石川さんがレコードの「保存」をクリックしたあとに、田中さんがレコードの「保存」をクリックすると、石川さんの編集内容は残らず田中さんの編集内容のみが表示される。", "help": "レコードを編集する", "url": "https://jp.kintone.help/k/ja/id/040719", "textRef": "1-2-3 レコードの編集"}], "exam": "2026年4月30日改定", "exp": {"summary": "同時編集では、後から保存した人の画面でエラーになり保存できない（先に保存した人の内容は残る）。先に保存した人の操作で、もう一方の画面にエラーが出るわけではない。", "choices": {"A": "正しい（不正解）。先に石川さんが保存したあと、田中さんが元の編集画面のまま保存しようとすると、エラーが表示され保存できない。", "B": "誤り（正解）。石川さんが保存した時点で田中さんの画面にエラーメッセージが出るわけではない。エラーになるのは田中さんが保存しようとしたとき。", "C": "誤り（正解）。先に保存した石川さんは通常どおり保存でき、石川さん自身の画面にエラーは出ない。", "D": "誤り（正解）。後から保存しようとした田中さんの保存はエラーになるため、田中さんの内容で上書きされることはない。"}, "note": "現行ヘルプでは、編集中に別の画面からレコードが更新されると、画面上部に「新しいバージョンがあること」と更新日時が表示される（エラーではなく案内）。選択肢Bの「再読み込みを促すエラーメッセージ」とは表現が異なるが、エラーとして保存できなくなるのは保存時なので、公式の正答どおりBは誤りと解釈した。"}}, {"id": "2-14", "set": 2, "no": 14, "category": "アプリ", "question": "アプリのレコードを「ファイルに書き出す」際の説明として、適切なものをすべて選びなさい。", "answer": ["A", "B", "D"], "multi": true, "choices": [{"key": "A", "text": "ファイルの書き出しを中止できるのは、書き出しを開始したユーザーだけである。", "help": "データの書き出しを中止する", "url": "https://jp.kintone.help/k/ja/id/040453", "textRef": "1-6-1 ファイルへのレコード書き出し"}, {"key": "B", "text": "アプリに対して、ファイル書き出し権限が必要である。", "help": "レコードのデータをファイルに書き出す際の注意事項", "url": "https://jp.kintone.help/k/ja/id/040455", "textRef": "1-6-1 ファイルへのレコード書き出し"}, {"key": "C", "text": "「関連レコード一覧」フィールドの内容を、テキスト形式でファイルの書き出しができる。", "help": "レコードのデータをファイルに書き出す際の注意事項", "url": "https://jp.kintone.help/k/ja/id/040455", "textRef": "1-6-1 ファイルへのレコード書き出し"}, {"key": "D", "text": "ファイルの書き出し中でも、レコードの追加や編集はできる。", "help": "ファイル書き出し／読み込みの途中に、レコードを追加／編集できますか？", "url": "https://jp.kintone.help/k/ja/id/040176", "textRef": "1-6-1 ファイルへのレコード書き出し"}], "exam": "2026年4月30日改定", "exp": {"summary": "書き出しにはファイル書き出し権限が必要。中止できるのは開始した本人だけ。書き出し中でもレコードの追加・編集はできる（読み込み中はできない）。", "choices": {"A": "正しい。書き出しを中止できるのは、書き出しを開始したユーザー本人のみ。", "B": "正しい。［アプリのアクセス権］で［ファイル書き出し］権限が必要。初期設定ではアプリの作成者だけに許可されている。", "C": "誤り。［関連レコード一覧］はファイルに書き出せないデータに含まれる（ほかにラベル、添付ファイル、変更履歴）。", "D": "正しい。ファイル書き出しの途中でもレコードの追加・編集はできる。書き出されるのは処理開始時点のデータ。"}, "note": ""}}, {"id": "2-15", "set": 2, "no": 15, "category": "アプリ", "question": "一覧の作成について、誤っているものをすべて選びなさい。", "answer": ["A", "B"], "multi": true, "choices": [{"key": "A", "text": "一覧を作成する際、表示形式は、表形式、カレンダー形式、グラフ形式の３種類から選択できる。", "help": "一覧とは", "url": "https://jp.kintone.help/k/ja/id/040614", "textRef": "1-4-2 一覧の作成"}, {"key": "B", "text": "カレンダー形式の一覧では、フィールドに入力されているデータを一覧画面から編集できる。", "help": "一覧の変更や削除を行う", "url": "https://jp.kintone.help/k/ja/id/040609", "textRef": "1-4-2 一覧の作成"}, {"key": "C", "text": "一覧を複数作成した場合は、表示順を並べ替えたり、デフォルトで表示される一覧を変更したりできる。", "help": "一覧のドロップダウンに表示される順番を並び替える", "url": "https://jp.kintone.help/k/ja/id/040610", "textRef": "1-4-2 一覧の作成"}, {"key": "D", "text": "一覧を作成、変更、削除するには、そのアプリの管理権限が必要である。", "help": "一覧の変更や削除を行う", "url": "https://jp.kintone.help/k/ja/id/040609", "textRef": "1-4-2 一覧の作成"}], "exam": "2026年4月30日改定", "exp": {"summary": "一覧の表示形式は表形式・カレンダー形式・カスタマイズの3種類（グラフは別機能）。一覧画面でのインライン編集は表形式のみ。", "choices": {"A": "誤り（正解）。一覧の表示形式は表形式、カレンダー形式、カスタマイズの3種類で、グラフ形式は含まれない。", "B": "誤り（正解）。［レコードの一覧］画面でデータを編集できるのは表形式の一覧。カレンダー形式でできるとは書かれていない。", "C": "正しい。一覧のドロップダウンの表示順は並び替えでき、一番上に置いた一覧がデフォルトで表示される（［（すべて）］の位置は変更不可）。", "D": "正しい。一覧の作成・変更・削除は［アプリの設定］画面から行い、そのアプリの管理権限が必要。"}, "note": ""}}, {"id": "2-16", "set": 2, "no": 16, "category": "アプリ", "question": "レコードをファイルから読み込む際の注意点として、適切なものをすべて選びなさい。", "answer": ["A", "C"], "multi": true, "choices": [{"key": "A", "text": "「計算」フィールドは、フィールドの設定に関わらず、ファイルからデータを読み込めない。", "help": "ファイルからレコードのデータをアプリに読み込む", "url": "https://jp.kintone.help/k/ja/id/040724", "textRef": "1-6-2 ファイルからのレコード読み込み"}, {"key": "B", "text": "「ルックアップ」フィールドは、フィールドの設定に関わらず、ファイルからデータを読み込めない。", "help": "ファイルからレコードのデータをアプリに読み込む", "url": "https://jp.kintone.help/k/ja/id/040724", "textRef": "1-6-2 ファイルからのレコード読み込み"}, {"key": "C", "text": "登録済みのレコードを更新する場合、「更新キー」と「対応するファイルの列」をそれぞれ設定する。", "help": "ファイルからレコードのデータをアプリに読み込む", "url": "https://jp.kintone.help/k/ja/id/040724", "textRef": "1-6-2 ファイルからのレコード読み込み"}, {"key": "D", "text": "拡張子が「.txt」のファイルから、レコードを読み込めない。", "help": "ファイルからレコードのデータをアプリに読み込む", "url": "https://jp.kintone.help/k/ja/id/040724", "textRef": "1-6-2 ファイルからのレコード読み込み"}], "exam": "2026年4月30日改定", "exp": {"summary": "計算式などで値が決まるフィールドは読み込み対象に出ない。更新するときは［更新キー］と［対応するファイルの列］を指定する。読み込めるのはxlsx/csv/txt/tsv。", "choices": {"A": "正しい。計算式が設定されているフィールドなど、値が計算されるフィールドは［アプリのフィールド］に表示されず、読み込み時に再計算される。", "B": "誤り。値が「取得」されるフィールドは読み込み対象に表示されないとあるが、［ルックアップ］フィールド自体が読み込めないとは書かれていない（ルックアップ自体の可否はこのページではヘルプで直接は確認できず）。", "C": "正しい。［レコードの更新と追加］を選んだ場合、［更新キー］とするフィールドと［対応するファイルの列］を設定する。", "D": "誤り。読み込み可能なファイル形式は、Excel形式（xlsx）、CSV形式（csv）、TXT形式（txt）、TSV形式（tsv）で、txtも読み込める。"}, "note": ""}}, {"id": "2-17", "set": 2, "no": 17, "category": "アプリ", "question": "数値や計算結果の端数処理をする方法として、正しい説明を1つ選びなさい。", "answer": ["A"], "multi": false, "choices": [{"key": "A", "text": "「計算」フィールドの設定画面で、計算式にROUND関数を設定すると、数値を四捨五入して指定の桁数まで求めることができる。", "help": "四捨五入、切り捨て、切り上げするときの設定の使い分け", "url": "https://jp.kintone.help/k/ja/id/040508", "textRef": "2-4-3 計算式"}, {"key": "B", "text": "小数点以下の数値を四捨五入した値をアプリに表示したい場合は、「計算」フィールドの設定画面で「小数点以下の表示桁数」を「0」に設定する。", "help": "四捨五入、切り捨て、切り上げするときの設定の使い分け", "url": "https://jp.kintone.help/k/ja/id/040508", "textRef": "2-2-4 数値と計算"}, {"key": "C", "text": "「数値」フィールドで「小数点以下の表示桁数」の設定を変更すると、レコードの数値自体が変更される。", "help": "四捨五入、切り捨て、切り上げするときの設定の使い分け", "url": "https://jp.kintone.help/k/ja/id/040508", "textRef": "2-2-4 数値と計算"}, {"key": "D", "text": "「高度な設定」の内容よりも、ROUND関数や「小数点以下の表示桁数」の設定が優先される。", "help": "四捨五入、切り捨て、切り上げするときの設定の使い分け", "url": "https://jp.kintone.help/k/ja/id/040508", "textRef": "3-7-4 高度な設定"}], "exam": "2026年4月30日改定", "exp": {"summary": "データ自体を丸めるのはROUND系関数、表示上だけ切り捨てるのは［小数点以下の表示桁数］、アプリ全体の丸めは［高度な設定］で、高度な設定が最優先。", "choices": {"A": "正しい。計算式にROUND関数を設定すると、データ自体を四捨五入して指定の桁数まで求められる。", "B": "誤り。［小数点以下の表示桁数］は四捨五入ではなく、表示上で指定桁数より後ろを切り捨てる設定。", "C": "誤り。［小数点以下の表示桁数］は表示上だけの変更で、レコードの数値自体は変わらない。", "D": "誤り。逆で、ROUND関数や［小数点以下の表示桁数］の設定よりも［高度な設定］の内容が優先される。"}, "note": ""}}, {"id": "2-18", "set": 2, "no": 18, "category": "アプリ", "question": "アプリのプロセス管理の説明として、誤っているものを1つ選びなさい。", "answer": ["B"], "multi": false, "choices": [{"key": "A", "text": "kintoneのポータルには、自分が作業者に指定されているレコードの件数が、アプリごとに表示される。", "help": "プロセス管理でできること", "url": "https://jp.kintone.help/k/ja/id/040576", "textRef": "3-3-1 プロセス管理とは"}, {"key": "B", "text": "現在のステータスに関わらず、アクションのボタンは常に表示される。", "help": "プロセス管理でできること", "url": "https://jp.kintone.help/k/ja/id/040576", "textRef": "3-3-1 プロセス管理とは"}, {"key": "C", "text": "アクションは、レコードを別のステータスに変更するための操作で、ステータスごとに設定する。", "help": "プロセス管理でできること", "url": "https://jp.kintone.help/k/ja/id/040576", "textRef": "3-3-2 プロセス管理の設定"}, {"key": "D", "text": "複数のユーザーで作業するタスクや、申請の承認をアプリで管理して、ワークフローのように使える。", "help": "プロセス管理でできること", "url": "https://jp.kintone.help/k/ja/id/040576", "textRef": "3-3-1 プロセス管理とは"}], "exam": "2026年4月30日改定", "exp": {"summary": "アクションのボタンは、自分が作業者に指定されているレコードにだけ表示される。", "choices": {"A": "正しい。kintoneのポータルには、自分が作業者に指定されているレコードの件数がアプリごとに表示される。", "B": "誤り（正解）。アクションのボタンは常に表示されるのではなく、自分が作業者に指定されているレコードに表示される。", "C": "正しい。アクションを実行すると次のステータスに移る。ステータスごとに作業者とアクションが設定される。", "D": "正しい。プロセス管理を設定すると、ステータス・作業者・アクションが追加され、申請・承認などのワークフローとして使える。"}, "note": ""}}, {"id": "2-19", "set": 2, "no": 19, "category": "アプリ", "question": "「アプリの設定」→「フォーム」タブで、「ルックアップ」フィールドの説明として、正しいものをすべて選びなさい。", "answer": ["B", "C", "D"], "multi": true, "choices": [{"key": "A", "text": "コピー元に設定したアプリの値が更新されると、自動的に「ルックアップ」フィールドの値が更新される。", "help": "ルックアップを設定する", "url": "https://jp.kintone.help/k/ja/id/040547", "textRef": "2-5-1 ルックアップとは"}, {"key": "B", "text": "コピー元のフィールドには、「リンク」に設定したフィールドを指定できる。", "help": "ルックアップ", "url": "https://jp.kintone.help/k/ja/id/040526", "textRef": "2-5-2 ルックアップを設定する"}, {"key": "C", "text": "関連付けるアプリを一度選択した後にフォームを保存すると、この設定を変更できない。", "help": "ルックアップ", "url": "https://jp.kintone.help/k/ja/id/040526", "textRef": "2-5-2 ルックアップを設定する"}, {"key": "D", "text": "コピー元のフィールドには、「テーブル」に設定したフィールドは指定できない。", "help": "ルックアップ", "url": "https://jp.kintone.help/k/ja/id/040526", "textRef": "2-5-2 ルックアップを設定する"}], "exam": "2026年4月30日改定", "exp": {"summary": "ルックアップの値は自動更新されない（再取得が必要）。コピー元にはリンクを指定できるが、テーブル内フィールドは指定できない。関連付けるアプリは保存後に変更不可。", "choices": {"A": "誤り。参照先のレコードが変わっても取得済みの値はそのまま維持され、自動的には最新にならない。再度［取得］すると上書きされる。", "B": "正しい。コピー元のフィールドには、文字列（1行）・数値・計算・リンク・ルックアップ・レコード番号を指定できる。", "C": "正しい。［関連付けるアプリ］は、一度選択したあとにフォームを保存すると変更できない。", "D": "正しい。コピー元のフィールドには、参照先アプリの［テーブル］内のフィールドを指定できない。"}, "note": ""}}, {"id": "2-20", "set": 2, "no": 20, "category": "アプリ", "question": "アプリの管理権限を持たない利用者が可能なグラフの操作として、誤っているものを1つ選びなさい。", "answer": ["D"], "multi": false, "choices": [{"key": "A", "text": "集計の作成", "help": "グラフとは", "url": "https://jp.kintone.help/k/ja/id/040587", "textRef": "1-5-2 一覧からのグラフの作成"}, {"key": "B", "text": "グラフの表示", "help": "グラフとは", "url": "https://jp.kintone.help/k/ja/id/040587", "textRef": "1-5-2 一覧からのグラフの作成"}, {"key": "C", "text": "集計をブックマークとして保存", "help": "グラフとは", "url": "https://jp.kintone.help/k/ja/id/040587", "textRef": "1-5-2 一覧からのグラフの作成"}, {"key": "D", "text": "集計をグラフとして保存", "help": "グラフとは", "url": "https://jp.kintone.help/k/ja/id/040587", "textRef": "1-5-2 一覧からのグラフの作成"}], "exam": "2026年4月30日改定", "exp": {"summary": "管理権限がなくても集計の表示・作成・ブックマーク保存はできるが、グラフとしてアプリに保存するにはアプリの管理権限が必要。", "choices": {"A": "正しい（不正解）。一覧画面などで集計することは管理権限がなくてもできる（ヘルプで直接は確認できず）。", "B": "正しい（不正解）。作成済みのグラフは［レコードの一覧］画面の「グラフ」から選んで表示できる。", "C": "正しい（不正解）。ブックマーク機能を使って、集計条件をブックマークとして保存できる。", "D": "誤り（正解）。集計をグラフとして保存するにはアプリの管理権限が必要（このページではヘルプで直接は確認できず）。"}, "note": ""}}, {"id": "2-21", "set": 2, "no": 21, "category": "アプリ", "question": "文字を入力するためのフィールドの説明として、適切でないものをすべて選びなさい。", "answer": ["C", "D"], "multi": true, "choices": [{"key": "A", "text": "「文字列（複数行）」で改行して入力した文字列は、ファイルへ書き出したときにも改行された状態で出力される。", "help": "文字列（複数行）", "url": "https://jp.kintone.help/k/ja/id/040538", "textRef": "2-2-3 文字"}, {"key": "B", "text": "「リッチエディター」を配置すると、文字色・背景色・文字サイズの変更が可能な入力欄を作成できる。", "help": "リッチエディター", "url": "https://jp.kintone.help/k/ja/id/040537", "textRef": "2-2-3 文字"}, {"key": "C", "text": "「文字列（複数行）」は、最小文字数と最大文字数のどちらか一方、または両方を指定できる。", "help": "文字列（複数行）", "url": "https://jp.kintone.help/k/ja/id/040538", "textRef": "2-2-3 文字"}, {"key": "D", "text": "「文字列（1行）」は、自動計算機能を使用できない。", "help": "文字列（1行）", "url": "https://jp.kintone.help/k/ja/id/040539", "textRef": "2-2-3 文字"}], "exam": "2026年4月30日改定", "exp": {"summary": "文字数の制限を設定できるのは文字列（1行）。文字列（1行）は［自動計算する］で計算式を設定できる。", "choices": {"A": "適切。改行して入力した文字列は、ファイルへ書き出したときにも改行された状態で出力される。", "B": "適切。［リッチエディター］では、文字色、背景色、文字サイズの変更や、下線・箇条書きなどができる。", "C": "適切でない（正解）。［文字列（複数行）］の設定項目はフィールド名・必須・初期値・フィールドコードで、文字数の指定はない。最小/最大文字数を指定できるのは［文字列（1行）］。", "D": "適切でない（正解）。［文字列（1行）］は［自動計算する］にチェックを入れると計算式を設定でき、計算結果を文字列で表示できる。"}, "note": ""}}, {"id": "2-22", "set": 2, "no": 22, "category": "アプリ", "question": "テーブルの説明として、正しいものをすべて選びなさい。", "answer": ["A", "B", "C"], "multi": true, "choices": [{"key": "A", "text": "一度テーブル化して保存したフィールドは、テーブル外や別のテーブルには移動できない。", "help": "テーブル", "url": "https://jp.kintone.help/k/ja/id/040529", "textRef": "2-3-2 テーブルを設定する"}, {"key": "B", "text": "テーブルを設定すると、データ入力中に必要に応じて入力行を追加できる。", "help": "テーブル", "url": "https://jp.kintone.help/k/ja/id/040529", "textRef": "2-3-1 テーブルとは"}, {"key": "C", "text": "テーブルは、すでにあるテーブルやグループフィールド内には配置できない。", "help": "テーブル", "url": "https://jp.kintone.help/k/ja/id/040529", "textRef": "2-3-2 テーブルを設定する"}, {"key": "D", "text": "一度テーブル化して保存すると、テーブル内のフィールドの並び順を変更できない。", "help": "テーブル", "url": "https://jp.kintone.help/k/ja/id/040529", "textRef": "2-3-2 テーブルを設定する"}], "exam": "2026年4月30日改定", "exp": {"summary": "テーブル化したフィールドはテーブル外や別テーブルへ移動できず、テーブルはテーブルやグループの中に置けない。行は入力中に追加できる。", "choices": {"A": "正しい。テーブル化して保存したフィールドは、［テーブル］外や他の［テーブル］には移動できない。", "B": "正しい。［テーブル］を配置すると、入力内容の増減に応じて行の追加や削除ができる。", "C": "正しい。［テーブル］は、すでにある［テーブル］や［グループ］フィールド内には配置できない。", "D": "誤り。テーブル内のフィールドの並び順を変更できないという制限は書かれていない（並び順変更の可否はヘルプで直接は確認できず）。"}, "note": ""}}, {"id": "2-23", "set": 2, "no": 23, "category": "アプリ", "question": "IF関数を使って、実技が80点以上で、かつ小論文が70点以上であれば”合格”、そうでなければ”不合格”と表示される計算式について、正しいものを1つ選びなさい。", "answer": ["A"], "multi": false, "choices": [{"key": "A", "text": "IF(AND(実技>=80,小論文>=70),\"合格\",\"不合格\")", "help": "[IF関数]条件によって表示する値を変える", "url": "https://jp.kintone.help/k/ja/id/040505", "textRef": "2-4-3 計算式"}, {"key": "B", "text": "IF((実技>=80) AND (小論文>=70),\"合格\",\"不合格\")", "help": "[IF関数]条件によって表示する値を変える", "url": "https://jp.kintone.help/k/ja/id/040505", "textRef": "2-4-3 計算式"}, {"key": "C", "text": "AND(IF(実技>=80,小論文>=70),\"合格\",\"不合格\")", "help": "[IF関数]条件によって表示する値を変える", "url": "https://jp.kintone.help/k/ja/id/040505", "textRef": "2-4-3 計算式"}, {"key": "D", "text": "AND((IF(実技>=80,\"合格\",\"不合格\"),(IF(小論文>=70,\"合格\",\"不合格\"))", "help": "[IF関数]条件によって表示する値を変える", "url": "https://jp.kintone.help/k/ja/id/040505", "textRef": "2-4-3 計算式"}], "exam": "2026年4月30日改定", "exp": {"summary": "複数条件は AND(条件1,条件2) の形で IF の条件式に入れる。IF の構文は IF(条件式, 真の値, 偽の値)。", "choices": {"A": "正しい。AND関数で2つの条件を組み合わせ、IF関数の条件式に指定する正しい書き方。", "B": "誤り。kintoneの計算式では、ANDは演算子ではなく関数として AND(条件1, 条件2) の形で書く。", "C": "誤り。IF関数の引数は「条件式, 真の場合の値, 偽の場合の値」であり、IFを AND の中に入れても構文が成り立たない。", "D": "誤り。IF関数の結果（文字列）をANDで組み合わせても合否の判定にならず、構文としても成り立たない。"}, "note": ""}}, {"id": "2-24", "set": 2, "no": 24, "category": "アプリ", "question": "「アプリの設定」→「設定」タブ→「アイコンと説明」、または「デザインテーマ」の説明として、適切なものをすべて選びなさい。", "answer": ["B", "D"], "multi": true, "choices": [{"key": "A", "text": "モバイル版の画面でも「デザインテーマ」の設定で、フォームやレコード一覧の配色を変更できる。", "help": "アプリのデザインテーマを変更する", "url": "https://jp.kintone.help/k/ja/id/040476", "textRef": "3-2-2 アプリのデザインテーマの変更"}, {"key": "B", "text": "「アプリのアイコン」は、あらかじめkintoneに用意されているアイコンから選択する方法と、任意の画像をアップロードする方法がある。", "help": "アイコンの変更とアプリの説明を記載する", "url": "https://jp.kintone.help/k/ja/id/040475", "textRef": "3-2-1 アイコンと説明"}, {"key": "C", "text": "「アプリの説明」に入力できる文字数の上限は、5,000文字である。", "help": "アイコンの変更とアプリの説明を記載する", "url": "https://jp.kintone.help/k/ja/id/040475", "textRef": "3-2-1 アイコンと説明"}, {"key": "D", "text": "「アプリの説明」は、書式設定を使って文字を装飾できる。", "help": "アイコンの変更とアプリの説明を記載する", "url": "https://jp.kintone.help/k/ja/id/040475", "textRef": "3-2-1 アイコンと説明"}], "exam": "2026年4月30日改定", "exp": {"summary": "アイコンは用意されたものから選ぶか画像をアップロード。アプリの説明は10,000文字まで、書式で装飾できる。デザインテーマはモバイル版には適用されない。", "choices": {"A": "不適切。モバイル版の画面には、デザインテーマは適用されない。", "B": "適切。［次のアイコンから選択する］（用意されたアイコン）と、［画像をアップロードする (png/jpg/gif/bmp)］の2つの方法がある。", "C": "不適切。［アプリの説明］に入力できる文字数の上限は、5,000文字ではなく10,000文字。", "D": "適切。アプリの説明では、Webページへのリンクを貼ったり、書式設定を使って文字を装飾したりできる。"}, "note": ""}}, {"id": "2-25", "set": 2, "no": 25, "category": "アプリ", "question": "アクセス権を設定できるフィールドとして、正しいものをすべて選びなさい。", "answer": ["A", "C", "D"], "multi": true, "choices": [{"key": "A", "text": "グループ", "help": "フィールドにアクセス権を設定する", "url": "https://jp.kintone.help/k/ja/id/040593", "textRef": "3-6-4 フィールドのアクセス権"}, {"key": "B", "text": "テーブル", "help": "フィールドにアクセス権を設定する", "url": "https://jp.kintone.help/k/ja/id/040593", "textRef": "3-6-4 フィールドのアクセス権"}, {"key": "C", "text": "関連レコード一覧", "help": "フィールドにアクセス権を設定する", "url": "https://jp.kintone.help/k/ja/id/040593", "textRef": "3-6-4 フィールドのアクセス権"}, {"key": "D", "text": "ルックアップ", "help": "フィールドにアクセス権を設定する", "url": "https://jp.kintone.help/k/ja/id/040593", "textRef": "3-6-4 フィールドのアクセス権"}], "exam": "2026年4月30日改定", "exp": {"summary": "フィールドのアクセス権を設定できないのは、ラベル・スペース・罫線・レコード番号・テーブル内のフィールド。グループに設定すると中のフィールドをまとめて制御できる。", "choices": {"A": "正しい。［グループ］フィールドにアクセス権を設定すると、中の複数のフィールドにまとめてアクセス権を設定できる。", "B": "誤り（正解）。［テーブル］内のフィールドはアクセス権を設定できないフィールドに含まれる。", "C": "正しい。［関連レコード一覧］はアクセス権を設定できないフィールドの一覧に含まれていない。", "D": "正しい。［ルックアップ］はアクセス権を設定できないフィールドの一覧に含まれていない。"}, "note": ""}}, {"id": "2-26", "set": 2, "no": 26, "category": "スペース", "question": "スペースの説明として、正しいものを1つ選びなさい。", "answer": ["C"], "multi": false, "choices": [{"key": "A", "text": "スペースのメンバーに組織／グループを追加した場合、ユーザーごとの退会ができる。", "help": "スペースのメンバーを追加／削除する", "url": "https://jp.kintone.help/k/ja/id/040703", "textRef": "4-1-4 スペースへの参加と退会"}, {"key": "B", "text": "ゲストユーザーの一覧は、CSV形式でダウンロードできない。", "help": "ゲストユーザーの一覧をCSV形式でダウンロードする", "url": "https://jp.kintone.help/k/ja/id/040822", "textRef": "5-3-4 ゲストユーザーの管理"}, {"key": "C", "text": "cybozu.com共通管理者は、14日以内であれば削除してしまったスペースを復旧できる。", "help": "削除したスペースを復旧する", "url": "https://jp.kintone.help/k/ja/id/04080", "textRef": "5-3-7 その他の管理"}, {"key": "D", "text": "スペースの一覧で、各アプリがどのスペースに所属しているかを確認できる。", "help": "スペースの一覧を確認する", "url": "https://jp.kintone.help/k/ja/id/04073#space_admin_manage_spaces_30", "textRef": "5-3-3 スペースの管理"}], "exam": "2026年4月30日改定", "exp": {"summary": "削除したスペースは、削除から14日以内ならcybozu.com共通管理者が復旧できる。", "choices": {"A": "誤り。メンバーに組織やグループを追加した場合は、ユーザーごとの退会ができない。退会を許可するならユーザーを選んで追加する。", "B": "誤り。cybozu.com共通管理者は、［ゲストユーザー管理］画面からゲストユーザーの一覧をCSV形式でダウンロードできる。", "C": "正しい。スペースを復旧できるのはcybozu.com共通管理者のみで、削除から14日以上経過したスペースは復旧できない。", "D": "誤り。［スペースの一覧］で確認できるのは、ID・スペース名・種別・メンバー数/管理者数・作成者・設定の最終更新者などで、各アプリの所属スペースを確認する項目はない。"}, "note": ""}}, {"id": "2-27", "set": 2, "no": 27, "category": "スペース", "question": "「関連リンク」欄の説明として、正しいものを1つ選びなさい。", "answer": ["C"], "multi": false, "choices": [{"key": "A", "text": "ゲストスペースでも関連リンクを利用できる。", "help": "関連リンクとは", "url": "https://jp.kintone.help/k/ja/id/040708", "textRef": "4-3-2 ゲストスペースの追加"}, {"key": "B", "text": "スペースの「関連リンク」の並び順を変更できる。", "help": "関連リンクとは", "url": "https://jp.kintone.help/k/ja/id/040708", "textRef": "4-2-5 関連リンク"}, {"key": "C", "text": "「関連リンク」欄に関連リンクを追加すると、スペースの利用者が、リンク先のアプリやスペースに素早くアクセスできる。", "help": "関連リンクとは", "url": "https://jp.kintone.help/k/ja/id/040708", "textRef": "4-2-5 関連リンク"}, {"key": "D", "text": "関連リンクを表示するには、ポータル画面右下の「関連リンク」欄にある追加ボタンをクリックする。", "help": "関連リンクとは", "url": "https://jp.kintone.help/k/ja/id/040708", "textRef": "4-2-5 関連リンク"}], "exam": "2026年4月30日改定", "exp": {"summary": "関連リンクは、スペースからアプリや別スペースに素早く移動するためのもの。ゲストスペースでは使えず、並び順も変えられない。", "choices": {"A": "誤り。ゲストスペースでは、関連リンクは利用できない。", "B": "誤り。スペースの［関連リンク］の並び順は変更できない（アプリは作成日時の降順、スペースは更新日時の降順で並ぶ）。", "C": "正しい。関連リンクを追加すると、スペースの利用者がリンク先のアプリやスペースに素早くアクセスできる。", "D": "誤り。画面右下の［関連リンク］エリアにあるのは関連リンクを「追加」するアイコンで、場所もkintoneのポータルではなくスペースのポータル。"}, "note": ""}}, {"id": "2-28", "set": 2, "no": 28, "category": "スペース", "question": "スペースのポータルに表示される「お知らせ掲示板」の説明として、正しいものをすべて選びなさい。", "answer": ["B", "C"], "multi": true, "choices": [{"key": "A", "text": "「お知らせ掲示板」は、ユーザーごとにカスタマイズできる。", "help": "スペースのポータルの表示コンテンツ／カスタマイズ", "url": "https://jp.kintone.help/k/ja/id/040697", "textRef": "4-2-1 お知らせ"}, {"key": "B", "text": "スペースの管理者は、「お知らせ掲示板」の内容を編集できる。", "help": "スペースのポータルの表示コンテンツ／カスタマイズ", "url": "https://jp.kintone.help/k/ja/id/040697", "textRef": "4-2-1 お知らせ"}, {"key": "C", "text": "「お知らせ掲示板」を表示するには、スペースの設定で、「スペースのポータルと複数のスレッドを使用する」機能を有効にする必要がある。", "help": "スペースのポータルの表示コンテンツ／カスタマイズ", "url": "https://jp.kintone.help/k/ja/id/040697", "textRef": "4-2-1 お知らせ"}, {"key": "D", "text": "「お知らせ掲示板」は、モバイル版のポータルに適用されない。", "help": "スペースのポータルの表示コンテンツ／カスタマイズ", "url": "https://jp.kintone.help/k/ja/id/040697", "textRef": "6-8-3 モバイル版の画面"}], "exam": "2026年4月30日改定", "exp": {"summary": "スペースのお知らせ（スペース本文）は、［スペースのポータルと複数のスレッドを使用する］が有効なスペースのポータルに表示され、スペース管理者だけが編集できる。", "choices": {"A": "誤り。お知らせはスペース管理者が編集する共有の掲示エリアで、ユーザーごとにカスタマイズできるとは書かれていない（ヘルプで直接は確認できず）。", "B": "正しい。お知らせの内容は、［スペース本文を編集］アイコンからスペース管理者のみが編集できる。", "C": "正しい。スペースのポータルは、スペースの設定で［スペースのポータルと複数のスレッドを使用する］にチェックを付けた場合に表示される。", "D": "誤り。モバイル版のスペースでも［お知らせ］（スペース本文）のタブが表示され、閲覧できる。"}, "note": ""}}, {"id": "2-29", "set": 2, "no": 29, "category": "スペース", "question": "参加しているスペースで、スペース参加者とスペース管理者の両者ともにできる操作として、正しいものを1つ選びなさい。", "answer": ["C"], "multi": false, "choices": [{"key": "A", "text": "参加メンバーの変更", "help": "ユーザーがスペースでできる操作", "url": "https://jp.kintone.help/k/ja/id/040705", "textRef": "4-2-6 ユーザーがスペースでできる操作"}, {"key": "B", "text": "スペース本文の編集", "help": "ユーザーがスペースでできる操作", "url": "https://jp.kintone.help/k/ja/id/040705", "textRef": "4-2-6 ユーザーがスペースでできる操作"}, {"key": "C", "text": "スペース内検索", "help": "ユーザーがスペースでできる操作", "url": "https://jp.kintone.help/k/ja/id/040705", "textRef": "4-2-6 ユーザーがスペースでできる操作"}, {"key": "D", "text": "スペースの削除", "help": "ユーザーがスペースでできる操作", "url": "https://jp.kintone.help/k/ja/id/040705", "textRef": "4-2-6 ユーザーがスペースでできる操作"}], "exam": "2026年4月30日改定", "exp": {"summary": "スペース内検索・お気に入り・スレッドの追加・コメント投稿などは参加者も管理者もできる。参加メンバー変更・本文編集・削除は管理者だけ。", "choices": {"A": "誤り。参加メンバーの変更ができるのはスペース管理者のみ。", "B": "誤り。スペース本文の編集ができるのはスペース管理者のみ。", "C": "正しい。スペース内検索は、スペース管理者・スペース参加者・参加していないユーザーのいずれもできる（非公開スペースを除く）。", "D": "誤り。スペースの削除ができるのはスペース管理者のみ。"}, "note": ""}}, {"id": "2-30", "set": 2, "no": 30, "category": "スペース", "question": "ゲストスペースへ招待する際の説明として、誤っているものをすべて選びなさい。", "answer": ["A", "B"], "multi": true, "choices": [{"key": "A", "text": "kintoneのポータルで、右上の「…」から、「ゲストメンバーを管理」をクリックし、ゲストスペースに招待できる。", "help": "ゲストユーザーの管理（ゲストの招待）", "url": "https://jp.kintone.help/k/ja/id/040649", "textRef": "4-3-3 ゲストの招待"}, {"key": "B", "text": "招待メールの送信元は、送信者自身のメールアドレスである。", "help": "ゲストユーザーの管理（ゲストの招待）", "url": "https://jp.kintone.help/k/ja/id/040649", "textRef": "4-3-3 ゲストの招待"}, {"key": "C", "text": "招待メールの有効期間は、1週間である。", "help": "ゲストユーザーの管理（ゲストの招待）", "url": "https://jp.kintone.help/k/ja/id/040649", "textRef": "4-3-3 ゲストの招待"}, {"key": "D", "text": "招待したゲストがkintoneに登録したかどうかなど、登録状況を確認できる。", "help": "ゲストユーザーの管理（ゲストの招待）", "url": "https://jp.kintone.help/k/ja/id/040649", "textRef": "4-3-3 ゲストの招待"}], "exam": "2026年4月30日改定", "exp": {"summary": "ゲストの招待は、ゲストスペースの［オプション］→［ゲストメンバーを管理］から。招待メールの差出人はno-reply@cybozu.com、有効期間は1週間。", "choices": {"A": "誤り（正解）。招待は、kintoneのポータルではなく、ゲストスペースの画面右上の［オプション］アイコンから［ゲストメンバーを管理］を開いて行う。", "B": "誤り（正解）。招待メールの差出人は送信者自身ではなく「no-reply@cybozu.com」。", "C": "正しい。招待メールの有効期間は1週間。", "D": "正しい。［スペースの管理］ダイアログの［ゲスト］タブで、招待中・使用中・停止中といった登録状況を確認できる。"}, "note": ""}}, {"id": "2-31", "set": 2, "no": 31, "category": "管理者設定", "question": "「組織の管理者」が管理権限を持つ組織の配下でできる操作として、誤っているものを1つ選びなさい。", "answer": ["D"], "multi": false, "choices": [{"key": "A", "text": "子組織の追加", "help": "実行できる操作", "url": "https://jp.kintone.help/general/ja/id/02010#uma__index_20", "textRef": "5-1-3 組織の設定"}, {"key": "B", "text": "組織の所属ユーザーの変更", "help": "実行できる操作", "url": "https://jp.kintone.help/general/ja/id/02010#uma__index_20", "textRef": "5-1-3 組織の設定"}, {"key": "C", "text": "組織の削除", "help": "実行できる操作", "url": "https://jp.kintone.help/general/ja/id/02010#uma__index_20", "textRef": "5-1-3 組織の設定"}, {"key": "D", "text": "組織の事前設定", "help": "実行できる操作", "url": "https://jp.kintone.help/general/ja/id/02010#uma__index_20", "textRef": "5-1-3 組織の設定"}], "exam": "2026年4月30日改定", "exp": {"summary": "組織の管理者ができるのは、組織情報の変更・子組織の追加・メンバーの追加/削除・組織の管理者の設定・組織の削除。", "choices": {"A": "正しい（不正解）。子組織の追加は、組織の管理者が実行できる操作に含まれる。", "B": "正しい（不正解）。メンバーの追加・削除ができ、管理する組織のメンバーのユーザー情報も変更できる。", "C": "正しい（不正解）。組織の削除は、組織の管理者が実行できる操作に含まれる。", "D": "誤り（正解）。「組織の事前設定」は、組織の管理者が実行できる操作の一覧に含まれていない。"}, "note": ""}}, {"id": "2-32", "set": 2, "no": 32, "category": "管理者設定", "question": "管理者の種類として、誤っているものをすべて選びなさい。", "answer": ["A", "C"], "multi": true, "choices": [{"key": "A", "text": "監査ログの閲覧や、パスワードポリシーを設定する「サイボウズドットコム ストアの管理者」", "help": "管理者の種類", "url": "https://jp.kintone.help/general/ja/id/0207", "textRef": "5-4-1 サイボウズドットコムストア"}, {"key": "B", "text": "ユーザーの追加や、クライアント証明書の発行など、cybozu.comを使用するための設定を行う「cybozu.com共通管理者」", "help": "管理者の種類", "url": "https://jp.kintone.help/general/ja/id/0207", "textRef": "5-1-1 cybozu.com共通管理"}, {"key": "C", "text": "ユーザーごとのkintoneアクセス状況の確認など、kintoneの管理や保守に関する設定を行う「kintoneシステム管理者」", "help": "管理者の種類", "url": "https://jp.kintone.help/general/ja/id/0207", "textRef": "5-3-1 kintoneシステム管理"}, {"key": "D", "text": "特定の組織におけるユーザーとその組織を管理する権限を付与された「組織の管理者」", "help": "組織の管理者", "url": "https://jp.kintone.help/general/ja/id/02010", "textRef": "5-1-3 組織の設定"}], "exam": "2026年4月30日改定", "exp": {"summary": "ストア管理者は購入・契約担当。ユーザー管理やパスワードポリシーなど共通の設定はcybozu.com共通管理者。", "choices": {"A": "誤り（正解）。サイボウズドットコム ストア管理者は、cybozu.comの購入や契約内容の変更を担当する。パスワードポリシーなどの設定はcybozu.com共通管理者が行う。", "B": "正しい。cybozu.com共通管理者は、ユーザーアカウントの管理やパスワードポリシーなど、cybozu.comで利用する共通の設定を行う（クライアント証明書の記載はこのページではヘルプで直接は確認できず）。", "C": "誤り（正解・公式の正答）。このページはkintoneシステム管理者の詳細をkintoneヘルプに譲っており、ユーザーごとのアクセス状況の確認については（ヘルプで直接は確認できず）。", "D": "正しい。組織の管理者は、cybozu.comの組織に対して、組織のメンバーを管理する権限を持った管理者。"}, "note": ""}}, {"id": "2-33", "set": 2, "no": 33, "category": "管理者設定", "question": "cybozu.com共通管理の設定で、正しいものをすべて選びなさい。", "answer": ["A", "C", "D"], "multi": true, "choices": [{"key": "A", "text": "ログインのセキュリティ設定では、SAML認証を有効化できる。", "help": "管理者の種類", "url": "https://jp.kintone.help/general/ja/id/0207", "textRef": "5-2-1 セキュリティの設定"}, {"key": "B", "text": "外部サービスとの連携を有効化できるが、ユーザーごとの連携利用設定はできない。", "help": "管理者の種類", "url": "https://jp.kintone.help/general/ja/id/0207", "textRef": "5-2-3 外部連携"}, {"key": "C", "text": "ユーザー管理のプロビジョニングで、Identity Provider（IdP）を用いて、cybozu.comのユーザー情報を管理できる。", "help": "管理者の種類", "url": "https://jp.kintone.help/general/ja/id/0207", "textRef": "5-2-3 外部連携"}, {"key": "D", "text": "組織間のアクセスを禁止すると、所属する最上位組織が異なるユーザー間では、互いのプロフィールを閲覧できない。", "help": "組織間のアクセスを禁止する", "url": "https://jp.kintone.help/general/ja/id/020164", "textRef": "5-1-9 組織間のアクセス権"}], "exam": "2026年4月30日改定", "exp": {"summary": "cybozu.com共通管理では、SAML認証、IdPによるプロビジョニング、組織間のアクセス禁止などを設定できる。", "choices": {"A": "正しい。SAML認証を使い、IdPに登録されたユーザーアカウントでシングルサインオンできる（設定場所の詳細はヘルプで直接は確認できず）。", "B": "誤り（公式の正答）。外部サービス連携のユーザーごとの利用設定については（ヘルプで直接は確認できず）。", "C": "正しい（公式の正答）。IdPを用いたプロビジョニングについては（ヘルプで直接は確認できず）。", "D": "正しい。［組織間のアクセス権］を有効にすると、所属する最上位組織が異なるユーザー間でお互いのプロフィールと組織情報にアクセスできなくなる。"}, "note": ""}}, {"id": "2-34", "set": 2, "no": 34, "category": "管理者設定", "question": "スペース管理において、kintoneシステム管理者ができることとして、誤っているものを1つ選びなさい。", "answer": ["D"], "multi": false, "choices": [{"key": "A", "text": "参加していないスペースに管理者として参加できる。", "help": "スペースの一覧を確認する", "url": "https://jp.kintone.help/k/ja/id/04073#space_admin_manage_spaces_30", "textRef": "5-3-3 スペースの管理"}, {"key": "B", "text": "非公開のスペースに管理者として参加し、スペースを削除できる。", "help": "スペースのライセンス使用状況を確認する", "url": "https://jp.kintone.help/k/ja/id/04073#space_admin_manage_spaces_20", "textRef": "5-3-3 スペースの管理"}, {"key": "C", "text": "スペースの一覧で、設定の最終更新者や最終更新日時\nを確認できる。", "help": "スペースの一覧を確認する", "url": "https://jp.kintone.help/k/ja/id/04073#space_admin_manage_spaces_30", "textRef": "5-3-3 スペースの管理"}, {"key": "D", "text": "スペースの一覧をCSV形式でダウンロードできる。", "help": "スペースの一覧をCSVファイルでダウンロードする", "url": "https://jp.kintone.help/k/ja/id/04073#space_admin_manage_spaces_40", "textRef": "5-3-3 スペースの管理"}], "exam": "2026年4月30日改定", "exp": {"summary": "スペースの一覧をCSVでダウンロードできるのはcybozu.com共通管理者。kintoneシステム管理者は一覧の確認、管理者として参加、削除ができる。", "choices": {"A": "正しい。［スペースの一覧］で、参加していないスペースに表示される［管理者として参加］をクリックすると、スペースの管理者として参加できる。", "B": "正しい。非公開スペースも［管理者として参加］で参加でき、［スペースの一覧］から削除もできる。", "C": "正しい。［スペースの一覧］では、設定の最終更新者や最終更新日時などを確認できる。", "D": "誤り（正解）。スペースの一覧をCSV形式でダウンロードできるのはcybozu.com共通管理者。"}, "note": ""}}, {"id": "2-35", "set": 2, "no": 35, "category": "管理者設定", "question": "ユーザーの追加に関する説明で、適切でないものを1つ選びなさい。", "answer": ["C"], "multi": false, "choices": [{"key": "A", "text": "CSVファイルを読み込んでユーザーを一括登録できる。", "help": "ユーザーを追加する", "url": "https://jp.kintone.help/k/ja/id/040138", "textRef": "5-1-6 一括操作"}, {"key": "B", "text": "ユーザーを追加するときは、表示名とログイン名の入力が必須である。", "help": "ユーザーを追加する", "url": "https://jp.kintone.help/k/ja/id/040138", "textRef": "5-1-2 ユーザーの設定"}, {"key": "C", "text": "追加するユーザーの所属組織を先に設定しておく必要がある。", "help": "ユーザーを追加する", "url": "https://jp.kintone.help/k/ja/id/040138", "textRef": "5-1-2 ユーザーの設定"}, {"key": "D", "text": "CSVファイルを使って新規ユーザーを一括登録する際のパスワードに、「*」（アスタリスク）を使用すると、有効なパスワードが設定されない。", "help": "［ユーザー］のファイルフォーマット", "url": "https://jp.kintone.help/general/ja/id/020155", "textRef": "5-1-6 一括操作"}], "exam": "2026年4月30日改定", "exp": {"summary": "ユーザーは組織がなくても追加でき、あとから組織を設定できる。CSVの新規追加でパスワードに「*」を書くと有効なパスワードが設定されない。", "choices": {"A": "適切。CSVファイルを使用して、複数のユーザーを一括で追加できる。", "B": "適切。ユーザーの追加画面では［表示名］と［ログイン名］が必須（メールアドレスをログイン名にする設定が初期値）。", "C": "適切でない（正解）。組織を追加していなくてもユーザーを追加でき、ユーザー追加後に組織を追加・設定することもできる。", "D": "適切。パスワードに「*」を記入してユーザーを追加すると、有効なパスワードが設定されない。共通管理者がパスワードを設定するかSAML認証でログインする必要がある。"}, "note": ""}}, {"id": "2-36", "set": 2, "no": 36, "category": "管理者設定", "question": "ライトコースで、kintoneをより安全に使える対策を実施する際、【ア】および【イ】に当てはまる単語の組み合わせとして、正しいものを1つ選びなさい。\n\n接続できる端末を制限する【ア】オプションと、\n「ユーザーだけが所有しているモバイル端末」を用いる【イ】が用意されている。", "answer": ["B"], "multi": false, "choices": [{"key": "A", "text": "【ア】：IPアドレス制限\n【イ】：2要素認証", "help": "アクセス制限", "url": "https://jp.kintone.help/general/ja/id/02043", "textRef": "5-2-1 セキュリティの設定"}, {"key": "B", "text": "【ア】：セキュアアクセス\n【イ】：2要素認証", "help": "アクセス制限", "url": "https://jp.kintone.help/general/ja/id/02043", "textRef": "5-2-1 セキュリティの設定"}, {"key": "C", "text": "【ア】：IPアドレス制限\n【イ】：二段階認証", "help": "アクセス制限", "url": "https://jp.kintone.help/general/ja/id/02043", "textRef": "5-2-1 セキュリティの設定"}, {"key": "D", "text": "【ア】：セキュアアクセス\n【イ】：二段階認証", "help": "アクセス制限", "url": "https://jp.kintone.help/general/ja/id/02043", "textRef": "5-2-1 セキュリティの設定"}], "exam": "2026年4月30日改定", "exp": {"summary": "端末を制限するのは「セキュアアクセス」（オプション）、手元のモバイル端末を使うのは「2要素認証」。IPアドレス制限はネットワークの制限。", "choices": {"A": "誤り。【ア】のIPアドレス制限は、アクセス可能なネットワークをIPアドレスで制限するもので、端末を制限するオプションではない。", "B": "正しい。端末を制限するオプションはセキュアアクセス（料金ページのオプションに記載）、認証アプリを使うのは2要素認証。", "C": "誤り。【ア】はIPアドレス制限ではない。また、cybozu.comのヘルプでの名称は「二段階認証」ではなく「2要素認証」。", "D": "誤り。【ア】は正しいが、【イ】のヘルプでの名称は「二段階認証」ではなく「2要素認証」。"}, "note": ""}}, {"id": "2-37", "set": 2, "no": 37, "category": "管理者設定", "question": "kintoneシステム管理の「アップデートオプション」の説明として、適切なものをすべて選びなさい。", "answer": ["A", "B", "C"], "multi": true, "choices": [{"key": "A", "text": "月例チャネルでは、月に一度の定期メンテナンス時を基本のタイミングとして、新機能が適用される。", "help": "［アップデートオプション］画面でできること", "url": "https://jp.kintone.help/k/ja/id/04050", "textRef": "5-3-7 その他の管理"}, {"key": "B", "text": "月例チャネルを選択している場合、「自動的に無効化を選択する」オプションを利用できる。", "help": "［アップデートオプション］画面でできること", "url": "https://jp.kintone.help/k/ja/id/04050", "textRef": "5-3-7 その他の管理"}, {"key": "C", "text": "最新チャネルでは、月例チャネルで提供中の新機能に加え、より多くの新機能をより早い時期から利用できる。", "help": "［アップデートオプション］画面でできること", "url": "https://jp.kintone.help/k/ja/id/04050", "textRef": "5-3-7 その他の管理"}, {"key": "D", "text": "最新チャネルでは、「リリース予定の新機能の先行利用」と「開発中の新機能」の対象機能について、すべて自動的に有効化される。", "help": "［アップデートオプション］画面でできること", "url": "https://jp.kintone.help/k/ja/id/04050", "textRef": "5-3-7 その他の管理"}], "exam": "2026年4月30日改定", "exp": {"summary": "月例チャネルは月1回の定期メンテナンスが基本で「自動的に無効化を選択する」が使える。最新チャネルはより多くの新機能を早く使えるが、先行利用・検討中の機能は有効化しない限り適用されない。", "choices": {"A": "適切。月例チャネルでは、月に一度の定期メンテナンス時を基本のタイミングとして新機能が適用される。", "B": "適切。月例チャネルを選択している場合だけ、［自動的に無効化を選択する］（アップデートの延期）オプションを利用できる。", "C": "適切。最新チャネルでは、月例チャネルで提供中の新機能に加え、より多くの新機能をより早い時期から利用できる。", "D": "不適切。どちらのチャネルでも、［リリース予定の新機能の先行利用］と［検討中の新機能］の対象機能は、各機能を有効化しない限り適用されない。"}, "note": ""}}, {"id": "2-38", "set": 2, "no": 38, "category": "管理者設定", "question": "グループ（ロール）で所属ユーザーの設定を行う際の説明として、誤っているものをすべて選びなさい。", "answer": ["B", "D"], "multi": true, "choices": [{"key": "A", "text": "グループが静的グループか動的グループかによって、ユーザーを追加、変更する方法は異なる。", "help": "グループ（ロール）を設定する", "url": "https://jp.kintone.help/k/ja/id/04061", "textRef": "5-1-5 グループ（ロール）と所属ユーザーの設定"}, {"key": "B", "text": "静的グループでは、役職や誕生日などの条件を指定してグループを構成できる。", "help": "グループ（ロール）を設定する", "url": "https://jp.kintone.help/k/ja/id/04061", "textRef": "5-1-5 グループ（ロール）と所属ユーザーの設定"}, {"key": "C", "text": "ユーザーの所属グループ（ロール）をCSV形式のファイルに書き出すことができる。", "help": "グループ（ロール）を設定する", "url": "https://jp.kintone.help/k/ja/id/04061", "textRef": "5-1-6 一括操作"}, {"key": "D", "text": "初期設定では、cybozu.com共通管理者を指す「Everyone」グループが自動で作成される。", "help": "グループ（ロール）を設定する", "url": "https://jp.kintone.help/k/ja/id/04061", "textRef": "5-1-5 グループ（ロール）と所属ユーザーの設定"}], "exam": "2026年4月30日改定", "exp": {"summary": "静的グループはユーザーを指定、動的グループは役職や組織などの条件で構成する。Everyoneは全ユーザーを表す。", "choices": {"A": "正しい。グループには静的と動的の2種類があり、静的はユーザーを指定、動的は条件を指定して作成するため、メンバーの決め方が異なる。", "B": "誤り（正解）。役職などの条件を指定して構成するのは動的グループ。静的グループはユーザーを指定して作成する。", "C": "正しい（公式の正答）。所属グループをCSVファイルに書き出せる点は（ヘルプで直接は確認できず）。", "D": "誤り（正解）。Everyoneはcybozu.com共通管理者ではなく、すべてのユーザーを表すグループ（アプリテンプレートのヘルプに「［Everyone］（すべてのユーザー）」とある）。"}, "note": ""}}, {"id": "2-39", "set": 2, "no": 39, "category": "その他", "question": "「ライトコース」と「スタンダードコース」のどちらでも利用ができるものとして、誤っているものをすべて選びなさい。", "answer": ["A", "C", "D"], "multi": true, "choices": [{"key": "A", "text": "APIを使った他システムとの連携", "help": "料金", "url": "https://kintone.cybozu.co.jp/price/", "textRef": "6-7 kintoneの契約内容"}, {"key": "B", "text": "5GB×ユーザー数のディスク容量", "help": "料金", "url": "https://kintone.cybozu.co.jp/price/", "textRef": "6-7 kintoneの契約内容"}, {"key": "C", "text": "2枚目以降のポータルの作成", "help": "料金", "url": "https://kintone.cybozu.co.jp/price/", "textRef": "6-7 kintoneの契約内容"}, {"key": "D", "text": "メール共有オプション", "help": "料金", "url": "https://kintone.cybozu.co.jp/price/", "textRef": "6-7 kintoneの契約内容"}], "exam": "2026年4月30日改定", "exp": {"summary": "ライトコースでは、外部連携・プラグインなどの拡張機能、2枚目以降のポータルは使えない。ディスク容量5GB×ユーザー数は共通。", "choices": {"A": "誤り（正解）。料金ページで「外部サービス連携、プラグインなどの拡張機能」とAPIリクエスト数はスタンダードコース以上の項目で、ライトコースでは使えない。", "B": "正しい（不正解）。ディスク容量は5GB×ユーザー数で、コース共通。", "C": "誤り（正解）。ライトコースでは2枚目以降のポータルを作成できない（スタンダード3枚、ワイド10枚）。", "D": "誤り（正解・公式の正答）。料金ページにメール共有オプションは記載があるが、ライトコースで使えないことは抽出したテキストでは表の区分を確認できず（ヘルプで直接は確認できず。プラグインのヘルプの関連ページにメール共有オプションが並び、プラグインはライトコースで使えない）。"}, "note": ""}}, {"id": "2-40", "set": 2, "no": 40, "category": "その他", "question": "「2枚目以降のポータル」の説明として、誤っているものをすべて選びなさい。", "answer": ["A", "D"], "multi": true, "choices": [{"key": "A", "text": "契約コースにかかわらず、「2枚目以降のポータル」を作成できる。", "help": "2枚目以降のポータルを追加する", "url": "https://jp.kintone.help/k/ja/id/0401020", "textRef": "6-1-4 2枚目以降のポータル"}, {"key": "B", "text": "ウィジェットの「スペース」を使って、複数のスペースを表示したい順番で並べることができる。", "help": "スペースウィジェット", "url": "https://jp.kintone.help/k/ja/id/0401073", "textRef": "6-1-4 2枚目以降のポータル"}, {"key": "C", "text": "ユーザーがログインしたときに最初に表示するポータルを、組織ごとに設定できる。", "help": "最初に表示するポータルを設定する", "url": "https://jp.kintone.help/k/ja/id/0401024", "textRef": "6-1-4 2枚目以降のポータル"}, {"key": "D", "text": "ゲストユーザーにも、2枚目以降のポータルは表示される。", "help": "2枚目以降のポータルを追加する", "url": "https://jp.kintone.help/k/ja/id/0401020", "textRef": "6-1-4 2枚目以降のポータル"}], "exam": "2026年4月30日改定", "exp": {"summary": "2枚目以降のポータルはスタンダード以上・PC版のみで、ゲストユーザーには表示されない。最初に表示するポータルは組織ごとに設定できる。", "choices": {"A": "誤り（正解）。ライトコースでは2枚目以降のポータルを作成できない。", "B": "正しい（公式の正答）。スペースを表示するウィジェットでスペースの一覧を並べて表示できる。", "C": "正しい。ログインしたときに最初に表示するポータルを、組織ごとに設定できる。", "D": "誤り（正解）。ゲストユーザーには、2枚目以降のポータルは表示されない。"}, "note": "現行ヘルプの「スペースウィジェット」は、お気に入りや最近開いたスペースなどの一覧をドロップダウンで切り替えて表示するもので、「表示したい順番で並べる」記述はない。任意のスペースを並べるのは別の「指定したスペースウィジェット」と思われる（推測）。公式の正答ではBは正しい扱い。"}}, {"id": "2-41", "set": 2, "no": 41, "category": "その他", "question": "プラグインを利用する際の説明として、正しいものをすべて選びなさい。", "answer": ["B", "C", "D"], "multi": true, "choices": [{"key": "A", "text": "プラグインを利用する際は、はじめにアプリ管理画面でプラグインを追加する。", "help": "プラグインを追加／削除する（kintoneシステム管理）", "url": "https://jp.kintone.help/k/ja/id/0408", "textRef": "5-3-7 その他の管理"}, {"key": "B", "text": "プラグインごとに、アプリを指定して利用を許可できる。", "help": "プラグインを追加／削除する（kintoneシステム管理）", "url": "https://jp.kintone.help/k/ja/id/0408", "textRef": "5-3-7 その他の管理"}, {"key": "C", "text": "プラグインごとに、スペースを指定して利用を許可できる。", "help": "プラグインを追加／削除する（kintoneシステム管理）", "url": "https://jp.kintone.help/k/ja/id/0408", "textRef": "5-3-7 その他の管理"}, {"key": "D", "text": "自分で作成したプラグインを利用できる。", "help": "プラグインを追加／削除する（kintoneシステム管理）", "url": "https://jp.kintone.help/k/ja/id/0408", "textRef": "5-3-7 その他の管理"}], "exam": "2026年4月30日改定", "exp": {"summary": "プラグインは、まずkintoneシステム管理で追加し、次に各アプリで追加する。利用許可はアプリ単位またはスペース単位で設定できる。", "choices": {"A": "誤り。はじめにkintoneシステム管理でプラグインを追加し、その後アプリ管理者が各アプリの設定画面で追加する。", "B": "正しい。プラグインごとに、利用を許可するアプリを指定できる。", "C": "正しい。プラグインごとの利用許可は、スペースを指定して設定することもでき、そのスペースに所属するアプリで利用できる。", "D": "正しい。プラグインはファイル（zip）を読み込んで追加でき、自作のものも同じ手順で読み込める（自作に特化した記載はヘルプで直接は確認できず）。"}, "note": ""}}, {"id": "2-42", "set": 2, "no": 42, "category": "その他", "question": "kintoneの検索機能の説明として、正しいものをすべて選びなさい。", "answer": ["A", "C"], "multi": true, "choices": [{"key": "A", "text": "アルファベットの大文字と小文字、および全角と半角は区別して検索できない。", "help": "データを検索する", "url": "https://jp.kintone.help/k/ja/id/040689", "textRef": "6-3-3 検索の注意点"}, {"key": "B", "text": "添付ファイルは、ファイル名のみを検索し、ファイルの内容は検索しない。", "help": "データを検索する", "url": "https://jp.kintone.help/k/ja/id/040689", "textRef": "6-3-3 検索の注意点"}, {"key": "C", "text": "複数のキーワードによる検索では、OR検索やNOT検索はできない。", "help": "データを検索する", "url": "https://jp.kintone.help/k/ja/id/040689", "textRef": "6-3-3 検索の注意点"}, {"key": "D", "text": "「レコード」や「スペース・スレッド」など情報の種類を指定した検索はできない。", "help": "データを検索する", "url": "https://jp.kintone.help/k/ja/id/040689", "textRef": "6-3-1 kintone全体を検索する"}], "exam": "2026年4月30日改定", "exp": {"summary": "英数字の大文字/小文字・全角/半角は区別されない。添付ファイルはファイル名だけでなく内容も検索される。種類（レコード、スペース・スレッドなど）で絞り込める。", "choices": {"A": "正しい。英数字で検索する場合、アルファベットの大文字と小文字、および全角と半角は区別されない。", "B": "誤り。添付ファイルは、ファイル名とファイルの内容の両方が検索対象。", "C": "正しい（公式の正答）。ただし現行ヘルプではOR検索とNOT検索ができると明記されている（下のnote参照）。", "D": "誤り。検索結果は［種類］で、［レコード］［スペース・スレッド］などデータの種類を指定して絞り込める。"}, "note": "現行ヘルプ（記事番号040689）には、キーワードの間を大文字のORでつなぐOR検索、キーワードの直前にハイフンを付けるNOT検索ができると明記されている。公式の正答ではCは正しい扱いだが、現行の仕様ではCは誤りになるので、問題が作られたあとに仕様が変わった可能性がある。"}}, {"id": "2-43", "set": 2, "no": 43, "category": "その他", "question": "自分宛の通知が送信されるケースとして、正しいものをすべて選びなさい。", "answer": ["B", "D"], "multi": true, "choices": [{"key": "A", "text": "自分がフォローしているピープルに、ほかのユーザーがコメントを書き込んだとき。", "help": "「自分宛」通知と「すべて」通知の違い", "url": "https://jp.kintone.help/k/ja/id/040674", "textRef": "6-4-2 「自分宛」の通知と通常の通知の違い"}, {"key": "B", "text": "自分が登録したレコードに、更新やコメントの書き込みがあったとき。", "help": "「自分宛」通知と「すべて」通知の違い", "url": "https://jp.kintone.help/k/ja/id/040674", "textRef": "6-4-2 「自分宛」の通知と通常の通知の違い"}, {"key": "C", "text": "アプリの条件通知でレコード編集の通知先となっている組織に自分が含まれていて、レコードが更新されたとき。", "help": "「自分宛」通知と「すべて」通知の違い", "url": "https://jp.kintone.help/k/ja/id/040674", "textRef": "6-4-2 「自分宛」の通知と通常の通知の違い"}, {"key": "D", "text": "プロセス管理機能が有効なアプリで、自分が作業者として選択されたとき。", "help": "「自分宛」通知と「すべて」通知の違い", "url": "https://jp.kintone.help/k/ja/id/040674", "textRef": "6-4-2 「自分宛」の通知と通常の通知の違い"}], "exam": "2026年4月30日改定", "exp": {"summary": "「自分宛」になるのは、宛先指定・作業者になったとき・リマインダー/レコードの条件通知・フィールドを通知先にしたアプリの条件通知など。ユーザー/組織/グループを直接通知先にしたアプリの条件通知は「すべて」。", "choices": {"A": "誤り。自分がフォローしているピープルにほかのユーザーがコメントしたときは、「すべて」の通知として届く。", "B": "正しい。アプリの条件通知で通知先に［作成者］フィールドを指定していると、レコード編集やコメント書き込みのときに作成者へ「自分宛」で通知される。", "C": "誤り。アプリの条件通知で組織を通知先に指定した場合は、「すべて」の通知として届く。", "D": "正しい。プロセス管理の作業者になったときの通知は「自分宛」で届く。"}, "note": "ヘルプでは、Bの「自分宛」通知は、アプリの条件通知で［作成者］フィールドを通知先にしている場合に限られる。登録したレコードなら無条件に届くわけではない。公式の正答どおりBは正しいとした。"}}, {"id": "2-44", "set": 2, "no": 44, "category": "その他", "question": "添付ファイルの内容が検索されるファイル形式として、誤っているものを1つ選びなさい。", "answer": ["C"], "multi": false, "choices": [{"key": "A", "text": "Microsoft Excelファイル", "help": "検索対象のファイル形式", "url": "https://jp.kintone.help/k/ja/id/040690", "textRef": "6-3-3 検索の注意点"}, {"key": "B", "text": "Microsoft PowerPointファイル", "help": "検索対象のファイル形式", "url": "https://jp.kintone.help/k/ja/id/040690", "textRef": "6-3-3 検索の注意点"}, {"key": "C", "text": "GIFファイル", "help": "検索対象のファイル形式", "url": "https://jp.kintone.help/k/ja/id/040690", "textRef": "6-3-3 検索の注意点"}, {"key": "D", "text": "PDFファイル", "help": "検索対象のファイル形式", "url": "https://jp.kintone.help/k/ja/id/040690", "textRef": "6-3-3 検索の注意点"}], "exam": "2026年4月30日改定", "exp": {"summary": "内容が検索されるのは、Word・Excel・PowerPoint・PDF・テキストなどの文書形式。GIFなどの画像は対象外。", "choices": {"A": "正しい（不正解）。Microsoft Excelは、内容を検索できるファイル形式に含まれる。", "B": "正しい（不正解）。Microsoft PowerPointは、内容を検索できるファイル形式に含まれる。", "C": "誤り（正解）。GIFファイルは、内容を検索できるファイル形式の一覧に含まれていない。", "D": "正しい（不正解）。PDFは内容を検索できる（閲覧時にパスワードが必要なPDFは除く）。"}, "note": ""}}, {"id": "2-45", "set": 2, "no": 45, "category": "その他", "question": "スマートフォンでkintoneを利用する際の説明として、誤っているものを1つ選びなさい。", "answer": ["D"], "multi": false, "choices": [{"key": "A", "text": "表形式、カレンダー形式、およびカスタマイズのアプリの一覧を表示できる。", "help": "モバイル版の画面の説明", "url": "https://jp.kintone.help/k/ja/id/040667", "textRef": "6-8-3 モバイル版の画面"}, {"key": "B", "text": "検索結果には、添付された文書ファイルの内容を検索した結果も表示される。", "help": "モバイル版の画面の説明", "url": "https://jp.kintone.help/k/ja/id/040667", "textRef": "6-8-3 モバイル版の画面"}, {"key": "C", "text": "別の画面で作業をしている途中で通知を確認した後、戻るアイコンをタップすると、作業中の画面に戻ることができる。", "help": "モバイル版の画面の説明", "url": "https://jp.kintone.help/k/ja/id/040667", "textRef": "6-8-3 モバイル版の画面"}, {"key": "D", "text": "スマートフォン用アプリ「kintoneモバイル」は、ゲストユーザーも使用できる。", "help": "モバイル版の画面の説明", "url": "https://jp.kintone.help/k/ja/id/040667", "textRef": "4-4-3 ゲストの操作"}], "exam": "2026年4月30日改定", "exp": {"summary": "モバイル版でも表形式・カレンダー形式・カスタマイズの一覧、添付ファイルの内容検索、通知確認後の元の画面への復帰ができる。kintoneモバイルはゲストユーザーは使えない。", "choices": {"A": "正しい。モバイル版でも、PC版と同様に表形式、カレンダー形式、カスタマイズの一覧を表示できる。", "B": "正しい。検索結果には、アプリやスペースとともに、添付された文書ファイルの内容を検索した結果も表示される。", "C": "正しい。作業の途中で通知を確認し、［通知一覧を閉じる］ボタン（＜の形）をタップすると作業中の画面に戻れる。", "D": "誤り（正解）。スマートフォン用アプリ「kintoneモバイル」はゲストユーザーは使用できない（このページではヘルプで直接は確認できず）。"}, "note": ""}}, {"id": "3-01", "set": 3, "no": 1, "category": "アプリ", "question": "「アプリの設定」→「設定」タブ→「プロセス管理」で、作業者に複数人の部長を設定した。プロセス管理の設定の説明として、正しいものをすべて選びなさい。", "answer": ["A", "B"], "multi": true, "choices": [{"key": "A", "text": "作業者に「次のユーザーから作業者を選択」を設定すると、申請時に部長の1人を選択できる。", "help": "基本的なプロセス管理の設定", "url": "https://jp.kintone.help/k/ja/id/040575", "textRef": "3-3-2 プロセス管理の設定"}, {"key": "B", "text": "作業者に「次のユーザー全員」を設定すると、全員が作業者になり、全員がアクションを実行したときに次のステータスに進むようにできる。", "help": "基本的なプロセス管理の設定", "url": "https://jp.kintone.help/k/ja/id/040575", "textRef": "3-3-2 プロセス管理の設定"}, {"key": "C", "text": "作業者に「次のユーザーのうち1人」を設定すると、申請時に部長の1人を選択できる。", "help": "基本的なプロセス管理の設定", "url": "https://jp.kintone.help/k/ja/id/040575", "textRef": "3-3-2 プロセス管理の設定"}, {"key": "D", "text": "作業者に「次のユーザーがアクション」を設定すると、誰か1人がアクションを実行したときに次のステータスに進むようにできる。", "help": "基本的なプロセス管理の設定", "url": "https://jp.kintone.help/k/ja/id/040575", "textRef": "3-3-2 プロセス管理の設定"}], "exam": "2026年4月30日改定", "exp": {"summary": "作業者の指定方法は「次のユーザーから作業者を選択（前の作業者が1人指名）」「次のユーザー全員（全員の実行で進む）」「次のユーザーのうち1人（誰か1人の実行で進む）」の3つだけと覚える。", "choices": {"A": "正しい。［次のユーザーから作業者を選択］では、前のステータスの作業者がアクション実行時に候補の中から次の作業者を1人だけ指定する。", "B": "正しい。［次のユーザー全員］では設定したユーザー全員が作業者になり、作業者全員がアクションを実行したらステータスが変わる。", "C": "誤り。［次のユーザーのうち1人］では設定したユーザー全員が自動で作業者になり、次の作業者を指定する必要はない。誰か1人がアクションを実行すればステータスが変わる。", "D": "誤り。作業者の指定方法は［次のユーザーから作業者を選択］［次のユーザー全員］［次のユーザーのうち1人］の3つで、「次のユーザーがアクション」という選択肢はない。"}, "note": ""}}, {"id": "3-02", "set": 3, "no": 2, "category": "アプリ", "question": "「文字列（複数行）」フィールドの説明として、誤っているものをすべて選びなさい。", "answer": ["A", "D"], "multi": true, "choices": [{"key": "A", "text": "計算式を設定し、計算結果の文字列を表示するフィールドとして利用できる。", "help": "計算式の設定", "url": "https://jp.kintone.help/k/ja/id/040495", "textRef": "2-2-3 文字"}, {"key": "B", "text": "改行した文字列は、改行した状態でファイルへ書き出しされる。", "help": "文字列（複数行）", "url": "https://jp.kintone.help/k/ja/id/040538", "textRef": "2-2-3 文字"}, {"key": "C", "text": "絞り込みの条件を設定する際に、「空欄である」または「空欄ではない」を指定できる。", "help": "一覧に表示するレコードを絞り込む", "url": "https://jp.kintone.help/k/ja/id/040458", "textRef": "1-4-1 表示するレコードの絞り込み"}, {"key": "D", "text": "最小文字数と最大文字数のどちらか一方、または両方を指定できる。", "help": "文字列（複数行）", "url": "https://jp.kintone.help/k/ja/id/040538", "textRef": "2-2-3 文字"}], "exam": "2026年4月30日改定", "exp": {"summary": "計算式を設定できるのは［計算］と［文字列（1行）］だけで、［文字列（複数行）］には文字数の設定項目もない。", "choices": {"A": "誤り。計算式を利用できるのは［計算］フィールドまたは［文字列（1行）］フィールドで、［文字列（複数行）］には設定できない。", "B": "正しい。改行して入力した文字列は、ファイルへ書き出したときにも改行された状態で出力される。", "C": "正しい。［文字列（複数行）］フィールドでは、［空欄である］または［空欄ではない］を絞り込み条件に指定できる。", "D": "誤り。［文字列（複数行）］の設定項目はフィールド名・必須項目・初期値・フィールドコードなどで、最小／最大文字数の指定はない（文字数を指定できるのは［リンク］などほかのフィールド）。"}, "note": ""}}, {"id": "3-03", "set": 3, "no": 3, "category": "アプリ", "question": "カテゴリー機能の説明として、誤っているものを1つ選びなさい。", "answer": ["C"], "multi": false, "choices": [{"key": "A", "text": "レコード一覧に表示される。", "help": "カテゴリーの設定", "url": "https://jp.kintone.help/k/ja/id/040489", "textRef": "3-7-1 カテゴリー"}, {"key": "B", "text": "カテゴリーを有効にすると、フォームに「カテゴリー」フィールドが追加され、レコードを分類できる。", "help": "カテゴリーの設定", "url": "https://jp.kintone.help/k/ja/id/040489", "textRef": "3-7-1 カテゴリー"}, {"key": "C", "text": "10階層まで設定できる。", "help": "カテゴリーの設定", "url": "https://jp.kintone.help/k/ja/id/040489", "textRef": "3-7-1 カテゴリー"}, {"key": "D", "text": "「ファイルから読み込む」機能で、一括で読み込みができる。", "help": "カテゴリーの設定", "url": "https://jp.kintone.help/k/ja/id/040489", "textRef": "3-7-1 カテゴリー"}], "exam": "2026年4月30日改定", "exp": {"summary": "カテゴリーは「5階層・合計1,000個まで」。数値の引っかけに注意する。", "choices": {"A": "正しい。カテゴリーを有効にすると、［レコードの一覧］画面の左側にカテゴリー表示エリアが現れ、階層形式で表示される。", "B": "正しい。各レコードのカテゴリーは、レコードの追加・編集画面に表示される［カテゴリー］から選択して登録し、レコードを分類できる。", "C": "誤り。カテゴリーは最上位カテゴリーを含めて5階層（合計1,000個）まで設定でき、10階層ではない。", "D": "正しい。カテゴリーが有効な場合、カテゴリーの分類をファイルから読み込めるため、登録済みレコードも一括で分類できる。"}, "note": ""}}, {"id": "3-04", "set": 3, "no": 4, "category": "アプリ", "question": "アプリのレコード詳細画面の説明として、誤っているものを1つ選びなさい。", "answer": ["D"], "multi": false, "choices": [{"key": "A", "text": "画面右上の「…（オプション）」アイコンをクリックすると、レコードのリンクのコピーや、レコードの印刷ができる。", "help": "レコードにコメントを書き込む", "url": "https://jp.kintone.help/k/ja/id/040463", "textRef": "1-3-1 レコードのコメントの表示"}, {"key": "B", "text": "レコード詳細画面でショートカットキーを使用することができる。", "help": "kintoneのショートカットキー", "url": "https://jp.kintone.help/k/ja/id/040319", "textRef": "1-2-2 レコードの登録"}, {"key": "C", "text": "画面右上の「次のレコードに移動する」アイコンをクリックすると、アプリ内の次のレコードを表示する。", "help": "レコードにコメントを書き込む", "url": "https://jp.kintone.help/k/ja/id/040463", "textRef": "1-2-2 レコードの登録"}, {"key": "D", "text": "「レコードを再利用する」機能が有効の場合、画面右上の「レコードを再利用する」アイコンをクリックすると、すべてのフィールドの値をコピーして、新規レコードを登録する画面が開く。", "help": "レコードにコメントを書き込む", "url": "https://jp.kintone.help/k/ja/id/040463", "textRef": "1-2-2 レコードの登録"}], "exam": "2026年4月30日改定", "exp": {"summary": "レコードの再利用では、レコード番号・作成者などのレコード情報、添付ファイル、ステータス、コメント、変更履歴はコピーされない。", "choices": {"A": "正しい。［レコードの詳細］画面右上の［オプション］アイコンから、［レコードのリンクをコピー］や［レコードを印刷］ができる。", "B": "正しい。レコード詳細／編集画面では、j（次のレコード）、k（前のレコード）、e（編集）などのショートカットキーが使える。", "C": "正しい。（ヘルプで直接は確認できず）ただし、詳細画面にはショートカットキー j で次のレコードを選択する操作があり、次のレコードへ移動できる。", "D": "誤り。再利用では［レコード番号］［作成者］［更新者］［作成日時］［更新日時］［添付ファイル］、ステータスや作業者、コメント、変更履歴はコピーされない。すべてのフィールドの値がコピーされるわけではない。"}, "note": ""}}, {"id": "3-05", "set": 3, "no": 5, "category": "アプリ", "question": "ほかのアプリを再利用して新しく作成する場合に、作成するアプリに引き継がれる値や設定をすべて選びなさい。", "answer": ["A", "C"], "multi": true, "choices": [{"key": "A", "text": "ルックアップの設定", "help": "ほかのアプリを再利用して新しく作成する（アプリのコピー）", "url": "https://jp.kintone.help/k/ja/id/040630", "textRef": "1-1-9 方法6：ほかのアプリを再利用して新しく作成する（アプリのコピー）"}, {"key": "B", "text": "APIトークン", "help": "ほかのアプリを再利用して新しく作成する（アプリのコピー）", "url": "https://jp.kintone.help/k/ja/id/040630", "textRef": "1-1-9 方法6：ほかのアプリを再利用して新しく作成する（アプリのコピー）"}, {"key": "C", "text": "プラグインの有効／無効の状態", "help": "ほかのアプリを再利用して新しく作成する（アプリのコピー）", "url": "https://jp.kintone.help/k/ja/id/040630", "textRef": "1-1-9 方法6：ほかのアプリを再利用して新しく作成する（アプリのコピー）"}, {"key": "D", "text": "アプリに登録したレコードのデータ", "help": "ほかのアプリを再利用して新しく作成する（アプリのコピー）", "url": "https://jp.kintone.help/k/ja/id/040630", "textRef": "1-1-9 方法6：ほかのアプリを再利用して新しく作成する（アプリのコピー）"}], "exam": "2026年4月30日改定", "exp": {"summary": "アプリの再利用で引き継がれないのは、アプリコード、APIトークン、Webhook、Slack連携、プラグインの設定内容、レコードのデータなど。プラグインの有効／無効の状態は引き継がれる。", "choices": {"A": "引き継がれる。ルックアップの設定は「引き継がれない項目」に含まれず、フォームなどの設定とともに引き継がれる。", "B": "引き継がれない。APIトークンは、再利用したアプリに引き継がれない項目として明記されている。", "C": "引き継がれる。プラグインに適用している設定は引き継がれないが、有効／無効の状態は引き継がれる。", "D": "引き継がれない。再利用して作成したアプリのレコードは空になる。データが必要なら、ファイルに書き出して新しいアプリに読み込む。"}, "note": ""}}, {"id": "3-06", "set": 3, "no": 6, "category": "アプリ", "question": "アプリグループの説明として、適切なものをすべて選びなさい。", "answer": ["A", "C"], "multi": true, "choices": [{"key": "A", "text": "スペース内アプリは「Public」に所属し、アプリグループを変更することはできない。", "help": "アプリグループとは", "url": "https://jp.kintone.help/k/ja/id/04028", "textRef": "4-2-3 スペース内アプリ"}, {"key": "B", "text": "「Private」に所属するアプリも、契約のコースで作成できるアプリ数の上限に含まれる。", "help": "アプリグループとは", "url": "https://jp.kintone.help/k/ja/id/04028", "textRef": "3-6-2 アプリのアクセス権"}, {"key": "C", "text": "「Private」に所属するアプリは、そのアプリの作成者だけに公開される。", "help": "アプリグループとは", "url": "https://jp.kintone.help/k/ja/id/04028", "textRef": "3-6-2 アプリのアクセス権"}, {"key": "D", "text": "「Public」と「Private」以外のアプリグループを作成できない。", "help": "アプリグループとは", "url": "https://jp.kintone.help/k/ja/id/04028", "textRef": "5-3-2 アプリの管理"}], "exam": "2026年4月30日改定", "exp": {"summary": "スペース内アプリはPublic固定、Privateは作成者専用で契約上のアプリ数にカウントされない、と押さえる。", "choices": {"A": "適切。スペース内アプリは必ずPublicアプリグループに所属し、ほかのアプリグループには変更できない。", "B": "不適切。Privateグループのアプリは、契約上の作成可能なアプリ数にはカウントされない（ディスク使用量には影響する可能性がある）。", "C": "適切。Privateグループのアプリはアプリの作成者だけが利用でき、作成者以外のポータルの［アプリ］や［アプリの一覧］には表示されない。", "D": "不適切。Public以外にも、kintoneシステム管理者（アプリグループの管理権限を持つユーザー）はアプリグループを自由に作成できる。"}, "note": ""}}, {"id": "3-07", "set": 3, "no": 7, "category": "アプリ", "question": "レコード一覧画面で、表示するレコードを絞り込む機能について、誤っているものを1つ選びなさい。", "answer": ["A"], "multi": false, "choices": [{"key": "A", "text": "レコードを日付で絞り込むときの選択肢は、「今年／今月／今日」のみである。", "help": "一覧に表示するレコードを絞り込む", "url": "https://jp.kintone.help/k/ja/id/040458", "textRef": "1-4-2 一覧の作成"}, {"key": "B", "text": "レコードの表示順は指定できる。", "help": "一覧に表示するレコードを絞り込む", "url": "https://jp.kintone.help/k/ja/id/040458", "textRef": "1-4-2 一覧の作成"}, {"key": "C", "text": "テーブル内のフィールドは絞り込みの条件に指定できる。", "help": "一覧に表示するレコードを絞り込む", "url": "https://jp.kintone.help/k/ja/id/040458", "textRef": "1-4-2 一覧の作成"}, {"key": "D", "text": "絞り込んだレコード数が10万件を超えると警告が表示され、レコードが正しく絞りこまれない場合がある。", "help": "一覧に表示するレコードを絞り込む", "url": "https://jp.kintone.help/k/ja/id/040458", "textRef": "1-4-2 一覧の作成"}], "exam": "2026年4月30日改定", "exp": {"summary": "日付の絞り込みは「今日・今月・今年」以外に来月、来週、指定日なども選べる。キーワードを含むレコードが10万件を超えると正しく絞り込めない。", "choices": {"A": "誤り。日付の条件には［来月］なども指定でき、［以降］［以前］と組み合わせて「今月25日から来月24日」のような期間でも絞り込める。", "B": "正しい。［絞り込む］ダイアログの［ソート］で、レコードの表示順を指定できる。", "C": "正しい。テーブル内のフィールドも条件に指定できる。その場合、条件を満たす行が1行以上あるレコードが表示される。", "D": "正しい。指定したキーワードを含むレコードが10万件を超えると警告が表示され、レコードが正しく絞り込まれない。"}, "note": ""}}, {"id": "3-08", "set": 3, "no": 8, "category": "アプリ", "question": "レコード一覧画面で、各フィールドの列幅を変更する際の説明として、誤っているものをすべて選びなさい。", "answer": ["B", "D"], "multi": true, "choices": [{"key": "A", "text": "ユーザー個人が設定した列幅は、ログインユーザーとWebブラウザーの組み合わせで保持される。", "help": "各ユーザーが個別に一覧の列幅を変更する", "url": "https://jp.kintone.help/k/ja/id/040613", "textRef": "1-4-3 一覧の列幅の変更"}, {"key": "B", "text": "各ユーザーは、レコード一覧の各フィールドの列幅を、アプリの設定に保存できる。", "help": "一覧の列幅をアプリ設定に保存する", "url": "https://jp.kintone.help/k/ja/id/040611", "textRef": "1-4-3 一覧の列幅の変更"}, {"key": "C", "text": "一覧の設定画面で列幅を変更する際に、列幅をpx（ピクセル）で指定できる。", "help": "一覧の列幅をアプリ設定に保存する", "url": "https://jp.kintone.help/k/ja/id/040611", "textRef": "1-4-3 一覧の列幅の変更"}, {"key": "D", "text": "アプリ管理者が一覧の列幅をアプリの設定に保存した場合、各ユーザーは個別に列幅を変更できない。", "help": "一覧の列幅をアプリ設定に保存する", "url": "https://jp.kintone.help/k/ja/id/040611", "textRef": "1-4-3 一覧の列幅の変更"}], "exam": "2026年4月30日改定", "exp": {"summary": "列幅をアプリの設定に保存できるのはアプリ管理者だけ。保存後も各ユーザーは個別に変更でき、個別の設定が優先される。", "choices": {"A": "正しい。ユーザーが個別に変更した列幅は、ログインユーザーとWebブラウザーの組み合わせで保持される。", "B": "誤り。アプリ管理権限がない場合は［現在の列幅をアプリ設定に保存］が表示されない。各ユーザーが保存できるわけではない。", "C": "正しい。一覧の設定画面の［列幅の設定］で、列幅をpx単位で変更できる。", "D": "誤り。列幅をアプリの設定に保存したあとも、各ユーザーは個別に列幅を変更でき、ユーザーごとの設定が優先される。"}, "note": ""}}, {"id": "3-09", "set": 3, "no": 9, "category": "アプリ", "question": "アプリの削除の説明として、正しいものを1つ選びなさい。", "answer": ["D"], "multi": false, "choices": [{"key": "A", "text": "アプリの削除には、cybozu.com共通管理者の権限が必要である。", "help": "アプリを削除する", "url": "https://jp.kintone.help/k/ja/id/040633", "textRef": "3-8-4 このアプリを参照しているアプリ"}, {"key": "B", "text": "アプリを誤って削除してしまった場合、30日以内であればcybozu.com共通管理者がアプリを復旧できる。", "help": "アプリを削除する", "url": "https://jp.kintone.help/k/ja/id/040633", "textRef": "5-3-7 その他の管理"}, {"key": "C", "text": "アプリを削除しても、アプリ内のすべてのデータを利用できる。", "help": "アプリを削除する", "url": "https://jp.kintone.help/k/ja/id/040633", "textRef": "3-8-4 このアプリを参照しているアプリ"}, {"key": "D", "text": "削除対象のアプリをほかのアプリが参照している場合、削除対象のアプリのみを、単独で削除できない。", "help": "アプリを削除する", "url": "https://jp.kintone.help/k/ja/id/040633", "textRef": "3-8-4 このアプリを参照しているアプリ"}], "exam": "2026年4月30日改定", "exp": {"summary": "アプリの削除に必要なのはアプリ管理権限。復旧できるのは共通管理者で、削除から14日以上たつと復旧できない。", "choices": {"A": "誤り。アプリの削除に必要なのはアプリ管理権限で、cybozu.com共通管理者の権限は必要ない。", "B": "誤り。cybozu.com共通管理者が復旧できる可能性はあるが、削除してから14日以上経過したアプリは復旧できない。30日ではない。", "C": "誤り。アプリを削除すると、レコード、コメント、変更履歴、一覧・グラフ、アプリの設定など、アプリ内のすべてのデータが利用できなくなる。", "D": "正しい。削除対象のアプリを直接参照しているアプリがある場合は、そのままでは単独で削除できない。まとめて削除するか、参照を解除する必要がある。"}, "note": ""}}, {"id": "3-10", "set": 3, "no": 10, "category": "アプリ", "question": "「アプリの設定」→「フォーム」タブで設定できるフィールドとその説明として、正しいものを1つ選びなさい。", "answer": ["C"], "multi": false, "choices": [{"key": "A", "text": "時刻：時刻を入力するフィールド。\n入力した時刻は、ユーザーのタイムゾーンの設定に合わせて表示される。", "help": "kintoneで利用できるフィールド一覧", "url": "https://jp.kintone.help/k/ja/id/040513", "textRef": "2-2-6 日付と時刻"}, {"key": "B", "text": "四半期：1年のうち、四半期を入力するフィールド。\n入力した四半期は、すべてのユーザーで同じ期間が表示される。", "help": "kintoneで利用できるフィールド一覧", "url": "https://jp.kintone.help/k/ja/id/040513", "textRef": "2-2-6 日付と時刻"}, {"key": "C", "text": "日付：日付を入力するフィールド。カレンダーから日付を選択できる。\n入力した日付は、ユーザーのタイムゾーンにかかわらず、すべてのユーザーで同じ日付が表示される。", "help": "kintoneで利用できるフィールド一覧", "url": "https://jp.kintone.help/k/ja/id/040513", "textRef": "2-2-6 日付と時刻"}, {"key": "D", "text": "日時：日付と時刻を組み合わせた、日時を入力するフィールド。\n入力した日時は、ユーザーのタイムゾーンにかかわらず、すべてのユーザーで同じ日付や時刻が表示される。", "help": "kintoneで利用できるフィールド一覧", "url": "https://jp.kintone.help/k/ja/id/040513", "textRef": "2-2-6 日付と時刻"}], "exam": "2026年4月30日改定", "exp": {"summary": "タイムゾーンに沿って表示が変わるのは［日時］だけ。［日付］と［時刻］は全員に同じ値が表示される。［四半期］フィールドは存在しない。", "choices": {"A": "誤り。［時刻］フィールドは、ユーザーのタイムゾーンにかかわらず、すべてのユーザーで同じ時刻が表示される。", "B": "誤り。kintoneのフィールド一覧に［四半期］フィールドはない。", "C": "正しい。［日付］フィールドはカレンダーから選択でき、ユーザーのタイムゾーンにかかわらず、すべてのユーザーで同じ日付が表示される。", "D": "誤り。［日時］フィールドは、ユーザーのタイムゾーンに沿って表示される。"}, "note": ""}}, {"id": "3-11", "set": 3, "no": 11, "category": "アプリ", "question": "「アプリの設定」→「フォーム」タブで、「ラジオボタン」フィールドの説明として、誤っているものをすべて選びなさい。", "answer": ["A", "C"], "multi": true, "choices": [{"key": "A", "text": "複数選択が可能である。", "help": "ラジオボタン", "url": "https://jp.kintone.help/k/ja/id/040535", "textRef": "2-2-5 選択肢"}, {"key": "B", "text": "項目の順番を変更できる。", "help": "ラジオボタン", "url": "https://jp.kintone.help/k/ja/id/040535", "textRef": "2-2-5 選択肢"}, {"key": "C", "text": "最大100個までの選択肢を設定できる。", "help": "ラジオボタン", "url": "https://jp.kintone.help/k/ja/id/040535", "textRef": "2-2-5 選択肢"}, {"key": "D", "text": "初期値を設定できる。", "help": "ラジオボタン", "url": "https://jp.kintone.help/k/ja/id/040535", "textRef": "2-2-5 選択肢"}], "exam": "2026年4月30日改定", "exp": {"summary": "［ラジオボタン］は必ず1つだけ選び、初期値の設定が必須。選択肢は最大1,000個（1項目128文字まで）。", "choices": {"A": "誤り。［ラジオボタン］は選択肢の中から1つだけを選択する入力欄で、複数選択はできない。", "B": "正しい。［項目と順番］で、入力欄の左側の矢印アイコンをドラッグアンドドロップして項目の順番を変更できる。", "C": "誤り。選択肢の項目は最大128文字、1,000個まで設定できる。100個ではない。", "D": "正しい。初期値を設定できる。［ラジオボタン］の場合は必ず初期値を設定する。"}, "note": ""}}, {"id": "3-12", "set": 3, "no": 12, "category": "アプリ", "question": "レコードを「ファイルに書き出す」および「ファイルから読み込む」機能の説明として、正しいものを1つ選びなさい。", "answer": ["B"], "multi": false, "choices": [{"key": "A", "text": "最大10MB、1,000行、500列までのExcelブック形式のファイルを読み込める。", "help": "ファイルからレコードのデータをアプリに読み込む", "url": "https://jp.kintone.help/k/ja/id/040724", "textRef": "1-6-2 ファイルからのレコード読み込み"}, {"key": "B", "text": "「ファイルに書き出す」および「ファイルから読み込む」機能について、アクセス権の初期設定では、アプリの作成者だけに許可されている。", "help": "レコードのデータをファイルに書き出す際の注意事項", "url": "https://jp.kintone.help/k/ja/id/040455", "textRef": "3-6-2 アプリのアクセス権"}, {"key": "C", "text": "「関連レコード」フィールドの値は、書き出し、読み込みができる。", "help": "レコードのデータをファイルに書き出す際の注意事項", "url": "https://jp.kintone.help/k/ja/id/040455", "textRef": "1-6-1 ファイルへのレコード書き出し"}, {"key": "D", "text": "変更履歴はファイルに書き出しできる。", "help": "レコードのデータをファイルに書き出す際の注意事項", "url": "https://jp.kintone.help/k/ja/id/040455", "textRef": "1-6-1 ファイルへのレコード書き出し"}], "exam": "2026年4月30日改定", "exp": {"summary": "読み込みの上限はExcel形式（xlsx）で1MB・1,000行、CSV形式で100MB・10万行。書き出しと読み込みの権限は、初期設定ではアプリの作成者だけに許可されている。", "choices": {"A": "誤り。Excel形式（xlsx）で読み込めるのは最大1MB、1,000行まで。列は形式にかかわらず1,000列目まで対応付けできる。10MBや500列ではない。", "B": "正しい。アクセス権の初期設定では、［ファイル読み込み］と［ファイル書き出し］はアプリの作成者だけに許可されている。", "C": "誤り。［関連レコード一覧］はファイルに書き出せないデータに含まれる。", "D": "誤り。変更履歴はファイルに書き出せないデータに含まれる。"}, "note": ""}}, {"id": "3-13", "set": 3, "no": 13, "category": "アプリ", "question": "テンプレートファイルからアプリを作成する際の説明として、適切でないものを1つ選びなさい。", "answer": ["B"], "multi": false, "choices": [{"key": "A", "text": "テンプレートファイルに複数のアプリが含まれている場合、1度に複数のアプリを作成できる。", "help": "テンプレートファイルからアプリを作成する", "url": "https://jp.kintone.help/k/ja/id/040627", "textRef": "5-3-2 アプリの管理"}, {"key": "B", "text": "最大1MBまでのテンプレートファイルを読み込める。", "help": "テンプレートファイルからアプリを作成する", "url": "https://jp.kintone.help/k/ja/id/040627", "textRef": "1-1-8 方法5：テンプレートファイルからアプリを作成する"}, {"key": "C", "text": "他のドメインで利用しているkintoneから書き出したテンプレートファイルを読み込める。", "help": "テンプレートファイルからアプリを作成する", "url": "https://jp.kintone.help/k/ja/id/040627", "textRef": "1-1-8 方法5：テンプレートファイルからアプリを作成する"}, {"key": "D", "text": "テンプレートファイルを読み込んでアプリを作成するには、アプリの作成権限が必要である。", "help": "テンプレートファイルからアプリを作成する", "url": "https://jp.kintone.help/k/ja/id/040627", "textRef": "1-1-8 方法5：テンプレートファイルからアプリを作成する"}], "exam": "2026年4月30日改定", "exp": {"summary": "テンプレートファイルの読み込みは、ほかのドメインのファイルでも、複数アプリを含むzipでもできる。前提としてアプリ作成権限が必要。", "choices": {"A": "適切。zipファイルに複数のアプリテンプレートが含まれている場合、1度に複数のアプリを作成できる。", "B": "適切でない。（ヘルプで直接は確認できず）テンプレートファイルからの作成のヘルプに「最大1MB」という制限の記載はない。1MBはExcelファイルからアプリを作成するときの上限。", "C": "適切。ほかのドメインで利用しているkintoneから書き出したテンプレートファイルも読み込める。", "D": "適切。アプリ作成権限が付与されていないと［アプリを作成する］アイコンが表示されず、テンプレートファイルからも作成できない。"}, "note": ""}}, {"id": "3-14", "set": 3, "no": 14, "category": "アプリ", "question": "言語ごとの名称を設定できる項目として、正しいものをすべて選びなさい。", "answer": ["A", "B", "C"], "multi": true, "choices": [{"key": "A", "text": "グループ内に配置したフィールド", "help": "言語ごとの名称を設定する", "url": "https://jp.kintone.help/k/ja/id/040557", "textRef": "3-7-2 言語ごとの名称"}, {"key": "B", "text": "アプリの説明", "help": "言語ごとの名称を設定する", "url": "https://jp.kintone.help/k/ja/id/040557", "textRef": "3-7-2 言語ごとの名称"}, {"key": "C", "text": "グラフ名", "help": "言語ごとの名称を設定する", "url": "https://jp.kintone.help/k/ja/id/040557", "textRef": "3-7-2 言語ごとの名称"}, {"key": "D", "text": "ラベルフィールド", "help": "言語ごとの名称を設定する", "url": "https://jp.kintone.help/k/ja/id/040557", "textRef": "3-7-2 言語ごとの名称"}], "exam": "2026年4月30日改定", "exp": {"summary": "言語ごとの名称を設定できないのは［ラベル］［スペース］［罫線］［グループ］自体。グループ内に置いたフィールドは設定できる。", "choices": {"A": "正しい。［グループ］自体は設定できないが、［グループ］内に配置したフィールドは言語ごとの名称を設定できる。", "B": "正しい。アプリの説明は、言語ごとの名称を設定できる項目に含まれる。", "C": "正しい。グラフ名は、言語ごとの名称を設定できる項目に含まれる。", "D": "誤り。［ラベル］［スペース］［罫線］［グループ］は言語ごとの名称を設定できない。"}, "note": ""}}, {"id": "3-15", "set": 3, "no": 15, "category": "アプリ", "question": "アプリの作成方法として、正しいものをすべて選びなさい。", "answer": ["A", "D"], "multi": true, "choices": [{"key": "A", "text": "ほかのドメインで利用しているkintoneから書き出したテンプレートファイルを読み込んで、アプリを作成できる。", "help": "テンプレートファイルからアプリを作成する", "url": "https://jp.kintone.help/k/ja/id/040627", "textRef": "1-1-8 方法5：テンプレートファイルからアプリを作成する"}, {"key": "B", "text": "管理権限を持たないアプリでも、再利用して新しくアプリを作成できる。", "help": "ほかのアプリを再利用して新しく作成する（アプリのコピー）", "url": "https://jp.kintone.help/k/ja/id/040630", "textRef": "1-1-9 方法6：ほかのアプリを再利用して新しく作成する（アプリのコピー）"}, {"key": "C", "text": "Excelファイルを読み込んでアプリを作成すると、データの内容に対して適切なフィールドタイプが自動で設定できる。", "help": "Excelファイルからアプリを作成する", "url": "https://jp.kintone.help/k/ja/id/040625", "textRef": "1-1-6 方法3：Excelファイルからアプリを作成する"}, {"key": "D", "text": "「このアプリパックを追加」をクリックすると、関連性のある複数のアプリをまとめて一度に作成できる。", "help": "サンプルアプリを追加する", "url": "https://jp.kintone.help/k/ja/id/040622", "textRef": "1-1-4 方法1：サンプルアプリを追加する"}], "exam": "2026年4月30日改定", "exp": {"summary": "アプリの再利用にはアプリ管理権限が必要。アプリパックを使うと、関連する複数のアプリをまとめて追加できる。", "choices": {"A": "正しい。ほかのドメインで利用しているkintoneから書き出したテンプレートファイルも読み込んでアプリを作成できる。", "B": "誤り。アプリを再利用して作成するには、そのアプリの管理権限が必要。管理権限のあるアプリがないと［ほかのアプリを再利用］は表示されない。", "C": "誤り（公式の正答による）。ヘルプでは、Excelの先頭100行のデータをもとに、おすすめのフィールドタイプが自動で設定されると説明している。ただし［複数選択］や［チェックボックス］は選べず、作成後にフィールドタイプは変更できないため、内容に合ったタイプを確認・選択する必要がある。", "D": "正しい。アプリストアで［このアプリパックを追加］をクリックすると、アプリパックとして関連性のある複数のアプリをまとめて追加できる。"}, "note": "C：ヘルプ（040625）には「フィールドタイプには、Excelファイルの先頭100行のデータをもとに、おすすめのものが自動的に設定されています」とあり、記述は事実に近く見える。公式の正答ではCは誤り扱い。「適切なフィールドタイプが自動で設定できる」とまでは言い切れない（確認・変更が前提で、選べないタイプもある）という趣旨と推測する。"}}, {"id": "3-16", "set": 3, "no": 16, "category": "アプリ", "question": "Excelファイルからアプリを作成する際の説明として、誤っているものをすべて選びなさい。", "answer": ["B", "C", "D"], "multi": true, "choices": [{"key": "A", "text": "最大1MB、1,000行×500列までのExcelファイルを読み込める。", "help": "Excelファイルからアプリを作成する", "url": "https://jp.kintone.help/k/ja/id/040625", "textRef": "1-1-6 方法3：Excelファイルからアプリを作成する"}, {"key": "B", "text": "帳簿や伝票のような、複雑なレイアウトの帳票形式のファイルも読み込める。", "help": "Excelファイルからアプリを作成する", "url": "https://jp.kintone.help/k/ja/id/040625", "textRef": "1-1-6 方法3：Excelファイルからアプリを作成する"}, {"key": "C", "text": "ブック形式で複数のシートが含まれているファイルの場合、全てのシートが同一の表形式であればまとめて読み込める。", "help": "Excelファイルからアプリを作成する", "url": "https://jp.kintone.help/k/ja/id/040625", "textRef": "1-1-6 方法3：Excelファイルからアプリを作成する"}, {"key": "D", "text": "ファイルがパスワードで保護されている場合、作成したアプリもパスワードで保護される。", "help": "Excelファイルからアプリを作成する", "url": "https://jp.kintone.help/k/ja/id/040625", "textRef": "1-1-6 方法3：Excelファイルからアプリを作成する"}], "exam": "2026年4月30日改定", "exp": {"summary": "Excelからの作成は、1MB・1,000行・500列までの単純な表形式で、1シートだけを指定する。パスワード保護は事前に解除が必要。", "choices": {"A": "正しい。アプリを作成できるのは最大1MB、1,000行、500列までのファイル。", "B": "誤り。行と列で単純に構成された表形式にする必要がある。帳簿や伝票のような複雑なレイアウトの帳票形式は読み込めない。", "C": "誤り。複数のシートを含むブック形式のファイルでは、読み込むシートを1シートだけ指定できる。まとめては読み込めない。", "D": "誤り。パスワードで保護されたファイルは読み込めないため、事前に解除する必要がある。アプリがパスワードで保護されることもない。"}, "note": ""}}, {"id": "3-17", "set": 3, "no": 17, "category": "アプリ", "question": "グラフ設定と定期レポートの説明として、正しいものをすべて選びなさい。", "answer": ["B", "D"], "multi": true, "choices": [{"key": "A", "text": "グラフを削除すると、削除した時点からの定期レポートは閲覧できなくなるが、過去の定期レポートは閲覧できる。", "help": "定期レポートとは", "url": "https://jp.kintone.help/k/ja/id/040582", "textRef": "1-5-3 グラフ設定と定期レポート"}, {"key": "B", "text": "グラフの作成や変更、削除を行うには、アプリの管理権限が必要である。", "help": "［アプリの設定］画面からグラフを追加する", "url": "https://jp.kintone.help/k/ja/id/040586", "textRef": "1-5-3 グラフ設定と定期レポート"}, {"key": "C", "text": "定期レポートは、グラフの種類に関わらず設定できる。", "help": "定期レポートとは", "url": "https://jp.kintone.help/k/ja/id/040582", "textRef": "1-5-3 グラフ設定と定期レポート"}, {"key": "D", "text": "アクセス権で閲覧が制限されているレコードが集計対象となっている場合でも、定期レポートを閲覧できる。", "help": "定期レポートとは", "url": "https://jp.kintone.help/k/ja/id/040582", "textRef": "1-5-3 グラフ設定と定期レポート"}], "exam": "2026年4月30日改定", "exp": {"summary": "グラフを削除すると過去の定期レポートも消える。クロス集計表には定期レポートを設定できない。", "choices": {"A": "誤り。グラフを削除すると、記録された過去の定期レポートも削除され、閲覧できなくなる。", "B": "正しい。グラフは、アプリの管理者が［アプリの設定］画面で追加・保存するもので、作成・変更・削除にはアプリの管理権限が必要。", "C": "誤り。［グラフの種類］で［クロス集計表］を選んでいる場合は、定期レポートを設定できない。", "D": "正しい。定期レポートを設定したユーザー以外も、閲覧が制限されたレコードが集計対象になっていても閲覧できる。ただし、集計に使うフィールドの閲覧が制限されている場合は閲覧できない。"}, "note": ""}}, {"id": "3-18", "set": 3, "no": 18, "category": "アプリ", "question": "家賃に共益費を足した数値を、100円単位になるようにそれ以下の桁を四捨五入したい。（例：1230円 → 1200円）\nROUND関数を使った計算式として、正しいものを1つ選びなさい。", "answer": ["D"], "multi": false, "choices": [{"key": "A", "text": "ROUND(家賃+共益費,2)", "help": "四捨五入、切り捨て、切り上げするときの設定の使い分け", "url": "https://jp.kintone.help/k/ja/id/040508", "textRef": "2-4-3 計算式"}, {"key": "B", "text": "ROUNDDOWN(家賃+共益費,2)", "help": "四捨五入、切り捨て、切り上げするときの設定の使い分け", "url": "https://jp.kintone.help/k/ja/id/040508", "textRef": "2-4-3 計算式"}, {"key": "C", "text": "ROUNDUP(家賃+共益費,-2)", "help": "四捨五入、切り捨て、切り上げするときの設定の使い分け", "url": "https://jp.kintone.help/k/ja/id/040508", "textRef": "2-4-3 計算式"}, {"key": "D", "text": "ROUND(家賃+共益費,-2)", "help": "四捨五入、切り捨て、切り上げするときの設定の使い分け", "url": "https://jp.kintone.help/k/ja/id/040508", "textRef": "2-4-3 計算式"}], "exam": "2026年4月30日改定", "exp": {"summary": "ROUND関数の桁数は、0で小数第1位、-1で1の位、-2で10の位を処理する。100円単位にするには -2 を指定する。", "choices": {"A": "誤り。桁数「2」は小数第3位で四捨五入するため、小数第2位までの値になる。100円単位にはならない。", "B": "誤り。ROUNDDOWNは切り捨ての関数で、桁数「2」は小数点以下の処理になる。", "C": "誤り。桁数「-2」で100円単位にはなるが、ROUNDUPは切り上げなので、1230円は1300円になる。", "D": "正しい。整数部分を処理するときは0または負の数を指定する。桁数「-2」で10の位を四捨五入するため、1230円は1200円になる。"}, "note": ""}}, {"id": "3-19", "set": 3, "no": 19, "category": "アプリ", "question": "アプリの設定画面で、画面上部に「反映前の変更があります」というバナーが表示されている。\n状況の説明として、適切でないものをすべて選びなさい。", "answer": ["B", "D"], "multi": true, "choices": [{"key": "A", "text": "設定タブの[アプリの動作テスト]をクリックすると、反映前の変更内容の動作を確認できる。", "help": "アプリの設定内容を反映する", "url": "https://jp.kintone.help/k/ja/id/040473#app_settings_app_changesettings_20", "textRef": "2-1-2 フォームの設定"}, {"key": "B", "text": "「フォーム」タブの「フォームを保存」をクリックすると、フォームの内容が運用環境に反映される。", "help": "アプリの設定内容を反映する", "url": "https://jp.kintone.help/k/ja/id/040473#app_settings_app_changesettings_20", "textRef": "2-1-2 フォームの設定"}, {"key": "C", "text": "自分が実施した変更だけでなく、他のユーザーの未反映の変更があると表示される。", "help": "アプリの設定内容を反映する", "url": "https://jp.kintone.help/k/ja/id/040473#app_settings_app_changesettings_20", "textRef": "2-1-2 フォームの設定"}, {"key": "D", "text": "未反映の設定変更について、最終更新者や日時を確認できる。", "help": "アプリの設定内容を反映する", "url": "https://jp.kintone.help/k/ja/id/040473#app_settings_app_changesettings_20", "textRef": "2-1-2 フォームの設定"}], "exam": "2026年4月30日改定", "exp": {"summary": "［フォームを保存］は下書き保存にすぎない。運用環境に反映するには［アプリを更新］が必要。", "choices": {"A": "適切。［設定］タブの［アプリの動作テスト］から、運用環境に反映する前の設定変更の動作を確認できる。", "B": "適切でない。［フォームを保存］をクリックした時点では変更内容が下書き保存されるだけ。運用環境に反映するには［アプリを更新］をクリックする必要がある。", "C": "適切。アプリに反映していない設定変更があるとバナーが表示される。（ほかのユーザーの変更も対象になることは、ヘルプで直接は確認できず）", "D": "適切でない。（ヘルプで直接は確認できず）バナーとアプリ管理画面の［ステータス］（［変更あり］）で未反映の変更があることはわかるが、最終更新者や日時を確認できるという記載はない。"}, "note": ""}}, {"id": "3-20", "set": 3, "no": 20, "category": "アプリ", "question": "「リンク」フィールドの説明として、正しいものをすべて選びなさい。", "answer": ["B", "C"], "multi": true, "choices": [{"key": "A", "text": "入力されたWebサイトのアドレスにカーソルを合わせると、リンク先のサムネイルが表示される。", "help": "リンク", "url": "https://jp.kintone.help/k/ja/id/040532", "textRef": "2-2-8 リンク"}, {"key": "B", "text": "入力された電話番号をクリックすると、Skypeなどが起動して、電話をかけることができる。", "help": "リンク", "url": "https://jp.kintone.help/k/ja/id/040532", "textRef": "2-2-8 リンク"}, {"key": "C", "text": "入力されたメールアドレスをクリックすると、メールソフトが起動して、メールを送信できる。", "help": "リンク", "url": "https://jp.kintone.help/k/ja/id/040532", "textRef": "2-2-8 リンク"}, {"key": "D", "text": "入力値に対して、最小文字数と最大文字数を指定できない。", "help": "リンク", "url": "https://jp.kintone.help/k/ja/id/040532", "textRef": "2-2-8 リンク"}], "exam": "2026年4月30日改定", "exp": {"summary": "［リンク］はWebサイトのアドレス・電話番号・メールアドレスをリンクに変換するフィールドで、最小／最大文字数を指定できる。", "choices": {"A": "誤り。（ヘルプで直接は確認できず）［リンク］フィールドのヘルプでは、Webサイトのアドレスをクリックすると別タブでページが開くとだけ説明しており、サムネイル表示の記載はない。", "B": "正しい。電話番号をクリックすると電話をかけられる。（Skypeなどのアプリが起動する点は、ヘルプで直接は確認できず）", "C": "正しい。メールアドレスをクリックすると、Outlookなどのメールソフトが起動してメールを送信できる。", "D": "誤り。［文字数］で最小文字数と最大文字数を、どちらか一方または両方とも指定できる。"}, "note": ""}}, {"id": "3-21", "set": 3, "no": 21, "category": "アプリ", "question": "フォームを装飾するフィールドの説明として、適切なものを1つ選びなさい。", "answer": ["D"], "multi": false, "choices": [{"key": "A", "text": "「スペース」フィールドのサイズ間隔は、決まっている。", "help": "kintoneで利用できるフィールド一覧", "url": "https://jp.kintone.help/k/ja/id/040513", "textRef": "2-2-10 表示のみのフィールド"}, {"key": "B", "text": "グループ化したフィールドは、常に非表示の状態になる。", "help": "kintoneで利用できるフィールド一覧", "url": "https://jp.kintone.help/k/ja/id/040513", "textRef": "2-2-10 表示のみのフィールド"}, {"key": "C", "text": "「罫線」は線の種類を選択できる。", "help": "kintoneで利用できるフィールド一覧", "url": "https://jp.kintone.help/k/ja/id/040513", "textRef": "2-2-10 表示のみのフィールド"}, {"key": "D", "text": "「ラベル」は表示のみのフィールドで、レコード追加時にデータを入力できない。", "help": "kintoneで利用できるフィールド一覧", "url": "https://jp.kintone.help/k/ja/id/040513", "textRef": "2-2-2 ラベル"}], "exam": "2026年4月30日改定", "exp": {"summary": "［スペース］はドラッグでサイズを変えられる。［グループ］は初期表示を折りたたむか展開するか選べる。［罫線］で変えられるのは長さだけ。", "choices": {"A": "不適切。［スペース］フィールドは右端や下端をドラッグしてサイズを変更できる。", "B": "不適切。［グループ］はグループごとに折りたたんだり展開したりでき、［グループ内のフィールドを表示する］で初期表示を展開した状態にもできる。", "C": "不適切。［罫線］の設定項目は［要素ID］だけで、変更できるのは右端のドラッグによる長さ。線の種類を選択する設定は記載されていない。", "D": "適切。［ラベル］はフォームに見出しや説明文を表示するフィールドで、レコード追加時にデータを入力する欄ではない。"}, "note": ""}}, {"id": "3-22", "set": 3, "no": 22, "category": "アプリ", "question": "レコードの一覧画面で編集できるフィールドの種類として、正しいものをすべて選びなさい。", "answer": ["A", "B", "D"], "multi": true, "choices": [{"key": "A", "text": "ユーザー選択", "help": "［レコードの一覧］画面でレコードを編集／削除する", "url": "https://jp.kintone.help/k/ja/id/040718", "textRef": "1-4-4 一覧でのレコードの編集"}, {"key": "B", "text": "リンク", "help": "［レコードの一覧］画面でレコードを編集／削除する", "url": "https://jp.kintone.help/k/ja/id/040718", "textRef": "1-4-4 一覧でのレコードの編集"}, {"key": "C", "text": "ラベル", "help": "［レコードの一覧］画面でレコードを編集／削除する", "url": "https://jp.kintone.help/k/ja/id/040718", "textRef": "1-4-4 一覧でのレコードの編集"}, {"key": "D", "text": "文字列（複数行）", "help": "［レコードの一覧］画面でレコードを編集／削除する", "url": "https://jp.kintone.help/k/ja/id/040718", "textRef": "1-4-4 一覧でのレコードの編集"}], "exam": "2026年4月30日改定", "exp": {"summary": "一覧画面で編集できるのは入力系のフィールド（文字列、数値、選択系、日時系、リンク、ユーザー／組織／グループ選択）。ラベルなどの装飾用フィールドは編集できない。", "choices": {"A": "正しい。［ユーザー選択］は［レコードの一覧］画面で編集できるフィールドに含まれる。", "B": "正しい。［リンク］は［レコードの一覧］画面で編集できるフィールドに含まれる。", "C": "誤り。［ラベル］は［レコードの一覧］画面で編集できるフィールドに含まれない（フォームを装飾するフィールドで、値を持たない）。", "D": "正しい。［文字列（複数行）］は［レコードの一覧］画面で編集できるフィールドに含まれる。"}, "note": ""}}, {"id": "3-23", "set": 3, "no": 23, "category": "アプリ", "question": "レコードの作成、更新時に自動入力されるフィールドの種類として、適切なものをすべて選びなさい。", "answer": ["A", "C", "D"], "multi": true, "choices": [{"key": "A", "text": "レコード番号", "help": "レコード情報を表示するフィールド", "url": "https://jp.kintone.help/k/ja/id/040513#form_form_parts_50", "textRef": "2-2-11 自動入力されるフィールド"}, {"key": "B", "text": "ラベル", "help": "レコード情報を表示するフィールド", "url": "https://jp.kintone.help/k/ja/id/040513#form_form_parts_50", "textRef": "2-2-2 ラベル"}, {"key": "C", "text": "作成者", "help": "レコード情報を表示するフィールド", "url": "https://jp.kintone.help/k/ja/id/040513#form_form_parts_50", "textRef": "2-2-11 自動入力されるフィールド"}, {"key": "D", "text": "更新日時", "help": "レコード情報を表示するフィールド", "url": "https://jp.kintone.help/k/ja/id/040513#form_form_parts_50", "textRef": "2-2-11 自動入力されるフィールド"}], "exam": "2026年4月30日改定", "exp": {"summary": "自動入力されるのは「レコード情報」の5つ：レコード番号、作成者、作成日時、更新者、更新日時。", "choices": {"A": "適切。［レコード番号］は、レコード情報を表示するフィールドとして自動で入力される。", "B": "不適切。［ラベル］はフォームを装飾するフィールドで、レコード情報を表示するフィールドではない。", "C": "適切。［作成者］は、レコード情報を表示するフィールドとして自動で入力される。", "D": "適切。［更新日時］は、レコード情報を表示するフィールドとして自動で入力される。"}, "note": ""}}, {"id": "3-24", "set": 3, "no": 24, "category": "アプリ", "question": "数値の計算の説明として、誤っているものを1つ選びなさい。", "answer": ["C"], "multi": false, "choices": [{"key": "A", "text": "「計算」フィールド、または「文字列（1行）」フィールドに計算式を設定し、数値の計算をする。", "help": "計算式の基本", "url": "https://jp.kintone.help/k/ja/id/040509#autocalc_set_autocalc_10", "textRef": "2-4-1 計算"}, {"key": "B", "text": "数値の計算式で使用できる演算子は、「+」、「-」、「*」、「/」、「^」などである。", "help": "演算子と関数の一覧", "url": "https://jp.kintone.help/k/ja/id/040499", "textRef": "2-4-3 計算式"}, {"key": "C", "text": "ROUND関数や「計算」フィールドの「小数点以下の表示桁数」の設定は、「高度な設定」の「小数部の桁数」よりも優先される。", "help": "四捨五入、切り捨て、切り上げするときの設定の使い分け", "url": "https://jp.kintone.help/k/ja/id/040508", "textRef": "2-4-3 計算式"}, {"key": "D", "text": "(フィールドA - 1000) * 2 のような、（）を使った計算ができる。", "help": "数値の計算", "url": "https://jp.kintone.help/k/ja/id/040503#autocalc_example_operators_20", "textRef": "2-4-3 計算式"}], "exam": "2026年4月30日改定", "exp": {"summary": "端数処理の優先順位は「高度な設定」が最優先。ROUND関数や［小数点以下の表示桁数］よりも優先される。", "choices": {"A": "正しい。計算式は［計算］フィールドまたは［文字列（1行）］フィールドに設定して数値を計算する。", "B": "正しい。数値の計算式では「+」「-」「*」「/」「^」（べき算）などの演算子が使える。", "C": "誤り。ROUND関数や［小数点以下の表示桁数］の設定よりも、［高度な設定］の内容が優先される。逆ではない。", "D": "正しい。(フィールドA - 1000) * 2 のように、( ) を使った計算ができる。"}, "note": ""}}, {"id": "3-25", "set": 3, "no": 25, "category": "アプリ", "question": "アプリアクションで、コピー先に「ルックアップ」フィールドを指定したい。コピー元のフィールドとして、適切なものをすべて選びなさい。", "answer": ["A", "C"], "multi": true, "choices": [{"key": "A", "text": "文字列（1行）", "help": "アプリアクションに設定できるフィールドの組み合わせ", "url": "https://jp.kintone.help/k/ja/id/040486", "textRef": "3-7-5 アクション（アプリアクション）"}, {"key": "B", "text": "文字列（複数行）", "help": "アプリアクションに設定できるフィールドの組み合わせ", "url": "https://jp.kintone.help/k/ja/id/040486", "textRef": "3-7-5 アクション（アプリアクション）"}, {"key": "C", "text": "数値", "help": "アプリアクションに設定できるフィールドの組み合わせ", "url": "https://jp.kintone.help/k/ja/id/040486", "textRef": "3-7-5 アクション（アプリアクション）"}, {"key": "D", "text": "ドロップダウン", "help": "アプリアクションに設定できるフィールドの組み合わせ", "url": "https://jp.kintone.help/k/ja/id/040486", "textRef": "3-7-5 アクション（アプリアクション）"}], "exam": "2026年4月30日改定", "exp": {"summary": "コピー先の［ルックアップ］に指定できるのは、ルックアップのコピー元と同じ型のフィールド（文字列（1行）、数値、リンクなど）。", "choices": {"A": "適切。コピー元が［文字列（1行）］の場合、コピー元が［文字列（1行）］または［リンク］の［ルックアップ］をコピー先に指定できる。", "B": "不適切。［文字列（複数行）］のコピー先に指定できるのは［文字列（複数行）］だけ。", "C": "適切。コピー元が［数値］の場合、コピー元が［数値］または［レコード番号］の［ルックアップ］をコピー先に指定できる。", "D": "不適切。［ドロップダウン］のコピー先に指定できるのは［ドロップダウン］で、［ルックアップ］は指定できない。"}, "note": ""}}, {"id": "3-26", "set": 3, "no": 26, "category": "スペース", "question": "スペースの作成に関する説明として、正しいものを1つ選びなさい。", "answer": ["A"], "multi": false, "choices": [{"key": "A", "text": "スペースを「はじめから作る」場合、「スペースの参加/退会、スレッドのフォロー/フォロー解除を禁止する」を選択すると、スペースに参加していないユーザーに対して、スペースへの参加と、スレッドのフォローが禁止される。", "help": "スペースを作成する", "url": "https://jp.kintone.help/k/ja/id/040692", "textRef": "4-1-2 スペースの追加"}, {"key": "B", "text": "ゲストスペースは、cybozu.com共通管理者のみが作成できる。", "help": "ゲストスペースを追加する", "url": "https://jp.kintone.help/k/ja/id/040648", "textRef": "4-3-2 ゲストスペースの追加"}, {"key": "C", "text": "スペースにメンバーを追加するには、組織／グループを選択したあとに追加する必要がある。", "help": "スペースを作成する", "url": "https://jp.kintone.help/k/ja/id/040692", "textRef": "4-1-2 スペースの追加"}, {"key": "D", "text": "スペースを作成する際、「おすすめから選ぶ」を選択して作成できる。", "help": "スペースを作成する", "url": "https://jp.kintone.help/k/ja/id/040692", "textRef": "4-1-2 スペースの追加"}], "exam": "2026年4月30日改定", "exp": {"summary": "スペースの作成方法は「はじめから作る」と「スペーステンプレート」の2つ。ゲストスペースは、作成を許可されたユーザーと共通管理者が作成できる。", "choices": {"A": "正しい。この設定にチェックを入れると、参加メンバーは退会とフォロー解除ができなくなり、未参加のユーザーはスペースへの参加とスレッドのフォローができなくなる。", "B": "誤り。［kintoneシステム管理］で［ゲストスペースの作成］が許可されたユーザーも作成できる（初期設定では共通管理者だけに許可されている）。", "C": "誤り。ユーザーを検索して直接追加できる。組織やグループからの選択は方法の一つにすぎない。", "D": "誤り。作成方法は「はじめから作る」と「スペーステンプレートを使用する」の2つで、「おすすめから選ぶ」はない。"}, "note": ""}}, {"id": "3-27", "set": 3, "no": 27, "category": "スペース", "question": "スペースで宛先を指定してコメントを書き込む際の注意点として、正しいものをすべて選びなさい。", "answer": ["C", "D"], "multi": true, "choices": [{"key": "A", "text": "非公開スペースで宛先を指定してコメントを書き込むと、スペースに参加していなくても通知が送信される。", "help": "コメントの宛先を指定するには", "url": "https://jp.kintone.help/k/ja/id/040291", "textRef": "4-2-2 スレッド"}, {"key": "B", "text": "非公開スペースでは、「Everyone」グループを宛先に指定してコメントしても、スペースに参加中のユーザーには通知が送信されない。", "help": "コメントの宛先を指定するには", "url": "https://jp.kintone.help/k/ja/id/040291", "textRef": "4-2-2 スレッド"}, {"key": "C", "text": "公開スペースで宛先を指定してコメントを書き込むと、スペースをフォローしているかどうかにかかわらず、相手に通知が送信される。", "help": "コメントの宛先を指定するには", "url": "https://jp.kintone.help/k/ja/id/040291", "textRef": "4-2-2 スレッド"}, {"key": "D", "text": "スペースの宛先に組織やグループを指定する場合、指定した組織やグループをクリックして、「宛先になるユーザーを確認」をクリックすると、宛先になるユーザーが確認できる。", "help": "コメントの宛先を指定するには", "url": "https://jp.kintone.help/k/ja/id/040291", "textRef": "4-2-2 スレッド"}], "exam": "2026年4月30日改定", "exp": {"summary": "非公開スペースでは、参加していないユーザーは宛先に指定できない。組織やグループを指定すると、参加中のユーザーだけが宛先になる。", "choices": {"A": "誤り。非公開のスペースでは、スペースに参加していないユーザーはコメントを閲覧できないため、宛先に指定できない。", "B": "誤り。組織やグループを宛先にした場合、宛先から外れるのは未参加のユーザーだけ。参加中のユーザーには通知が届く。", "C": "正しい。宛先を指定すると、相手に「自分宛」の通知が届く。（フォローの有無に関係しないことは、ヘルプで直接は確認できず）", "D": "正しい。宛先に組織やグループを指定した場合、それをクリックして［宛先になるユーザーを確認］をクリックすると、宛先になるユーザーを確認できる。"}, "note": ""}}, {"id": "3-28", "set": 3, "no": 28, "category": "スペース", "question": "スペースの作成に関する説明として、誤っているものをすべて選びなさい。", "answer": ["B", "C"], "multi": true, "choices": [{"key": "A", "text": "スペースにアプリを作成できるユーザーを、スペースの管理者に限定することができる。", "help": "スペースごとに、アプリを作成できるユーザーを限定する", "url": "https://jp.kintone.help/k/ja/id/040695", "textRef": "4-1-3 スペースの設定の変更"}, {"key": "B", "text": "メンバーに組織やグループを追加した場合も、ユーザーごとの退会ができる。", "help": "スペースのメンバーを追加／削除する", "url": "https://jp.kintone.help/k/ja/id/040703", "textRef": "4-1-3 スペースの設定の変更"}, {"key": "C", "text": "「スペースのポータルと複数のスレッドを使用する」機能を一度有効にしても、元に戻せる。", "help": "スペースのポータルの表示コンテンツ／カスタマイズ", "url": "https://jp.kintone.help/k/ja/id/040697", "textRef": "4-1-3 スペースの設定の変更"}, {"key": "D", "text": "スペーステンプレートを使用してスペースを作成できる。", "help": "スペーステンプレートとは", "url": "https://jp.kintone.help/k/ja/id/04079", "textRef": "4-1-2 スペースの追加"}], "exam": "2026年4月30日改定", "exp": {"summary": "組織やグループで追加したメンバーは個別に退会できない。「ポータルと複数のスレッド」は一度有効にすると元に戻せない。", "choices": {"A": "正しい。［アプリ作成できるユーザーをスペースの管理者に限定する］で、アプリを作成できるユーザーをスペースの管理者に限定できる。", "B": "誤り。メンバーに組織やグループを追加した場合は、ユーザーごとの退会ができない。", "C": "誤り。
